<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GTA العراق 🔥</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(typeof THREE==='undefined')document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Tahoma,sans-serif;user-select:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#loadmsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
  background:#111;font-size:20px;z-index:50;flex-direction:column;gap:14px}
.spin{width:44px;height:44px;border:4px solid #333;border-top-color:#ffd23c;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:10}
#topbar{position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;align-items:flex-start}
#stats{background:rgba(0,0,0,.55);border-radius:12px;padding:8px 14px;color:#fff;font-weight:800;font-size:15px;line-height:1.7;border:1px solid rgba(255,255,255,.15)}
#wanted{font-size:18px;letter-spacing:2px}
#mmap{border-radius:12px;border:2px solid rgba(255,255,255,.25);background:#0d1a0d}
#speed{position:absolute;bottom:110px;right:16px;color:#fff;font-weight:900;font-size:20px;
  text-shadow:0 2px 6px #000;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:10px}
#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#ffd23c;
  padding:10px 22px;border-radius:12px;font-weight:800;font-size:15px;opacity:0;transition:opacity .3s;white-space:nowrap}
#joy{position:absolute;bottom:24px;left:24px;width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#joyk{position:absolute;top:35px;left:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
.gbtn{position:absolute;pointer-events:auto;border:none;border-radius:50%;font-size:26px;
  width:64px;height:64px;background:rgba(255,210,60,.85);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.gbtn:active{transform:scale(.92)}
#btn-jump{bottom:100px;left:36px}
#btn-car{bottom:24px;left:160px;display:none}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loadmsg"><div class="spin"></div><div>جاري تحميل المدينة...</div></div>
<div id="hud">
  <div id="topbar">
    <canvas id="mmap" width="120" height="120"></canvas>
    <div id="stats"><div id="wanted">☆☆☆</div><div id="cash">500 $</div></div>
  </div>
  <div id="msg"></div>
  <div id="speed"></div>
  <div id="joy"><div id="joyk"></div></div>
  <button class="gbtn" id="btn-jump">⬆️</button>
  <button class="gbtn" id="btn-car">🚗</button>
  <div id="hint">WASD للحركة • E لركوب السيارة • مسافة للقفز</div>
</div>
<script src="gta1.js"></script>
<script src="gta2.js"></script>
</body>
</html>
