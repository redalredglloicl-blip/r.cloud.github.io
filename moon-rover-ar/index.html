<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>صانع الخلفيات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:#0d1117;color:#fff;min-height:100dvh}
header{padding:18px 16px 10px;text-align:center}
header h1{font-size:24px;font-weight:800}
header p{font-size:13px;opacity:.6;margin-top:4px}
#previewWrap{display:flex;justify-content:center;padding:10px 16px}
#phone{width:min(78vw,300px);aspect-ratio:1170/2532;border-radius:28px;overflow:hidden;position:relative;background:#222;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12)}
#pv{width:100%;height:100%;display:block}
#panel{padding:8px 16px 40px;max-width:520px;margin:0 auto}
.card{background:#161b22;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-top:12px}
.card h3{font-size:15px;margin-bottom:10px;color:#a4e34a}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:14px}
.row label{opacity:.85}
input[type=range]{flex:1;accent-color:#a4e34a}
input[type=text]{background:#0d1117;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;padding:9px 12px;font-size:14px;width:100%;font-family:inherit}
.seg{display:flex;background:#0d1117;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;color:#fff;font-size:13px;padding:8px;border-radius:9px;font-family:inherit;cursor:pointer}
.seg button.on{background:#a4e34a;color:#0d1117;font-weight:800}
.tgl{width:52px;height:30px;border-radius:15px;background:#333;border:none;position:relative;cursor:pointer;flex-shrink:0}
.tgl::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:#a4e34a}
.tgl.on::after{transform:translateX(-22px)}
.bgrow{display:flex;gap:10px}
.bgthumb{width:64px;height:100px;border-radius:10px;object-fit:cover;border:2px solid transparent;cursor:pointer}
.bgthumb.on{border-color:#a4e34a}
.upbtn{flex:1;border:2px dashed rgba(255,255,255,.25);border-radius:12px;background:transparent;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;min-height:100px}
#dlBtn{display:block;width:100%;margin-top:16px;background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #2a5a10}
#dlBtn:active{transform:translateY(2px);box-shadow:none}
.hint{font-size:12px;opacity:.55;text-align:center;margin-top:10px;line-height:1.9}
.vtag{text-align:center;font-size:11px;opacity:.4;padding:14px}
</style>
</head>
<body>
<header>
 <h1>🎨 صانع الخلفيات</h1>
 <p>صمم خلفية تلفونك مثل الفيديو — ساعة حية وودجتات</p>
</header>
<div id="previewWrap"><div id="phone"><canvas id="pv"></canvas></div></div>
<div id="panel">
 <div class="card">
  <h3>🖼️ الخلفية</h3>
  <div class="bgrow">
   <img class="bgthumb on" id="presetThumb" src="wp-city.jpg" alt="جاهزة">
   <button class="upbtn" id="upBtn">📷<br>ارفع صورتك</button>
   <input type="file" id="fileIn" accept="image/*" hidden>
  </div>
 </div>
 <div class="card">
  <h3>🕐 الساعة</h3>
  <div class="row"><label>إظهار الساعة</label><button class="tgl on" id="tClock"></button></div>
  <div class="row"><label>الحجم</label><input type="range" id="rClockSize" min="12" max="34" value="24"></div>
  <div class="row"><label>اللون</label><div class="seg" id="sClockColor"><button data-v="white" class="on">أبيض</button><button data-v="black">أسود</button></div></div>
  <div class="row"><label>الشكل</label><div class="seg" id="sClockW"><button data-v="200" class="on">رفيع</button><button data-v="700">عريض</button></div></div>
  <div class="row"><label>النظام</label><div class="seg" id="sClock12"><button data-v="24" class="on">24</button><button data-v="12">12</button></div></div>
 </div>
 <div class="card">
  <h3>📅 التاريخ</h3>
  <div class="row"><label>إظهار التاريخ</label><button class="tgl on" id="tDate"></button></div>
  <div class="row"><label>اللغة</label><div class="seg" id="sDateLang"><button data-v="ar" class="on">عربي</button><button data-v="en">English</button></div></div>
 </div>
 <div class="card">
  <h3>🎵 ودجت الموسيقى</h3>
  <div class="row"><label>إظهار الودجت</label><button class="tgl on" id="tMusic"></button></div>
  <div class="row"><input type="text" id="inSong" placeholder="اسم الأغنية" value="أغنيتي المفضلة"></div>
  <div class="row"><input type="text" id="inArtist" placeholder="اسم الفنان" value="فنان"></div>
 </div>
 <div class="card">
  <h3>📐 حجم التصدير</h3>
  <div class="seg" id="sSize"><button data-v="iphone" class="on">iPhone</button><button data-v="ipad">iPad</button></div>
 </div>
 <button id="dlBtn">⬇️ تحميل الخلفية PNG</button>
 <p class="hint">بعد التحميل افتح الصورة وشاركها ← احفظها<br>ثم عينها خلفية من الإعدادات</p>
 <div class="vtag">v1.0</div>
</div>
<script>
'use strict';
var S={bg:'preset',clock:true,clockSize:24,clockColor:'white',clockW:'200',clock12:'24',
 date:true,dateLang:'ar',music:true,song:'أغنيتي المفضلة',artist:'فنان',size:'iphone'};
try{var _s=JSON.parse(localStorage.getItem('wpmaker')||'null');if(_s)for(var k in _s)S[k]=_s[k];}catch(e){}
function save(){try{localStorage.setItem('wpmaker',JSON.stringify(S));}catch(e){}}
var pv=document.getElementById('pv'),pctx=pv.getContext('2d');
var presetImg=new Image(),userImg=null,presetOK=false;
presetImg.onload=function(){presetOK=true;draw();};
presetImg.src='wp-city.jpg';
function bgImg(){return (S.bg==='user'&&userImg)?userImg:(presetOK?presetImg:null);}
function fmtClock(d){
 var h=d.getHours(),m=d.getMinutes(),ap='';
 if(S.clock12==='12'){ap=h>=12?' م':' ص';h=h%12;if(h===0)h=12;}
 return {t:(h<10?'0':'')+h+':'+(m<10?'0':'')+m,ap:ap};
}
function fmtDate(d){
 try{
  if(S.dateLang==='ar')return d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 }catch(e){return d.toDateString();}
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawTo(ctx,W,H,now){
 /* background */
 ctx.fillStyle='#1a2a3a';ctx.fillRect(0,0,W,H);
 var img=bgImg();
 if(img){
  var s=Math.max(W/img.width,H/img.height),dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
 }else{
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2f8fd0');g.addColorStop(1,'#0f5a8a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
 /* readability shade */
 var sh=ctx.createLinearGradient(0,0,0,H*0.45);
 sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=sh;ctx.fillRect(0,0,W,H*0.45);
 var col=S.clockColor==='white'?'#fff':'#111';
 var shc=S.clockColor==='white'?'rgba(0,0,0,.4)':'rgba(255,255,255,.4)';
 /* clock */
 if(S.clock){
  var cs=W*S.clockSize/100;
  ctx.font=S.clockW+' '+cs+'px -apple-system,"SF Pro Display","Segoe UI",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var fc=fmtClock(now);
  ctx.shadowColor=shc;ctx.shadowBlur=W*0.02;
  ctx.fillStyle=col;
  var cy=H*0.20;
  if(S.clock12==='12'&&fc.ap){ctx.fillText(fc.t, W*0.46, cy);ctx.font=S.clockW+' '+(cs*0.35)+'px -apple-system,sans-serif';ctx.fillText(fc.ap,W*0.46+cs*1.9,cy+cs*0.12);}
  else ctx.fillText(fc.t,W/2,cy);
  ctx.shadowBlur=0;
  if(S.date){
   ctx.font='400 '+(W*0.045)+'px -apple-system,"Segoe UI",Tahoma,sans-serif';
   ctx.fillStyle=col;ctx.shadowColor=shc;ctx.shadowBlur=W*0.01;
   ctx.fillText(fmtDate(now),W/2,cy+cs*0.62);
   ctx.shadowBlur=0;
  }
 }
 /* music widget */
 if(S.music){
  var mw=W*0.44,mh=H*0.085,mx=W*0.06,my=H*0.40;
  ctx.fillStyle='rgba(20,20,25,.72)';
  rr(ctx,mx,my,mw,mh,mw*0.09);ctx.fill();
  var as=mh*0.68,ax=mx+mh*0.16,ay=my+(mh-as)/2;
  var ag=ctx.createLinearGradient(ax,ay,ax+as,ay+as);
  ag.addColorStop(0,'#a4e34a');ag.addColorStop(1,'#2a7a9a');
  ctx.fillStyle=ag;rr(ctx,ax,ay,as,as,as*0.25);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='right';
  ctx.font='700 '+(mw*0.075)+'px -apple-system,Tahoma,sans-serif';
  var tx=mx+mw-mw*0.07;
  ctx.fillText(S.song||'أغنية',tx,my+mh*0.32, mw*0.55);
  ctx.font='400 '+(mw*0.06)+'px -apple-system,Tahoma,sans-serif';
  ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.fillText(S.artist||'',tx,my+mh*0.58, mw*0.55);
  ctx.fillStyle='rgba(255,255,255,.25)';
  rr(ctx,tx-mw*0.55,my+mh*0.78,mw*0.55,mh*0.05,mh*0.025);ctx.fill();
  ctx.fillStyle='#a4e34a';
  rr(ctx,tx-mw*0.55,my+mh*0.78,mw*0.55*0.35,mh*0.05,mh*0.025);ctx.fill();
 }
}
function draw(){
 var r=pv.parentElement.getBoundingClientRect();
 pv.width=Math.round(r.width*2);pv.height=Math.round(r.height*2);
 drawTo(pctx,pv.width,pv.height,new Date());
}
setInterval(draw,1000);
addEventListener('resize',draw);
/* ---------- controls ---------- */
function seg(id,fn){var el=document.getElementById(id);el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');fn(b.dataset.v);save();draw();});}
function tgl(id,fn){var el=document.getElementById(id);el.addEventListener('click',function(){el.classList.toggle('on');fn(el.classList.contains('on'));save();draw();});}
tgl('tClock',function(v){S.clock=v;});
tgl('tDate',function(v){S.date=v;});
tgl('tMusic',function(v){S.music=v;});
seg('sClockColor',function(v){S.clockColor=v;});
seg('sClockW',function(v){S.clockW=v;});
seg('sClock12',function(v){S.clock12=v;});
seg('sDateLang',function(v){S.dateLang=v;});
seg('sSize',function(v){S.size=v;});
document.getElementById('rClockSize').addEventListener('input',function(e){S.clockSize=+e.target.value;save();draw();});
document.getElementById('inSong').addEventListener('input',function(e){S.song=e.target.value;save();draw();});
document.getElementById('inArtist').addEventListener('input',function(e){S.artist=e.target.value;save();draw();});
document.getElementById('upBtn').addEventListener('click',function(){document.getElementById('fileIn').click();});
document.getElementById('fileIn').addEventListener('change',function(e){
 var f=e.target.files[0];if(!f)return;
 var url=URL.createObjectURL(f),im=new Image();
 im.onload=function(){userImg=im;S.bg='user';document.getElementById('presetThumb').classList.remove('on');save();draw();};
 im.src=url;
});
document.getElementById('presetThumb').addEventListener('click',function(){
 S.bg='preset';this.classList.add('on');save();draw();
});
/* restore UI from S */
(function(){
 function setSeg(id,v){document.querySelectorAll('#'+id+' button').forEach(function(b){b.classList.toggle('on',b.dataset.v===String(v));});}
 setSeg('sClockColor',S.clockColor);setSeg('sClockW',S.clockW);setSeg('sClock12',S.clock12);
 setSeg('sDateLang',S.dateLang);setSeg('sSize',S.size);
 document.getElementById('rClockSize').value=S.clockSize;
 document.getElementById('inSong').value=S.song;document.getElementById('inArtist').value=S.artist;
 [['tClock',S.clock],['tDate',S.date],['tMusic',S.music]].forEach(function(p){document.getElementById(p[0]).classList.toggle('on',!!p[1]);});
 if(S.bg!=='preset')document.getElementById('presetThumb').classList.remove('on');
})();
/* ---------- export ---------- */
document.getElementById('dlBtn').addEventListener('click',function(){
 var W=S.size==='ipad'?2048:1170,H=S.size==='ipad'?2732:2532;
 var c=document.createElement('canvas');c.width=W;c.height=H;
 drawTo(c.getContext('2d'),W,H,new Date());
 c.toBlob(function(bl){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download='wallpaper-'+S.size+'.png';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
 },'image/png');
});
draw();setTimeout(draw,300);
</script>
</body>
</html>
