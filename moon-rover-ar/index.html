<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fart Together 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0e4a7a}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
#game{height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;z-index:5;pointer-events:none}
#hudrow{display:flex;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:6px 13px;font-weight:800;font-size:14px}
#gasbar{height:12px;background:rgba(0,0,0,.45);border-radius:8px;margin-top:8px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#gasfill{height:100%;width:100%;background:linear-gradient(90deg,#a4e34a,#5aa32a);transition:width .15s}
#joy{position:absolute;bottom:26px;left:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#fartbtn{position:absolute;bottom:30px;right:24px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4f07a,#5aa32a 70%);border:4px solid #fff;z-index:10;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 6px 16px rgba(0,0,0,.4);color:#fff}
#fartbtn:active{transform:scale(.92)}
#fartbtn.cd{filter:grayscale(.7);opacity:.6}
#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(15,70,115,.93),rgba(8,40,75,.96));padding:28px;text-align:center;transition:opacity .4s}
.screen.hide{opacity:0;pointer-events:none}
.screen h1{font-size:38px;color:#a4e34a;text-shadow:0 3px 0 #2a5a10,0 6px 14px rgba(0,0,0,.4)}
.screen h2{font-size:32px;color:#ffd94d;text-shadow:0 3px 0 #7a5a10}
.screen p{color:#fff;font-size:15px;line-height:2.1;text-shadow:0 1px 4px #000}
.bigbtn{background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:24px;padding:16px 64px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2a5a10}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a5a10}
.vtag{position:absolute;bottom:8px;left:12px;color:#fff;font-size:11px;font-weight:700;opacity:.65;z-index:6}
#sndbtn{position:absolute;top:64px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;z-index:21}
#sndbtn svg{width:20px;height:20px}
#glfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;text-align:center;padding:30px;z-index:40;background:#0e4a7a}
</style>
<script>
window.__cdnFail=0;
function __loadThree(srcs,i){
 if(i>=srcs.length){window.__threeFailed=true;return;}
 var s=document.createElement('script');
 s.src=srcs[i];
 s.onload=function(){};
 s.onerror=function(){__loadThree(srcs,i+1);};
 document.head.appendChild(s);
}
__loadThree([
 "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js",
 "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js",

],0);
</script>
</head>
<body>
<div id="game">
  <canvas id="c3d"></canvas>
  <div id="hud">
    <div id="hudrow">
      <div class="pill" id="dist">1400 م</div>
      <div class="pill" id="time">0:00</div>
      <div class="pill" id="hearts">❤❤❤</div>
    </div>
    <div id="gasbar"><div id="gasfill"></div></div>
  </div>
  <div id="joy"><div id="knob"></div></div>

  <div id="toast"></div>
  <div id="sndbtn"></div>

    <div style="font-size:64px">💨🛶</div>
    <h1>Fart Together 3D</h1>
    <p>🕹️ الجويستك: وجّه الطوف<br>💨 زر الضرطة: دفعة صاروخية!<br>اجمع الفاصوليا للغاز واعبر البوابات<br>احذر الصخور والدوامات — اوصل لخط النهاية!</p>
    <button class="bigbtn" id="startb">انطلق</button>
  </div>

    <button class="bigbtn" id="againb">العب مرة ثانية</button>
  </div>
  <div class="vtag">v1.1 3D</div>
  <div id="glfb" hidden>تعذّر تشغيل الـ3D — تحقق من الإنترنت وأعد الفتح</div>
</div>
<script>
'use strict';
/* ================= Audio ================= */
var AC=null,muted=false;
try{muted=localStorage.getItem('ft3d_mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a,dur){var b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}return b;}
function fart(big){
 if(muted)return;var a=ac();if(!a)return;
 try{
  var dur=big?0.7:0.42,t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a,dur);
  var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  f.frequency.setValueAtTime(big?520:720,t);f.frequency.exponentialRampToValueAtTime(85,t+dur);
  var g=a.createGain();
  var lfo=a.createOscillator();lfo.type='square';lfo.frequency.setValueAtTime(big?20:30,t);lfo.frequency.exponentialRampToValueAtTime(9,t+dur);
  var lg=a.createGain();lg.gain.value=0.55;lfo.connect(lg);lg.connect(g.gain);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);lfo.start(t);src.stop(t+dur+0.05);lfo.stop(t+dur+0.05);
 }catch(e){}
}
function blip(fr,dur,type,vol,delay){if(muted)return;var a=ac();if(!a)return;try{var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);}catch(e){}}
function sndPick(){blip(660,.09,'sine');blip(920,.1,'sine',.14,.07);}
function sndHit(){blip(130,.28,'sawtooth',.22);}
function sndGate(){blip(784,.12,'triangle');blip(1046,.16,'triangle',.14,.1);}
function sndWin(){var n=[523,659,784,1046,1318];for(var i=0;i<n.length;i++)blip(n[i],.22,'triangle',.16,i*.13);}
function sndClick(){blip(500,.06,'square',.06);}
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff"/><path d="M16 9 Q19 12 16 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff" opacity=".5"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= State ================= */
var FINISH_Z=-1400;
var state='splash';
var px=0,pz=0,heading=0,speed=0;
var gas=100,hearts=3,elapsed=0,started=false;
var fartCD=0,inv=0,shake=0,squash=0;
var obstacles=[],pickups=[],parts=[],buoys=[];
var best=1e9;try{var b=parseFloat(localStorage.getItem('ft3d_best'));if(b>0)best=b;}catch(e){}
function fmtT(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function reset(){
 px=0;pz=0;heading=0;speed=0;gas=100;hearts=3;elapsed=0;started=false;
 fartCD=0;inv=0;shake=0;
 obstacles=[];pickups=[];buoys=[];
 clearWorld();buildCourse();
 updateHearts();
}
/* ================= THREE ================= */
var renderer,scene,camera,hemi,dirL;
var raft,crew,raftParts={};
var ocean,oceanGeo;
var wrap=document.getElementById('game'),canvas=document.getElementById('c3d');
function M(c){return new THREE.MeshLambertMaterial({color:c,flatShading:true});}
var GEO={};
function initGL(){
 renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x2a8fc4);
 scene.fog=new THREE.Fog(0x2a8fc4,40,95);
 camera=new THREE.PerspectiveCamera(58,1,0.1,300);
 hemi=new THREE.HemisphereLight(0xcfeaff,0x1a5a8a,1.0);scene.add(hemi);
 dirL=new THREE.DirectionalLight(0xfff2d0,0.9);dirL.position.set(12,20,6);scene.add(dirL);
 GEO.box=new THREE.BoxGeometry(1,1,1);
 GEO.sph=new THREE.SphereGeometry(0.5,10,10);
 GEO.cone=new THREE.ConeGeometry(0.5,1,8);
 GEO.cyl=new THREE.CylinderGeometry(0.5,0.5,1,10);
 GEO.dode=new THREE.DodecahedronGeometry(0.5,0);
 buildOcean();buildRaft();buildCrew();
 resize();
}
function resize(){
 var w=wrap.clientWidth,h=wrap.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
function part(geo,mat,x,y,z,sx,sy,sz){
 var m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);m.scale.set(sx||1,sy||1,sz||1);return m;
}
/* ---- ocean ---- */
function buildOcean(){
 oceanGeo=new THREE.PlaneGeometry(220,220,22,22);
 var o=new THREE.Mesh(oceanGeo,new THREE.MeshLambertMaterial({color:0x1e7ab5,flatShading:true}));
 o.rotation.x=-Math.PI/2;o.position.y=-0.6;scene.add(o);ocean=o;
 oceanGeo.userData.base=oceanGeo.attributes.position.array.slice();
}
/* ---- raft + crew ---- */
function buildRaft(){
 raft=new THREE.Group();
 var wood=M(0x8a5a2a),woodD=M(0x5f3c1c);
 for(var i=0;i<6;i++)raft.add(part(GEO.box,wood,-2.5+i*1.0,0.15,0,0.92,0.3,4.6));
 var l1=part(GEO.cyl,woodD,0,0.32,2.15,0.5,5.6,0.5);l1.rotation.z=Math.PI/2;raft.add(l1);
 var l2=part(GEO.cyl,woodD,0,0.32,-2.15,0.5,5.6,0.5);l2.rotation.z=Math.PI/2;raft.add(l2);
 /* mast with little flag */
 raft.add(part(GEO.cyl,woodD,1.8,1.6,-1.6,0.14,2.6,0.14));
 var flag=part(GEO.box,M(0xa4e34a),2.25,2.6,-1.6,0.9,0.55,0.06);raft.add(flag);raftParts.flag=flag;
 scene.add(raft);
}
function buildCrew(){
 crew=new THREE.Group();
 var skin=M(0x9fd8a8);
 var body=part(GEO.sph,skin,0,1.05,0.3,1.15,1.0,1.0);crew.add(body);raftParts.body=body;
 crew.add(part(GEO.sph,skin,0,1.85,0.35,0.72,0.66,0.7));
 /* ears */
 crew.add(part(GEO.sph,skin,-0.3,2.25,0.3,0.28,0.3,0.2));
 crew.add(part(GEO.sph,skin,0.3,2.25,0.3,0.28,0.3,0.2));
 /* eyes */
 var eyeM=new THREE.MeshBasicMaterial({color:0x1a1a1a});
 crew.add(part(GEO.sph,eyeM,-0.16,1.92,0.66,0.14,0.16,0.1));
 crew.add(part(GEO.sph,eyeM,0.16,1.92,0.66,0.14,0.16,0.1));
 /* snout */
 crew.add(part(GEO.sph,M(0x8bc898),0,1.72,0.68,0.4,0.3,0.25));
 /* arms */
 var aL=part(GEO.cyl,skin,-0.62,1.1,0.35,0.22,0.7,0.22);aL.rotation.z=0.5;crew.add(aL);
 var aR=part(GEO.cyl,skin,0.62,1.1,0.35,0.22,0.7,0.22);aR.rotation.z=-0.5;crew.add(aR);
 raft.add(crew);
}
/* ---- course ---- */
function clearWorld(){
 for(var i=scene.children.length-1;i>=0;i--){
  var o=scene.children[i];
  if(o.userData.temp){scene.remove(o);}
 }
}
function mkTemp(o){o.userData.temp=true;scene.add(o);return o;}
function buildCourse(){
 /* buoys marking channel */
 for(var z=-40;z>FINISH_Z;z-=80){
  [-30,30].forEach(function(x){
   var b=part(GEO.sph,M(0xe74c3c),x+(Math.random()-0.5)*3,0.1,z,1.1,1.1,1.1);
   b.userData={temp:true,ph:Math.random()*6,baseY:0.1};mkTemp(b);buoys.push(b);
  });
 }
 /* rocks + whirlpools */
 for(var z2=-70;z2>FINISH_Z+40;z2-=55){
  var lane=(Math.random()-0.5)*40;
  var r=Math.random();
  if(r<0.55){
   var rock=part(GEO.dode,M(0x6b6b7a),lane,0.2,z2,2.4+Math.random()*2.4,2+Math.random()*1.6,2.4+Math.random()*2.4);
   rock.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
   rock.userData={temp:true,type:'rock',rad:1.9};mkTemp(rock);obstacles.push(rock);
  }else{
   var wp=new THREE.Group();
   var ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,0.55,8,18),M(0x0e3a5c));
   ring.rotation.x=Math.PI/2;ring.position.y=0.05;wp.add(ring);
   var hole=new THREE.Mesh(new THREE.CircleGeometry(1.7,16),new THREE.MeshBasicMaterial({color:0x062a48}));
   hole.rotation.x=-Math.PI/2;hole.position.y=0.06;wp.add(hole);
   wp.position.set(lane,0,z2);
   wp.userData={temp:true,type:'pool',rad:3.4,ph:Math.random()*6};mkTemp(wp);obstacles.push(wp);
  }
  /* bean can */
  if(Math.random()<0.7){
   var bean=part(GEO.cyl,M(0x3fa34d),(Math.random()-0.5)*44,0.5,z2-22,0.7,0.9,0.7);
   bean.userData={temp:true,type:'bean',ph:Math.random()*6,baseY:0.5};mkTemp(bean);pickups.push(bean);
  }
  /* gate every ~260m */
  if(Math.abs(z2%260)<30){
   var gx=(Math.random()-0.5)*30;
   var gate=new THREE.Group();
   gate.add(part(GEO.cyl,M(0xf5c542),-3.4,1.8,0,0.3,3.6,0.3));
   gate.add(part(GEO.cyl,M(0xf5c542),3.4,1.8,0,0.3,3.6,0.3));
   gate.add(part(GEO.box,M(0xa4e34a),0,3.4,0,7.4,0.9,0.25));
   gate.position.set(gx,0,z2);
   gate.userData={temp:true,type:'gate',passed:false};mkTemp(gate);obstacles.push(gate);
  }
 }
 /* finish arch */
 var fin=new THREE.Group();
 fin.add(part(GEO.cyl,M(0xffffff),-5,2.5,0,0.5,5,0.5));
 fin.add(part(GEO.cyl,M(0xffffff),5,2.5,0,0.5,5,0.5));
 var cv2=document.createElement('canvas');cv2.width=256;cv2.height=48;
 var g2=cv2.getContext('2d');
 for(var ci=0;ci<8;ci++)for(var cj=0;cj<2;cj++){g2.fillStyle=(ci+cj)%2?'#111':'#fff';g2.fillRect(ci*32,cj*24,32,24);}
 var ban=new THREE.Mesh(new THREE.PlaneGeometry(10.6,1.8),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(cv2)}));
 ban.position.y=4.6;fin.add(ban);
 var ban2=ban.clone();ban2.rotation.y=Math.PI;fin.add(ban2);
 fin.position.set(0,0,FINISH_Z);
 fin.userData={temp:true,type:'finish'};mkTemp(fin);
}
/* ---- particles ---- */
var pGeo=new THREE.SphereGeometry(0.5,7,7);
function spawnPart(x,y,z,color,vx,vy,vz,life,size){
 if(parts.length>90)return;
 var m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:color,transparent:true}));
 m.position.set(x,y,z);m.scale.set(size,size,size);
 m.userData={temp:true,vx:vx,vy:vy,vz:vz,life:life,max:life};
 mkTemp(m);parts.push(m);
}
function fartPuffs(n){
 var bx=px-Math.sin(heading)*2.6,bz=pz+Math.cos(heading)*2.6;
 for(var i=0;i<n;i++)
  spawnPart(bx+(Math.random()-0.5)*1.4,0.7+Math.random()*0.5,bz+(Math.random()-0.5)*1.4,
   0x7ec850,(Math.random()-0.5)*3,1.5+Math.random()*2,(Math.random()-0.5)*3+3,0.9,0.5+Math.random()*0.5);
}
/* ================= Input: joystick + fart ================= */
var joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
var joy={id:null,dx:0,dy:0};
var JR=44;
function joyPos(t){
 var r=joyEl.getBoundingClientRect();
 var cx=r.left+r.width/2,cy=r.top+r.height/2;
 var dx=t.clientX-cx,dy=t.clientY-cy;
 var d=Math.sqrt(dx*dx+dy*dy);
 if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
 joy.dx=dx/JR;joy.dy=dy/JR;
 knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
joyEl.addEventListener('touchstart',function(e){e.preventDefault();ac();var t=e.changedTouches[0];joy.id=t.identifier;joyPos(t);},{passive:false});
joyEl.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joy.id)joyPos(t);}},{passive:false});
function joyEnd(e){for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===joy.id){joy.id=null;joy.dx=0;joy.dy=0;knob.style.transform='translate(0,0)';}}}
joyEl.addEventListener('touchend',joyEnd);joyEl.addEventListener('touchcancel',joyEnd);
var fartBtn=document.getElementById('fartbtn');
fartBtn.addEventListener('touchstart',function(e){e.preventDefault();doFart();},{passive:false});
fartBtn.addEventListener('mousedown',function(e){e.preventDefault();doFart();});
function doFart(){
 if(state!=='play')return;
 if(fartCD>0||gas<12)return;
 ac();
 fartCD=0.55;gas-=14;
 var fx=Math.sin(heading),fz=-Math.cos(heading);
 speed=Math.min(30,speed+13);
 pvxWob=(Math.random()-0.5)*4;
 fart(true);fartPuffs(9);squash=0.35;shake=Math.max(shake,0.22);
 fartBtn.classList.add('cd');setTimeout(function(){fartBtn.classList.remove('cd');},550);
}
var pvxWob=0;
/* ================= Game logic ================= */
function updateHUD(){
 document.getElementById('dist').textContent=Math.max(0,Math.ceil(pz-FINISH_Z))+' م';
 document.getElementById('time').textContent=fmtT(elapsed);
 document.getElementById('gasfill').style.width=gas+'%';
}
function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts));}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1300);}
function endGame(win){
 state='over';
 var sc=document.getElementById('endsc');
 document.getElementById('endtitle').textContent=win?'وصلت لخط النهاية!':'تكسر الطوف!';
 if(win){
  sndWin();
  var nb=false;
  if(elapsed<best){best=elapsed;nb=true;try{localStorage.setItem('ft3d_best',String(best));}catch(e){}}
  document.getElementById('endtext').innerHTML='زمنك: <b>'+fmtT(elapsed)+'</b><br>'+(nb?'رقم قياسي جديد!':'أحسن زمن: '+fmtT(best));
 }else{
  sndHit();
  document.getElementById('endtext').innerHTML='قطعت '+Math.floor(-pz)+' متر من '+Math.floor(-FINISH_Z)+'<br>حاول مرة ثانية!';
 }
 setTimeout(function(){sc.classList.remove('hide');},700);
}
function update(dt){
 elapsed+=dt;
 if(started){
  /* steering from joystick */
  heading+=joy.dx*2.1*dt;
  var rowing=Math.max(0,-joy.dy)*5;
  var target=3.2+rowing;
  speed+=(target-speed)*Math.min(1,dt*1.2);
  speed+=pvxWob*dt*8;pvxWob*=Math.pow(0.05,dt);
  var fx=Math.sin(heading),fz=-Math.cos(heading);
  px+=fx*speed*dt;pz+=fz*speed*dt;
  if(px>27){px=27;heading*=-0.4;}
  if(px<-27){px=-27;heading*=-0.4;}
  gas=Math.min(100,gas+5*dt);
  if(fartCD>0)fartCD-=dt;
  if(inv>0)inv-=dt;
  /* whirlpools */
  obstacles.forEach(function(o){
   if(o.userData.type==='pool'){
    var dx=px-o.position.x,dz=pz-o.position.z;
    var d=Math.sqrt(dx*dx+dz*dz);
    if(d<9&&d>0.5){px+=dx/d*-26*dt*(1-d/9);pz+=dz/d*-26*dt*(1-d/9);heading+=dt*1.4;}
   }
  });
  /* collisions */
  if(inv<=0){
   for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i],t=o.userData.type;
    if(t!=='rock')continue;
    var dx=px-o.position.x,dz=pz-o.position.z;
    if(dx*dx+dz*dz<3.4*3.4){
     hearts--;inv=1.5;shake=0.55;sndHit();
     speed*=0.35;
     for(var k=0;k<8;k++)spawnPart(px,0.6,pz,0xbfe6ff,(Math.random()-0.5)*8,3+Math.random()*3,(Math.random()-0.5)*8,0.7,0.5);
     updateHearts();toast('اوتش!');
     if(hearts<=0){endGame(false);return;}
     break;
    }
   }
  }
  /* pickups */
  for(var j=pickups.length-1;j>=0;j--){
   var q=pickups[j];
   var dx=px-q.position.x,dz=pz-q.position.z;
   if(dx*dx+dz*dz<2.6*2.6){
    gas=Math.min(100,gas+26);sndPick();toast('+ غاز');
    for(var k2=0;k2<5;k2++)spawnPart(q.position.x,1,q.position.z,0xa4e34a,(Math.random()-0.5)*4,2+Math.random()*2,(Math.random()-0.5)*4,0.6,0.4);
    scene.remove(q);pickups.splice(j,1);
   }
  }
  /* gates */
  obstacles.forEach(function(o){
   if(o.userData.type==='gate'&&!o.userData.passed&&pz<o.position.z){
    var dx=Math.abs(px-o.position.x);
    if(dx<3.4){o.userData.passed=true;gas=100;sndGate();toast('بوابة! غاز ممتلئ');confetti3D(o.position.x,o.position.z);}
   }
  });
  /* finish */
  if(pz<=FINISH_Z){endGame(true);return;}
 }
 /* raft transform */
 raft.position.set(px,Math.sin(elapsed*2.2)*0.14,py0z());
 raft.rotation.y=heading;
 raft.rotation.z=-joy.dx*0.14+Math.sin(elapsed*1.8)*0.02;
 raft.rotation.x=Math.sin(elapsed*2.6)*0.02;
 if(squash>0){squash-=dt;var sq=1+Math.max(0,squash)*0.9;raftParts.body.scale.set(1.15*sq,1.0/sq,1.0);}
 if(shake>0)shake-=dt;
 /* flag wave */
 if(raftParts.flag)raftParts.flag.rotation.y=Math.sin(elapsed*6)*0.4;
 /* ocean waves */
 var posA=oceanGeo.attributes.position,base=oceanGeo.userData.base;
 for(var v=0;v<posA.count;v++){
  var bx2=base[v*3],by2=base[v*3+1];
  posA.array[v*3+2]=Math.sin(bx2*0.25+elapsed*1.6)*0.35+Math.cos(by2*0.22+elapsed*1.1)*0.35;
 }
 posA.needsUpdate=true;
 /* buoys bob */
 buoys.forEach(function(b){b.position.y=b.userData.baseY+Math.sin(elapsed*2+b.userData.ph)*0.25;});
 /* whirlpool spin */
 obstacles.forEach(function(o){if(o.userData.type==='pool'){o.rotation.y+=dt*2.2;}});
 /* pickups bob */
 pickups.forEach(function(q){q.position.y=q.userData.baseY+Math.sin(elapsed*3+q.userData.ph)*0.25;q.rotation.y+=dt*1.5;});
 /* particles */
 for(var p=parts.length-1;p>=0;p--){
  var pt=parts[p],u=pt.userData;
  pt.position.x+=u.vx*dt;pt.position.y+=u.vy*dt;pt.position.z+=u.vz*dt;
  u.vy-=4*dt;u.life-=dt;
  var s=Math.max(0.01,u.life/u.max);pt.scale.set(s,s,s);pt.material.opacity=s;
  if(u.life<=0){scene.remove(pt);parts.splice(p,1);}
 }
 /* camera follow */
 var fx=Math.sin(heading),fz=-Math.cos(heading);
 var cx=px-fx*11,cz=pz-fz*11+2;
 camera.position.x+=(cx-camera.position.x)*Math.min(1,dt*4);
 camera.position.y+=(6.8-camera.position.y)*Math.min(1,dt*4);
 camera.position.z+=(cz-camera.position.z)*Math.min(1,dt*4);
 if(shake>0){camera.position.x+=(Math.random()-0.5)*shake*1.6;camera.position.y+=(Math.random()-0.5)*shake*1.2;}
 camera.lookAt(px+fx*7,1.2,pz+fz*7);
 updateHUD();
}
function py0z(){return pz;}
function confetti3D(x,z){
 var cols=[0xe74c3c,0xf5c542,0x8ee63a,0x4da6e8,0xff9ff3];
 for(var i=0;i<14;i++)spawnPart(x+(Math.random()-0.5)*4,3,z+(Math.random()-0.5)*2,cols[i%5],(Math.random()-0.5)*6,3+Math.random()*3,(Math.random()-0.5)*6,1.1,0.35);
}
/* ================= Loop ================= */
var lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!lastT)lastT=t;
 var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
 if(state==='play')update(dt);
 else{ /* idle: gentle camera drift on splash */
  if(state==='splash'&&raft){
   raft.position.set(0,Math.sin(t*0.001*2.2)*0.14,0);
   camera.position.set(Math.sin(t*0.0002)*4,6.8,11);
   camera.lookAt(0,1.2,-6);
  }
 }
 renderer.render(scene,camera);
}
/* ================= UI ================= */
function drawSnd(){document.getElementById('sndbtn').innerHTML=muted?SND_OFF:SND_ON;}
document.getElementById('sndbtn').addEventListener('click',function(e){
 e.stopPropagation();muted=!muted;
 try{localStorage.setItem('ft3d_mute',muted?'1':'0');}catch(e2){}
 drawSnd();if(!muted)sndClick();
});
document.getElementById('startb').addEventListener('click',function(){
 sndClick();ac();
 document.getElementById('splash').classList.add('hide');
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
 camera.position.set(0,6.8,11);
 toast('ادفع بالضرطة!');
});
document.getElementById('againb').addEventListener('click',function(){
 sndClick();
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
 camera.position.set(0,6.8,11);
});
/* ================= Init ================= */
drawSnd();
function showGLFail(msg){
 var f=document.getElementById('glfb');
 f.hidden=false;
 f.innerHTML='تعذّر تشغيل الـ3D'+(msg?'<br><span style="font-size:12px;opacity:.75">السبب: '+msg+'</span>':'')+'<br>تحقق من الإنترنت وأعد الفتح';
}
function webglOK(){
 try{var c=document.createElement('canvas');return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));}catch(e){return false;}
}
function waitThree(n,cb){
 if(typeof THREE!=='undefined')return cb(true);
 if(window.__threeFailed||n<=0)return cb(false);
 setTimeout(function(){waitThree(n-1,cb);},300);
}
waitThree(40,function(ok){
 if(!ok){showGLFail('فشل تحميل مكتبة الرسوم (3 محاولات)');return;}
 if(!webglOK()){showGLFail('المتصفح لا يدعم WebGL');return;}
 try{
  initGL();reset();state='splash';
  camera.position.set(0,6.8,11);
  requestAnimationFrame(loop);
 }catch(err){showGLFail(String((err&&err.message)||err));}
});
</script>
