<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fart Together</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0e4a7a}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
#game{height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;z-index:5;pointer-events:none}
#hudrow{display:flex;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:6px 13px;font-weight:800;font-size:14px}
#progbar{height:8px;background:rgba(0,0,0,.4);border-radius:6px;margin-top:8px;overflow:hidden}
#progfill{height:100%;width:0%;background:linear-gradient(90deg,#7ed321,#a4e34a);transition:width .3s}
#gasbar{height:10px;background:rgba(0,0,0,.45);border-radius:8px;margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#gasfill{height:100%;width:100%;background:linear-gradient(90deg,#a4e34a,#5aa32a);transition:width .15s}
#joy{position:absolute;bottom:26px;left:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#fartbtn{position:absolute;bottom:30px;right:24px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4f07a,#5aa32a 70%);border:4px solid #fff;z-index:10;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#fartbtn:active{transform:scale(.92)}
#fartbtn.cd{filter:grayscale(.7);opacity:.6}
#toast{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(15,70,115,.88),rgba(8,40,75,.94));padding:28px;text-align:center;transition:opacity .4s}
.screen.hide{opacity:0;pointer-events:none}
.screen h1{font-size:36px;color:#a4e34a;text-shadow:0 3px 0 #2a5a10,0 6px 14px rgba(0,0,0,.4)}
.screen h2{font-size:32px;color:#ffd94d;text-shadow:0 3px 0 #7a5a10}
.screen p{color:#fff;font-size:15px;line-height:2.1;text-shadow:0 1px 4px #000}
.bigbtn{background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:24px;padding:16px 64px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2a5a10}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a5a10}
.vtag{position:absolute;bottom:8px;left:12px;color:#fff;font-size:11px;font-weight:700;opacity:.65;z-index:6}
#sndbtn{position:absolute;top:70px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;z-index:21}
#sndbtn svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="hudrow">
      <div class="pill" id="beans">🫘 0</div>
      <div class="pill" id="time">0:00</div>
      <div class="pill" id="hearts">❤❤❤</div>
    </div>
    <div id="progbar"><div id="progfill"></div></div>
    <div id="gasbar"><div id="gasfill"></div></div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fartbtn">💨</div>
  <div id="toast"></div>
  <div id="sndbtn"></div>
  <div class="screen" id="splash">
    <div style="font-size:64px">🐸💨🦛</div>
    <h1>Fart Together</h1>
    <p>🕹️ الجويستك: وجّه الطوف بالقناة<br>💨 زر الضرطة: دفعة صاروخية!<br>اجمع الفاصوليا واعبر نقاط التفتيش<br>انتبه للصخور — اوصل للنهاية!</p>
    <button class="bigbtn" id="startb">انطلق</button>
  </div>
  <div class="screen hide" id="endsc">
    <h2 id="endtitle">وصلت!</h2>
    <p id="endtext"></p>
    <button class="bigbtn" id="againb">العب مرة ثانية</button>
  </div>
  <div class="vtag">v2.0</div>
</div>
<script>
'use strict';
/* ================= Setup ================= */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,HOR=0,FOCAL=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);HOR=H*0.38;FOCAL=H*1.15;}
addEventListener('resize',resize);
/* ================= Audio ================= */
var AC=null,muted=false;
try{muted=localStorage.getItem('ft3d_mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a,dur){var b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}return b;}
function fart(big){
 if(muted)return;var a=ac();if(!a)return;
 try{
  var dur=big?0.7:0.42,t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a,dur);
  var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  f.frequency.setValueAtTime(big?520:720,t);f.frequency.exponentialRampToValueAtTime(85,t+dur);
  var g=a.createGain();
  var lfo=a.createOscillator();lfo.type='square';lfo.frequency.setValueAtTime(big?20:30,t);lfo.frequency.exponentialRampToValueAtTime(9,t+dur);
  var lg=a.createGain();lg.gain.value=0.55;lfo.connect(lg);lg.connect(g.gain);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);lfo.start(t);src.stop(t+dur+0.05);lfo.stop(t+dur+0.05);
 }catch(e){}
}
function blip(fr,dur,type,vol,delay){if(muted)return;var a=ac();if(!a)return;try{var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);}catch(e){}}
function sndPick(){blip(660,.09,'sine');blip(920,.1,'sine',.14,.07);}
function sndHit(){blip(130,.28,'sawtooth',.22);}
function sndGate(){blip(784,.12,'triangle');blip(1046,.16,'triangle',.14,.1);}
function sndWin(){var n=[523,659,784,1046,1318];for(var i=0;i<n.length;i++)blip(n[i],.22,'triangle',.16,i*.13);}
function sndClick(){blip(500,.06,'square',.06);}
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff"/><path d="M16 9 Q19 12 16 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff" opacity=".5"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= State ================= */
var FINISH=1400,state='splash';
var px=0,pdist=0,speed=0;
var gas=100,hearts=3,elapsed=0,started=false,nbeans=0;
var fartCD=0,inv=0,shake=0,squash=0,tiltV=0;
var rocks=[],beans=[],checks=[],boosts=[],spires=[],puffs=[];
var best=1e9;try{var _b=parseFloat(localStorage.getItem('ft_best'));if(_b>0)best=_b;}catch(e){}
function fmtT(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
/* ================= Channel ================= */
function chanX(z){return 16*Math.sin(z*0.008)+8*Math.sin(z*0.023);}
var camX=0;
function proj(ax,y,z){
 var depth=z-pdist;
 if(depth<1.5)return null;
 var s=FOCAL/depth;
 return {x:W/2+(ax-camX)*s, y:HOR+(7-y)*s, s:s, d:depth};
}
function buildCourse(){
 rocks=[];beans=[];checks=[];boosts=[];spires=[];puffs=[];
 for(var z=80;z<FINISH-60;z+=55){
  rocks.push({x:(Math.random()-0.5)*16,z:z,r:1.8+Math.random()*1.2});
  if(Math.random()<0.75)beans.push({x:(Math.random()-0.5)*18,z:z+26,ph:Math.random()*6});
  if(Math.random()<0.35)boosts.push({z0:z+40,z1:z+64});
 }
 for(var c=350;c<FINISH;c+=350)checks.push({z:c,done:false});
 for(var s=40;s<FINISH+250;s+=45){
  var side=Math.random()<0.5?-1:1;
  spires.push({x:side*(24+Math.random()*22),z:s,h:14+Math.random()*18,w:9+Math.random()*8});
 }
}
function reset(){
 px=0;pdist=0;speed=0;gas=100;hearts=3;elapsed=0;started=false;nbeans=0;
 fartCD=0;inv=0;shake=0;squash=0;tiltV=0;camX=chanX(0);
 buildCourse();updateHearts();updateBeans();
}
/* ================= Input ================= */
var joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
var joy={id:null,dx:0,dy:0},JR=44;
function joyPos(t){
 var r=joyEl.getBoundingClientRect();
 var dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 var d=Math.sqrt(dx*dx+dy*dy);
 if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
 joy.dx=dx/JR;joy.dy=dy/JR;
 knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
joyEl.addEventListener('touchstart',function(e){e.preventDefault();ac();var t=e.changedTouches[0];joy.id=t.identifier;joyPos(t);},{passive:false});
joyEl.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joy.id)joyPos(t);}},{passive:false});
function joyEnd(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===joy.id){joy.id=null;joy.dx=0;joy.dy=0;knob.style.transform='translate(0,0)';}}
joyEl.addEventListener('touchend',joyEnd);joyEl.addEventListener('touchcancel',joyEnd);
var fartBtn=document.getElementById('fartbtn');
fartBtn.addEventListener('touchstart',function(e){e.preventDefault();doFart();},{passive:false});
fartBtn.addEventListener('mousedown',function(e){e.preventDefault();doFart();});
function doFart(){
 if(state!=='play'||!started||fartCD>0||gas<12)return;
 ac();fartCD=0.55;gas-=14;speed=Math.min(30,speed+11);fart(true);squash=0.4;shake=Math.max(shake,0.25);
 var R=Math.min(W,H)*0.30;
 for(var i=0;i<10;i++)puffs.push({x:(Math.random()-0.5)*R*1.2,y:-R*0.4,vx:(Math.random()-0.5)*40,vy:-50-Math.random()*40,life:1,r:7+Math.random()*8});
 fartBtn.classList.add('cd');setTimeout(function(){fartBtn.classList.remove('cd');},550);
}
/* ================= Logic ================= */
function updateHUD(){
 document.getElementById('time').textContent=fmtT(elapsed);
 document.getElementById('gasfill').style.width=gas+'%';
 document.getElementById('progfill').style.width=Math.min(100,pdist/FINISH*100)+'%';
}
function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts));}
function updateBeans(){document.getElementById('beans').textContent='🫘 '+nbeans;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1300);}
function endGame(win){
 state='over';
 document.getElementById('endtitle').textContent=win?'وصلت للنهاية!':'تكسر الطوف!';
 if(win){
  sndWin();var nb=false;
  if(elapsed<best){best=elapsed;nb=true;try{localStorage.setItem('ft_best',String(best));}catch(e){}}
  document.getElementById('endtext').innerHTML='زمنك: <b>'+fmtT(elapsed)+'</b><br>🫘 '+nbeans+'<br>'+(nb?'رقم قياسي جديد!':'أحسن زمن: '+fmtT(best));
 }else{
  sndHit();
  document.getElementById('endtext').innerHTML='قطعت '+Math.floor(pdist)+' متر<br>حاول مرة ثانية!';
 }
 setTimeout(function(){document.getElementById('endsc').classList.remove('hide');},700);
}
function inBoost(z){for(var i=0;i<boosts.length;i++)if(z>boosts[i].z0&&z<boosts[i].z1)return true;return false;}
function update(dt){
 elapsed+=dt;
 if(started){
  px+=joy.dx*15*dt;
  var rowing=Math.max(0,-joy.dy)*4;
  var target=4+rowing;
  if(inBoost(pdist))target=15;
  speed+=(target-speed)*Math.min(1,dt*1.2);
  pdist+=speed*dt;
  if(px>10.5){px=10.5;speed*=0.96;shake=Math.max(shake,0.12);}
  if(px<-10.5){px=-10.5;speed*=0.96;shake=Math.max(shake,0.12);}
  gas=Math.min(100,gas+5*dt);
  if(fartCD>0)fartCD-=dt;
  if(inv>0)inv-=dt;
  tiltV+=((joy.dx*0.28)-tiltV)*Math.min(1,dt*6);
  if(inv<=0)for(var i=0;i<rocks.length;i++){var r=rocks[i];
   var dx=px-r.x,dz=pdist-r.z;
   if(dx*dx+dz*dz<9){
    hearts--;inv=1.5;shake=0.6;sndHit();fart(true);speed*=0.4;updateHearts();toast('اوتش!');
    if(hearts<=0){endGame(false);return;}
    break;
   }}
  for(var m=beans.length-1;m>=0;m--){var b=beans[m];
   var bx=px-b.x,bz=pdist-b.z;
   if(bx*bx+bz*bz<7){gas=Math.min(100,gas+22);nbeans++;sndPick();updateBeans();beans.splice(m,1);}}
  for(var ci=0;ci<checks.length;ci++){var cp=checks[ci];
   if(!cp.done&&pdist>=cp.z){cp.done=true;gas=100;sndGate();toast('CHECK POINT!');}}
  if(pdist>=FINISH){endGame(true);return;}
  camX+=((chanX(pdist)+px*0.5)-camX)*Math.min(1,dt*3);
 }
 for(var p=puffs.length-1;p>=0;p--){var pt=puffs[p];
  pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy-=30*dt;pt.life-=1.5*dt;
  if(pt.life<=0)puffs.splice(p,1);}
 if(squash>0)squash-=dt*2;
 if(shake>0)shake-=dt;
 updateHUD();
}
/* ================= Draw helpers ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function quad2(a,b,c,d){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();}
/* ================= World draw ================= */
function drawSky(){
 var g=ctx.createLinearGradient(0,0,0,HOR);
 g.addColorStop(0,'#2f8fd0');g.addColorStop(1,'#bfe6f7');
 ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,HOR+30);
 ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(W*0.82,HOR*0.32,24,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,243,176,.35)';ctx.beginPath();ctx.arc(W*0.82,HOR*0.32,42,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.92)';
 for(var i=0;i<4;i++){
  var cx=((i*173+elapsed*9)%(W+170))-85;
  ctx.beginPath();ctx.ellipse(cx,HOR*(0.22+i*0.17),44,13,0,0,7);ctx.fill();
 }
}
function drawSpires(){
 for(var i=spires.length-1;i>=0;i--){var s=spires[i];
  if(s.z<pdist-10||s.z>pdist+320)continue;
  var ax=chanX(s.z)+s.x;
  var b=proj(ax,0,s.z);if(!b)continue;
  var ap=proj(ax,s.h,s.z),bl=proj(ax-s.w/2,0,s.z),br=proj(ax+s.w/2,0,s.z);
  if(!ap||!bl||!br)continue;
  ctx.fillStyle='#c96a5a';
  ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(ap.x,ap.y);ctx.lineTo(br.x,br.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='#a85446';
  ctx.beginPath();ctx.moveTo(ap.x,ap.y);ctx.lineTo(br.x,br.y);ctx.lineTo(b.x,b.y);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath();ctx.moveTo(bl.x,bl.y);ctx.lineTo(ap.x,ap.y);ctx.lineTo(b.x,b.y);ctx.closePath();ctx.fill();
 }
}
function drawChannel(){
 var STEP=8,FAR=280,pts=[];
 for(var z=pdist+FAR;z>pdist+4;z-=STEP){
  var cx=chanX(z);
  var pL=proj(cx-13,0,z),pR=proj(cx+13,0,z);
  if(!pL||!pR)continue;
  pts.push({z:z,cx:cx,pL:pL,pR:pR,
   pLo:proj(cx-14.8,0.7,z),pRo:proj(cx+14.8,0.7,z),
   pSo:proj(cx-17.6,0.3,z),pSoR:proj(cx+17.6,0.3,z),
   pLt:proj(cx-13,1.15,z),pRt:proj(cx+13,1.15,z),
   pLot:proj(cx-14.8,1.75,z),pRot:proj(cx+14.8,1.75,z)});
 }
 /* water */
 for(var i=0;i<pts.length-1;i++){
  var a=pts[i],b=pts[i+1];
  var boost=inBoost(a.z);
  ctx.fillStyle=boost?'#8e44ad':((Math.floor(a.z/16)%2===0)?'#2aa5dc':'#249ed8');
  quad2(a.pL,a.pR,b.pR,b.pL);ctx.fill();
  if(boost){
   var ch=proj(a.cx,0.15,a.z);
   if(ch&&ch.s>2.5){
    ctx.fillStyle='rgba(255,255,255,.9)';
    var s=ch.s;
    ctx.beginPath();
    ctx.moveTo(ch.x-2.6*s,ch.y);ctx.lineTo(ch.x,ch.y-1.1*s);ctx.lineTo(ch.x+2.6*s,ch.y);
    ctx.lineTo(ch.x+2.6*s,ch.y+0.6*s);ctx.lineTo(ch.x,ch.y-0.5*s);ctx.lineTo(ch.x-2.6*s,ch.y+0.6*s);
    ctx.closePath();ctx.fill();
   }
  }
 }
 /* skirt stripes + rails */
 for(var j=0;j<pts.length-1;j++){
  var c=pts[j],d=pts[j+1];
  var alt=(Math.floor(c.z/16)%2===0);
  ctx.fillStyle=alt?'#7d3c98':'#f4f4f4';
  if(c.pLo&&c.pSo&&d.pSo&&d.pLo){quad2(c.pLo,c.pSo,d.pSo,d.pLo);ctx.fill();}
  if(c.pRo&&c.pSoR&&d.pSoR&&d.pRo){quad2(c.pRo,c.pSoR,d.pSoR,d.pRo);ctx.fill();}
  ctx.fillStyle='#69b32a';
  if(c.pL&&c.pLo&&d.pLo&&d.pL){quad2(c.pL,c.pLo,d.pLo,d.pL);ctx.fill();}
  if(c.pR&&c.pRo&&d.pRo&&d.pR){quad2(c.pR,c.pRo,d.pRo,d.pR);ctx.fill();}
  ctx.fillStyle='#8ede3a';
  if(c.pLt&&c.pLot&&d.pLot&&d.pLt){quad2(c.pLt,c.pLot,d.pLot,d.pLt);ctx.fill();}
  if(c.pRt&&c.pRot&&d.pRot&&d.pRt){quad2(c.pRt,c.pRot,d.pRot,d.pRt);ctx.fill();}
 }
 /* foam line at water edge */
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
 ctx.beginPath();
 for(var k=pts.length-1;k>=0;k--){var q=pts[k].pL;if(k===pts.length-1)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);}
 ctx.stroke();
 ctx.beginPath();
 for(var k2=pts.length-1;k2>=0;k2--){var q2=pts[k2].pR;if(k2===pts.length-1)ctx.moveTo(q2.x,q2.y);else ctx.lineTo(q2.x,q2.y);}
 ctx.stroke();
}
function drawRock(r){
 var ax=chanX(r.z)+r.x;
 var p=proj(ax,0.8,r.z);if(!p)return;
 var s=p.s,rad=Math.max(2,r.r*s);
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(1.5,s*0.14);
 ctx.beginPath();ctx.ellipse(p.x,p.y+rad*0.45,rad*1.05,rad*0.3,0,0,7);ctx.stroke();
 ctx.fillStyle='#6b6b78';
 ctx.beginPath();ctx.arc(p.x,p.y,rad,0,7);ctx.fill();
 ctx.fillStyle='#85858f';
 ctx.beginPath();ctx.arc(p.x-rad*0.25,p.y-rad*0.3,rad*0.55,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';
 ctx.beginPath();ctx.arc(p.x-rad*0.28,p.y-rad*0.35,rad*0.2,0,7);ctx.fill();
}
function drawBean(b){
 var ax=chanX(b.z)+b.x;
 var p=proj(ax,0.9,b.z);if(!p)return;
 var s=p.s,bob=Math.sin(elapsed*3+b.ph)*s*0.15;
 var spin=0.4+0.6*Math.abs(Math.cos(elapsed*2.5+b.ph));
 var w=Math.max(2,s*1.0*spin);
 ctx.fillStyle='#2e7d32';rr(p.x-w/2,p.y-s*0.7+bob,w,s*1.2,s*0.3);ctx.fill();
 ctx.fillStyle='#66bb6a';ctx.fillRect(p.x-w*0.3,p.y-s*0.5+bob,Math.max(1,w*0.6),s*0.4);
 ctx.fillStyle='#1b5e20';ctx.font='bold '+Math.max(6,s*0.7)+'px Arial';ctx.textAlign='center';
 if(s>6)ctx.fillText('ف',p.x,p.y-s*0.18+bob);
}
function drawCheck(cp,isFinish){
 var z=cp.z;
 if(z<pdist+2||z>pdist+300)return;
 var cx=chanX(z);
 var pL=proj(cx-9,0,z),pLt=proj(cx-9,8,z),pRt=proj(cx+9,8,z);
 if(!pL||!pLt||!pRt)return;
 var s=pL.s;
 ctx.fillStyle='#c9a86a';
 ctx.fillRect(pL.x-s*0.28,pLt.y,s*0.56,pL.y-pLt.y);
 var pR=proj(cx+9,0,z);
 ctx.fillRect(pR.x-s*0.28,pLt.y,s*0.56,pR.y-pLt.y);
 var bw=pRt.x-pLt.x,bh=s*1.7;
 ctx.fillStyle=isFinish?'#111':(cp.done?'#5aa32a':'#f5c542');
 ctx.fillRect(pLt.x,pLt.y,bw,bh);
 var n=12,cw=bw/n;
 for(var i=0;i<n;i++){ctx.fillStyle=i%2?'#111':'#fff';ctx.fillRect(pLt.x+i*cw,pLt.y+bh-s*0.4,cw,s*0.4);}
 ctx.fillStyle=isFinish?'#fff':'#5a3a10';
 ctx.font='bold '+Math.max(6,s*0.8)+'px Arial';ctx.textAlign='center';
 if(s>5)ctx.fillText(isFinish?'FINISH':'CHECK POINT',pLt.x+bw/2,pLt.y+bh*0.5);
}
function drawWorld(){
 var items=[];
 rocks.forEach(function(r){if(r.z>pdist+2&&r.z<pdist+280)items.push({d:r.z,fn:function(){drawRock(r);}});});
 beans.forEach(function(b){if(b.z>pdist+2&&b.z<pdist+280)items.push({d:b.z,fn:function(){drawBean(b);}});});
 checks.forEach(function(c){if(c.z>pdist+2&&c.z<pdist+300)items.push({d:c.z,fn:function(){drawCheck(c,false);}});});
 if(FINISH>pdist+2&&FINISH<pdist+300)items.push({d:FINISH,fn:function(){drawCheck({z:FINISH},true);}});
 items.sort(function(a,b){return b.d-a.d;});
 items.forEach(function(it){it.fn();});
}
/* ================= Raft + characters ================= */
function drawFrog(x,y,r,sq){
 ctx.save();ctx.translate(x,y);ctx.scale(1+sq*0.25,1-sq*0.22);
 ctx.translate(0,Math.sin(elapsed*3)*r*0.05);
 ctx.fillStyle='#4caf50';
 rr(-r*0.55,-r*0.08,r*0.34,r*0.5,r*0.14);ctx.fill();
 rr(r*0.21,-r*0.08,r*0.34,r*0.5,r*0.14);ctx.fill();
 ctx.fillStyle='#66bb6a';
 ctx.beginPath();ctx.ellipse(0,-r*0.48,r*0.5,r*0.56,0,0,7);ctx.fill();
 ctx.fillStyle='#a5d6a7';
 ctx.beginPath();ctx.ellipse(0,-r*0.36,r*0.3,r*0.36,0,0,7);ctx.fill();
 ctx.strokeStyle='#66bb6a';ctx.lineWidth=r*0.15;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-r*0.44,-r*0.52);ctx.lineTo(-r*0.64,-r*0.16);ctx.stroke();
 ctx.beginPath();ctx.moveTo(r*0.44,-r*0.52);ctx.lineTo(r*0.64,-r*0.16);ctx.stroke();
 ctx.fillStyle='#66bb6a';
 ctx.beginPath();ctx.arc(-r*0.22,-r*1.02,r*0.2,0,7);ctx.arc(r*0.22,-r*1.02,r*0.2,0,7);ctx.fill();
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(-r*0.22,-r*1.04,r*0.13,0,7);ctx.arc(r*0.22,-r*1.04,r*0.13,0,7);ctx.fill();
 ctx.fillStyle='#1a1a1a';
 var lk=tiltV*r*0.6;
 ctx.beginPath();ctx.arc(-r*0.22+lk,-r*1.04,r*0.06,0,7);ctx.arc(r*0.22+lk,-r*1.04,r*0.06,0,7);ctx.fill();
 ctx.strokeStyle='#2e7d32';ctx.lineWidth=r*0.07;
 ctx.beginPath();ctx.arc(0,-r*0.64,r*0.28,0.35,Math.PI-0.35);ctx.stroke();
 ctx.fillStyle='rgba(255,150,150,.55)';
 ctx.beginPath();ctx.arc(-r*0.36,-r*0.62,r*0.09,0,7);ctx.arc(r*0.36,-r*0.62,r*0.09,0,7);ctx.fill();
 ctx.restore();
}
function drawHippo(x,y,r,sq){
 ctx.save();ctx.translate(x,y);ctx.scale(1+sq*0.25,1-sq*0.22);
 ctx.translate(0,Math.sin(elapsed*3+1)*r*0.05);
 ctx.fillStyle='#5c9ded';
 rr(-r*0.5,-r*0.04,r*0.32,r*0.46,r*0.13);ctx.fill();
 rr(r*0.18,-r*0.04,r*0.32,r*0.46,r*0.13);ctx.fill();
 ctx.fillStyle='#7ab5f5';
 ctx.beginPath();ctx.ellipse(0,-r*0.5,r*0.56,r*0.6,0,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(-r*0.34,-r*1.04,r*0.12,0,7);ctx.arc(r*0.34,-r*1.04,r*0.12,0,7);ctx.fill();
 ctx.fillStyle='#5c9ded';
 ctx.beginPath();ctx.arc(-r*0.34,-r*1.04,r*0.06,0,7);ctx.arc(r*0.34,-r*1.04,r*0.06,0,7);ctx.fill();
 ctx.fillStyle='#a8ccf7';
 ctx.beginPath();ctx.ellipse(0,-r*0.6,r*0.34,r*0.24,0,0,7);ctx.fill();
 ctx.fillStyle='#3a6db5';
 ctx.beginPath();ctx.arc(-r*0.13,-r*0.6,r*0.045,0,7);ctx.arc(r*0.13,-r*0.6,r*0.045,0,7);ctx.fill();
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(-r*0.24,-r*0.9,r*0.11,0,7);ctx.arc(r*0.24,-r*0.9,r*0.11,0,7);ctx.fill();
 ctx.fillStyle='#1a1a1a';
 var lk=tiltV*r*0.6;
 ctx.beginPath();ctx.arc(-r*0.24+lk,-r*0.9,r*0.05,0,7);ctx.arc(r*0.24+lk,-r*0.9,r*0.05,0,7);ctx.fill();
 ctx.fillStyle='#7ab5f5';
 ctx.beginPath();ctx.ellipse(-r*0.54,-r*0.44,r*0.12,r*0.24,-0.4,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(r*0.54,-r*0.44,r*0.12,r*0.24,0.4,0,7);ctx.fill();
 ctx.restore();
}
function drawRaft(){
 var sN=FOCAL/13;
 var rx=W/2+(chanX(pdist)+px-camX)*sN;
 var ry=H*0.80+Math.sin(elapsed*2.2)*5;
 var R=Math.min(W,H)*0.30;
 ctx.save();
 ctx.translate(rx,ry);
 ctx.rotate(tiltV+(shake>0?(Math.random()-0.5)*0.08:0));
 if(inv>0&&Math.floor(elapsed*10)%2===0)ctx.globalAlpha=0.45;
 var sq=squash>0?squash:0;
 for(var wi=1;wi<=3;wi++){
  ctx.fillStyle='rgba(255,255,255,'+(0.32-wi*0.09)+')';
  ctx.beginPath();ctx.ellipse(0,-R*(0.72+wi*0.3),R*(0.95-wi*0.14),R*0.15,0,0,7);ctx.fill();
 }
 ctx.fillStyle='rgba(0,40,70,.28)';
 ctx.beginPath();ctx.ellipse(0,R*0.44,R*0.95,R*0.2,0,0,7);ctx.fill();
 ctx.fillStyle='#f2e3c2';
 ctx.beginPath();ctx.ellipse(0,0,R,R*0.62,0,0,7);ctx.fill();
 ctx.strokeStyle='rgba(160,120,70,.45)';ctx.lineWidth=R*0.11;
 ctx.beginPath();ctx.ellipse(0,0,R-R*0.06,R*0.62-R*0.06,0,0.3,Math.PI-0.3);ctx.stroke();
 ctx.fillStyle='#a06a35';
 ctx.beginPath();ctx.ellipse(0,0,R*0.62,R*0.38,0,0,7);ctx.fill();
 ctx.strokeStyle='#7a4e22';ctx.lineWidth=2;
 for(var pi=-2;pi<=2;pi++){ctx.beginPath();ctx.moveTo(-R*0.58,pi*R*0.13);ctx.lineTo(R*0.58,pi*R*0.13);ctx.stroke();}
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=R*0.06;
 ctx.beginPath();ctx.ellipse(0,0,R-R*0.05,R*0.62-R*0.05,0,Math.PI+0.3,2*Math.PI-0.3);ctx.stroke();
 ctx.fillStyle='#d33';
 ctx.beginPath();ctx.ellipse(-R*0.88,0,R*0.1,R*0.07,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(R*0.88,0,R*0.1,R*0.07,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,-R*0.57,R*0.1,R*0.07,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,R*0.57,R*0.1,R*0.07,0,0,7);ctx.fill();
 drawFrog(-R*0.33,-R*0.02,R*0.36,sq);
 drawHippo(R*0.33,0,R*0.42,sq);
 ctx.restore();
 ctx.save();
 for(var i=0;i<puffs.length;i++){var p=puffs[i];
  ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
  ctx.fillStyle='#7ec850';
  ctx.beginPath();ctx.arc(rx+p.x,ry+R*0.1+p.y,Math.max(1,p.r*p.life),0,7);ctx.fill();
 }
 ctx.restore();
}
/* ================= Draw ================= */
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-0.5)*shake*22,(Math.random()-0.5)*shake*22);
 drawSky();
 drawSpires();
 drawChannel();
 drawWorld();
 drawRaft();
 if(gas<25&&state==='play'){ctx.fillStyle='rgba(200,30,30,'+(0.10+0.07*Math.sin(elapsed*6))+')';ctx.fillRect(0,0,W,H);}
 ctx.restore();
}
/* ================= Loop ================= */
var lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!lastT)lastT=t;
 var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
 if(state==='play')update(dt);
 else if(state==='splash'){elapsed+=dt;}
 draw();
}
/* ================= UI ================= */
function drawSnd(){document.getElementById('sndbtn').innerHTML=muted?SND_OFF:SND_ON;}
document.getElementById('sndbtn').addEventListener('click',function(e){
 e.stopPropagation();muted=!muted;
 try{localStorage.setItem('ft3d_mute',muted?'1':'0');}catch(e2){}
 drawSnd();if(!muted)sndClick();
});
document.getElementById('startb').addEventListener('click',function(){
 sndClick();ac();
 document.getElementById('splash').classList.add('hide');
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
 toast('ادفع بالضرطة!');
});
document.getElementById('againb').addEventListener('click',function(){
 sndClick();
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
});
/* ================= Init ================= */
resize();drawSnd();reset();state='splash';
requestAnimationFrame(loop);
setTimeout(resize,300);
</script>
