<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>مزرعتي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:#7ec8f7;color:#333;touch-action:manipulation}
#game{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
/* ===== Header ===== */
#hdr{background:linear-gradient(180deg,#fffdf5,#ffefc4);border-bottom:3px solid #d9b84a;padding:9px 12px;display:flex;align-items:center;gap:10px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.coinbox{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #e8c547;border-radius:20px;padding:5px 12px;font-weight:800;font-size:16px;color:#8a6d1a;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lvlbox{flex:1;min-width:0}
.lvlrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#6b5320}
#xpbar{height:10px;background:#e8dcc0;border-radius:6px;margin-top:4px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#8ee63a,#4a9e1f);border-radius:6px;transition:width .5s}
#sndbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #e8dcc0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#sndbtn:active{transform:scale(.92)}
#sndbtn svg{width:20px;height:20px}
#ver{font-size:11px;color:#a08c5a;font-weight:700;flex-shrink:0}
/* ===== Scene ===== */
#scene{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
#sky{position:relative;height:23%;background:linear-gradient(180deg,#5da9e9 0%,#8fd0f8 60%,#c5e9ff 100%);overflow:hidden;flex-shrink:0}
#sun{position:absolute;top:14px;left:22px;width:58px;height:58px;background:radial-gradient(circle,#fff9c4 25%,#ffe14d 55%,rgba(255,225,77,0) 72%);border-radius:50%;animation:sunpulse 4s ease-in-out infinite}
@keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cloud{position:absolute;background:#fff;border-radius:30px;opacity:.92;animation:drift linear infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:110%;top:-55%;left:18%}
.cloud::after{width:38%;height:75%;top:-35%;right:16%}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(600px)}}
.bird{position:absolute;animation:fly linear infinite}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(600px)}}
/* ===== Field ===== */
#field{flex:1;position:relative;background:linear-gradient(180deg,#8fd694 0%,#7ccf85 40%,#6cc477 100%);overflow:hidden}
#fence{position:absolute;top:0;left:0;right:0;height:34px;background:
  repeating-linear-gradient(90deg,transparent 0 34px,rgba(90,58,30,.9) 34px 42px),
  linear-gradient(180deg,#a06a3c 0 8px,transparent 8px),
  linear-gradient(180deg,transparent 18px,#a06a3c 18px 26px,transparent 26px);
  background-color:transparent;opacity:.95}
#fence::after{content:'';position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(60,40,20,.25)}
#barn{position:absolute;top:38px;right:8px;width:104px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
#pondwrap{position:absolute;bottom:14px;left:10px;width:120px;height:74px}
#pond{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 35%,#9fdcff,#4da6e8 70%,#3a8fd0);border-radius:50%;border:3px solid #5a8f3c;overflow:hidden}
.ripple{position:absolute;border:2px solid rgba(255,255,255,.5);border-radius:50%;animation:ripple 3s ease-out infinite}
@keyframes ripple{from{width:20px;height:12px;opacity:.8;left:50px;top:30px}to{width:100px;height:56px;opacity:0;left:10px;top:8px}}
.lily{position:absolute;width:22px;height:14px;background:#3d8b37;border-radius:50%;bottom:14px;right:26px}
.lily::after{content:'';position:absolute;width:8px;height:8px;background:#ff9ff3;border-radius:50%;top:-4px;left:7px}
.flower{position:absolute;width:26px;height:34px}
.bfly{position:absolute;width:24px;height:20px;animation:flutter 7s ease-in-out infinite;z-index:6}
.bfly .wing{position:absolute;top:0;width:11px;height:18px;border-radius:50% 50% 50% 50%;transform-origin:right center;animation:flap .35s ease-in-out infinite alternate}
.bfly .wing.l{left:0;background:#ff9ff3;transform-origin:right center}
.bfly .wing.r{right:0;background:#f368e0;transform-origin:left center;animation-delay:.05s}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(8deg)}25%{transform:translate(26px,-20px) rotate(-8deg)}50%{transform:translate(-14px,-34px) rotate(6deg)}75%{transform:translate(18px,-12px) rotate(-6deg)}}
.grass{position:absolute;width:20px;height:16px;opacity:.8}
/* ===== Plots ===== */
#farm{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(88%,360px);display:grid;grid-template-columns:repeat(3,1fr);gap:11px;z-index:5}
.plot{aspect-ratio:1/.92;background:linear-gradient(180deg,#9c6a3e,#7a4e2b);border-radius:18px;border:3px solid #5a3a1e;position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 4px 8px rgba(0,0,0,.3),0 3px 6px rgba(0,0,0,.22);transition:transform .12s}
.plot:active{transform:scale(.93)}
.plot .soil{position:absolute;inset:7px;background:
  repeating-linear-gradient(0deg,transparent 0 9px,rgba(0,0,0,.14) 9px 11px),
  radial-gradient(ellipse at 50% 30%,#8a5a33,#6e4525);border-radius:12px}
.plot .crop{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center}
.plot .crop svg{width:76%;height:76%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.plot.ready{animation:readybounce 1.1s ease-in-out infinite;border-color:#ffd94d;box-shadow:inset 0 4px 8px rgba(0,0,0,.3),0 0 16px rgba(255,217,77,.85)}
@keyframes readybounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.plot .timer{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.4);padding:2px 0;z-index:2}
.plot .prog{position:absolute;bottom:0;left:0;height:5px;background:linear-gradient(90deg,#8ee63a,#4a9e1f);transition:width 1s linear;z-index:3;border-radius:0 3px 3px 0}
/* ===== Seed sheet ===== */
#sheet{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fffdf5;border-radius:24px 24px 0 0;padding:18px 16px calc(26px + env(safe-area-inset-bottom));z-index:60;transform:translateY(112%);transition:transform .32s cubic-bezier(.32,.72,.24,1);box-shadow:0 -6px 28px rgba(0,0,0,.3);max-height:72dvh;overflow-y:auto}
#sheet.open{transform:translateY(0)}
#sheet h3{text-align:center;margin-bottom:2px;color:#5a3a1e;font-size:19px}
#sheet .sub{text-align:center;color:#a08c5a;font-size:12px;margin-bottom:14px}
.seed{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e8dcc0;border-radius:16px;padding:10px 12px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.seed:active{transform:scale(.98)}
.seed.locked{opacity:.45}
.seed .sic{width:56px;height:56px;flex-shrink:0;background:linear-gradient(180deg,#fbf3dc,#f4e8c8);border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid #e8dcc0}
.seed .sic svg{width:44px;height:44px}
.seed .sinfo{flex:1;min-width:0}
.seed .sname{font-weight:800;font-size:16px;color:#4a3319}
.seed .smeta{font-size:11.5px;color:#8a7a5a;margin-top:3px;line-height:1.6}
.seed .scost{display:flex;align-items:center;gap:4px;font-weight:800;color:#8a6d1a;font-size:15px;flex-shrink:0}
.seed .locktag{font-size:11px;color:#c0392b;font-weight:700;margin-top:2px}
#sheetClose{display:block;margin:8px auto 0;background:#e8dcc0;border:none;border-radius:14px;padding:11px 46px;font-size:15px;font-weight:800;color:#5a3a1e;cursor:pointer}
/* ===== Toast / particles / modal / splash ===== */
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-16px);background:rgba(40,30,15,.93);color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:100;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.flytxt{position:fixed;z-index:95;pointer-events:none;font-weight:800;color:#b8860b;font-size:19px;text-shadow:0 1px 2px #fff;animation:flyup 1.1s ease-out forwards}
@keyframes flyup{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-80px) scale(1.15)}}
.pt{position:fixed;width:9px;height:9px;border-radius:50%;z-index:95;pointer-events:none;animation:burst .8s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
#lvlmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#lvlmodal.open{display:flex}
#lvlmodal .card{background:linear-gradient(180deg,#fffdf5,#ffefc4);border-radius:26px;padding:34px 30px;text-align:center;max-width:330px;animation:pop .45s cubic-bezier(.30,1.4,.36,1);border:3px solid #e8c547;box-shadow:0 10px 40px rgba(0,0,0,.35)}
@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
#lvlmodal h2{color:#8a6d1a;font-size:27px;margin-bottom:10px}
#lvlmodal p{color:#6b5320;margin-bottom:18px;line-height:1.8;font-size:15px}
#lvlmodal button{background:linear-gradient(180deg,#8ee63a,#4a9e1f);color:#fff;border:none;border-radius:16px;padding:13px 48px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(74,158,31,.4)}
#splash{position:fixed;inset:0;background:linear-gradient(180deg,#4a9fd8 0%,#8fd0f8 45%,#8fd694 100%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;padding:24px}
#splash.hide{opacity:0;pointer-events:none}
#splash .farmart{width:150px;height:110px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#splash h1{font-size:46px;color:#fff;text-shadow:0 3px 0 #3d8b37,0 8px 16px rgba(0,0,0,.3)}
#splash p{color:#fff;font-size:16px;text-shadow:0 1px 4px rgba(0,0,0,.45);text-align:center;line-height:1.8}
#splash button{background:#fff;color:#3d8b37;border:none;border-radius:22px;padding:15px 64px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.28)}
#splash button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="game">
  <div id="hdr">
    <div class="coinbox"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#b8860b" stroke-width="2"/><ellipse cx="12" cy="12" rx="6" ry="6.5" fill="none" stroke="#b8860b" stroke-width="1.4"/><text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="800" fill="#8a6d1a">¢</text></svg><span id="coins">150</span></div>
    <div class="lvlbox">
      <div class="lvlrow"><span>مستوى <span id="level">1</span></span><span id="xptext" style="color:#a08c5a">0/60</span></div>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
    <div id="sndbtn" title="الصوت"></div>
    <span id="ver">v1.0</span>
  </div>
  <div id="scene">
    <div id="sky">
      <div id="sun"></div>
      <div class="cloud" style="top:16px;width:92px;height:28px;animation-duration:42s"></div>
      <div class="cloud" style="top:64px;width:70px;height:22px;animation-duration:58s;animation-delay:-20s"></div>
      <div class="cloud" style="top:104px;width:112px;height:32px;animation-duration:70s;animation-delay:-45s"></div>
      <svg class="bird" style="top:30px;animation-duration:26s" width="30" height="14" viewBox="0 0 30 14"><path d="M2 10 Q8 2 15 8 Q22 2 28 10" stroke="#3a6a8a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <svg class="bird" style="top:66px;animation-duration:34s;animation-delay:-12s" width="24" height="12" viewBox="0 0 30 14"><path d="M2 10 Q8 2 15 8 Q22 2 28 10" stroke="#3a6a8a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <svg class="bird" style="top:96px;width:20px;animation-duration:44s;animation-delay:-28s" width="26" height="12" viewBox="0 0 30 14"><path d="M2 10 Q8 2 15 8 Q22 2 28 10" stroke="#3a6a8a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div id="field">
      <div id="fence"></div>
      <svg id="barn" viewBox="0 0 100 84">
        <rect x="14" y="34" width="72" height="46" fill="#c0392b" stroke="#7d241a" stroke-width="2"/>
        <path d="M6 38 L50 8 L94 38 Z" fill="#a93226" stroke="#7d241a" stroke-width="2"/>
        <rect x="40" y="52" width="20" height="28" fill="#7d241a"/>
        <path d="M40 52 L60 80 M60 52 L40 80" stroke="#ecf0f1" stroke-width="2.5"/>
        <rect x="22" y="44" width="14" height="12" fill="#ecf0f1" stroke="#7d241a" stroke-width="1.5"/>
        <rect x="64" y="44" width="14" height="12" fill="#ecf0f1" stroke="#7d241a" stroke-width="1.5"/>
        <circle cx="50" cy="24" r="5" fill="#ecf0f1" stroke="#7d241a" stroke-width="1.5"/>
      </svg>
      <div id="pondwrap"><div id="pond"><div class="ripple"></div><div class="ripple" style="animation-delay:1.5s"></div><div class="lily"></div></div></div>
      <div id="farm"></div>
    </div>
  </div>
</div>

<div id="sheet">
  <h3>🌱 اختر البذور</h3>
  <div class="sub">اضغط على المحصول لزراعته في القطعة</div>
  <div id="seedlist"></div>
  <button id="sheetClose">إغلاق</button>
</div>
<div id="toast"></div>
<div id="lvlmodal"><div class="card"><h2>🎉 مستوى جديد!</h2><p id="lvltext"></p><button id="lvlok">رائع!</button></div></div>
<div id="splash">
  <svg class="farmart" viewBox="0 0 150 110">
    <ellipse cx="75" cy="92" rx="70" ry="16" fill="#5cb85c"/>
    <rect x="55" y="40" width="40" height="34" fill="#c0392b" stroke="#7d241a" stroke-width="2"/>
    <path d="M48 42 L75 20 L102 42 Z" fill="#a93226" stroke="#7d241a" stroke-width="2"/>
    <path d="M30 74 L38 74 L34 96 Z" fill="#ef6c33"/><path d="M34 70 L28 60 M34 70 L40 60" stroke="#3d8b37" stroke-width="2.5" fill="none"/>
    <path d="M112 74 L120 74 L116 96 Z" fill="#ef6c33"/><path d="M116 70 L110 60 M116 70 L122 60" stroke="#3d8b37" stroke-width="2.5" fill="none"/>
    <ellipse cx="34" cy="52" rx="8" ry="10" fill="#f7b32b"/><path d="M20 60 Q34 52 48 60" stroke="#4a9e1f" stroke-width="3" fill="none"/>
  </svg>
  <h1>مزرعتي</h1>
  <p>ازرع محاصيلك، اسقِها بحب،<br>احصدها وطوّر مزرعتك! 🌾</p>
  <button id="startbtn">ابدأ اللعب</button>
</div>

<script>
'use strict';
/* ================= Data ================= */
var CROPS = {
  wheat:  {name:'قمح',   time:30,  cost:10,  sell:28,  xp:5,  unlock:1},
  corn:   {name:'ذرة',   time:60,  cost:22,  sell:55,  xp:10, unlock:1},
  carrot: {name:'جزر',   time:120, cost:40,  sell:100, xp:18, unlock:2},
  tomato: {name:'طماطم', time:240, cost:70,  sell:180, xp:30, unlock:3},
  pumpkin:{name:'يقطين', time:480, cost:140, sell:380, xp:55, unlock:4}
};
var ORDER = ['wheat','corn','carrot','tomato','pumpkin'];
/* ================= Crop SVG art (3 stages) ================= */
function svgCrop(crop, stage){
  var s='';
  if(stage===0){
    s='<path d="M24 40 Q24 28 15 20 M24 40 Q24 28 33 20" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="15" cy="19" rx="6" ry="3.4" fill="#5cb85c" transform="rotate(-30 15 19)"/>'+
      '<ellipse cx="33" cy="19" rx="6" ry="3.4" fill="#5cb85c" transform="rotate(30 33 19)"/>';
  } else if(stage===1){
    if(crop==='carrot'||crop==='tomato'){
      s='<path d="M24 42 L24 20 M24 30 L16 18 M24 30 L32 18 M24 36 L18 28 M24 36 L30 28" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<ellipse cx="16" cy="16" rx="5" ry="3" fill="#5cb85c"/><ellipse cx="32" cy="16" rx="5" ry="3" fill="#5cb85c"/>';
    } else if(crop==='pumpkin'){
      s='<path d="M10 40 Q24 34 38 40" stroke="#3d8b37" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
        '<ellipse cx="18" cy="34" rx="7" ry="4" fill="#5cb85c" transform="rotate(-20 18 34)"/>'+
        '<ellipse cx="30" cy="34" rx="7" ry="4" fill="#5cb85c" transform="rotate(20 30 34)"/>';
    } else {
      s='<path d="M24 44 L24 12" stroke="#4a9e1f" stroke-width="4" stroke-linecap="round"/>'+
        '<ellipse cx="16" cy="28" rx="7" ry="4" fill="#5cb85c" transform="rotate(-25 16 28)"/>'+
        '<ellipse cx="32" cy="20" rx="7" ry="4" fill="#5cb85c" transform="rotate(25 32 20)"/>'+
        '<ellipse cx="17" cy="37" rx="6" ry="3.4" fill="#6cc06c" transform="rotate(-20 17 37)"/>';
    }
  } else {
    if(crop==='wheat'){
      s=[10,18,26,34].map(function(x){
        return '<path d="M'+x+' 44 L'+x+' 12" stroke="#c9a227" stroke-width="2.6" stroke-linecap="round"/>'+
        [14,20,26,32].map(function(y){return '<ellipse cx="'+(x-4)+'" cy="'+y+'" rx="4.4" ry="2.4" fill="#e8c547" transform="rotate(-35 '+(x-4)+' '+y+')"/><ellipse cx="'+(x+4)+'" cy="'+y+'" rx="4.4" ry="2.4" fill="#e8c547" transform="rotate(35 '+(x+4)+' '+y+')"/>';}).join('')+
        '<ellipse cx="'+x+'" cy="10" rx="3.6" ry="4.6" fill="#f5d76e"/>';
      }).join('');
    } else if(crop==='corn'){
      s='<path d="M24 46 L24 10" stroke="#4a9e1f" stroke-width="4.5" stroke-linecap="round"/>'+
        '<ellipse cx="15" cy="34" rx="7" ry="4" fill="#5cb85c" transform="rotate(-28 15 34)"/>'+
        '<ellipse cx="33" cy="34" rx="7" ry="4" fill="#5cb85c" transform="rotate(28 33 34)"/>'+
        '<ellipse cx="24" cy="26" rx="8" ry="13" fill="#f7b32b" stroke="#d6941a" stroke-width="1.6"/>'+
        '<path d="M24 14 L24 38" stroke="#d6941a" stroke-width="1.6" stroke-dasharray="3 2.4"/>'+
        '<path d="M17 38 Q24 30 31 38" stroke="#7ccf85" stroke-width="3" fill="none"/>';
    } else if(crop==='carrot'){
      s='<path d="M24 40 L24 16 M24 28 L15 14 M24 28 L33 14 M24 34 L18 26 M24 34 L30 26" stroke="#2f7a2c" stroke-width="3.2" fill="none" stroke-linecap="round"/>'+
        '<path d="M16 34 L32 34 L24 48 Z" fill="#ef6c33" stroke="#c8551f" stroke-width="1.8"/>'+
        '<path d="M19 38 L29 38" stroke="#c8551f" stroke-width="1.4"/>';
    } else if(crop==='tomato'){
      s='<ellipse cx="24" cy="34" rx="14" ry="11" fill="#3d8b37"/>'+
        '<ellipse cx="17" cy="28" rx="8" ry="6" fill="#4a9e1f"/>'+
        '<ellipse cx="31" cy="28" rx="8" ry="6" fill="#4a9e1f"/>'+
        '<circle cx="18" cy="36" r="6.5" fill="#e74c3c" stroke="#b93224" stroke-width="1.4"/>'+
        '<circle cx="30" cy="38" r="6.5" fill="#e74c3c" stroke="#b93224" stroke-width="1.4"/>'+
        '<circle cx="24" cy="30" r="6" fill="#ef5b4c" stroke="#b93224" stroke-width="1.4"/>'+
        '<path d="M18 31 l-2 -3 M30 33 l2 -3 M24 25 l0 -3" stroke="#2f7a2c" stroke-width="2" stroke-linecap="round"/>';
    } else {
      s='<path d="M6 42 Q24 34 42 42" stroke="#3d8b37" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
        '<ellipse cx="24" cy="34" rx="13" ry="10.5" fill="#ef8c33" stroke="#c86a1f" stroke-width="1.8"/>'+
        '<path d="M18 26 Q16 34 18 42 M24 24 Q24 34 24 44 M30 26 Q32 34 30 42" stroke="#c86a1f" stroke-width="1.6" fill="none"/>'+
        '<path d="M24 24 Q24 18 28 16" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/>'+
        '<ellipse cx="13" cy="36" rx="6" ry="3.6" fill="#5cb85c" transform="rotate(-18 13 36)"/>';
    }
  }
  return '<svg viewBox="0 0 48 52">'+s+'</svg>';
}
/* ================= Sound (WebAudio, no files) ================= */
var AC=null, muted=false;
try{ muted = localStorage.getItem('myfarm_mute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f, t, dur, type, vol){
  if(muted) return;
  var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.12, a.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+t); o.stop(a.currentTime+t+dur+.02);
  }catch(e){}
}
function sndPlant(){ tone(330,0,.12,'triangle'); tone(440,.08,.14,'triangle'); }
function sndHarvest(){ tone(523,0,.12,'sine'); tone(659,.09,.12,'sine'); tone(784,.18,.2,'sine'); }
function sndClick(){ tone(600,0,.06,'square',.05); }
function sndLevel(){ var n=[523,659,784,1047]; for(var i=0;i<n.length;i++) tone(n[i],i*.12,.22,'triangle'); }
function sndError(){ tone(180,0,.18,'sawtooth',.06); }
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#4a9e1f"/><path d="M16 9 Q19 12 16 15 M18.5 6.5 Q23 12 18.5 17.5" stroke="#4a9e1f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#999"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= State ================= */
var S={coins:150, xp:0, level:1, plots:[]};
for(var i=0;i<12;i++) S.plots.push(null);
function xpNeed(){ return S.level*60; }
function save(){ try{localStorage.setItem('myfarm_v1', JSON.stringify(S));}catch(e){} }
function load(){
  try{
    var d=JSON.parse(localStorage.getItem('myfarm_v1'));
    if(d&&typeof d.coins==='number'){ S.coins=d.coins; S.xp=d.xp||0; S.level=d.level||1; if(Array.isArray(d.plots)&&d.plots.length===12) S.plots=d.plots; return true; }
  }catch(e){}
  return false;
}
/* ================= UI refs ================= */
var farmEl=document.getElementById('farm'), coinsEl=document.getElementById('coins'),
    levelEl=document.getElementById('level'), xpfill=document.getElementById('xpfill'),
    xptext=document.getElementById('xptext'), sheet=document.getElementById('sheet'),
    seedlist=document.getElementById('seedlist'), sndbtn=document.getElementById('sndbtn');
function fmtTime(sec){ sec=Math.max(0,Math.ceil(sec)); if(sec>=3600) return Math.floor(sec/3600)+'س'; if(sec>=60) return Math.floor(sec/60)+'د'; return sec+'ث'; }
function updateHUD(){
  coinsEl.textContent=S.coins; levelEl.textContent=S.level;
  var need=xpNeed();
  xpfill.style.width=Math.min(100,S.xp/need*100)+'%';
  xptext.textContent=S.xp+'/'+need;
}
function toast(msg, long){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');}, long?3200:1900);
}
function flyTxt(x,y,txt,color){
  var d=document.createElement('div'); d.className='flytxt'; d.textContent=txt;
  if(color) d.style.color=color;
  d.style.left=(x-24)+'px'; d.style.top=(y-12)+'px';
  document.body.appendChild(d); setTimeout(function(){d.remove();},1100);
}
function burst(x,y,colors){
  for(var i=0;i<10;i++){
    (function(){
      var d=document.createElement('div'); d.className='pt';
      d.style.background=colors[i%colors.length];
      d.style.left=x+'px'; d.style.top=y+'px';
      var a=Math.random()*Math.PI*2, dist=34+Math.random()*44;
      d.style.setProperty('--dx', Math.cos(a)*dist+'px');
      d.style.setProperty('--dy', Math.sin(a)*dist+'px');
      document.body.appendChild(d); setTimeout(function(){d.remove();},850);
    })();
  }
}
function confetti(){
  var cols=['#e74c3c','#f5c542','#8ee63a','#4da6e8','#ff9ff3','#ef8c33'];
  for(var i=0;i<40;i++){
    (function(){
      var d=document.createElement('div'); d.className='pt';
      d.style.background=cols[Math.floor(Math.random()*cols.length)];
      d.style.left=(innerWidth/2-4+ (Math.random()*120-60))+'px'; d.style.top=(innerHeight*0.35)+'px';
      d.style.setProperty('--dx',(Math.random()*300-150)+'px');
      d.style.setProperty('--dy',(120+Math.random()*160)+'px');
      d.style.animationDuration=(0.9+Math.random()*0.7)+'s';
      document.body.appendChild(d); setTimeout(function(){d.remove();},1700);
    })();
  }
}
/* ================= Farm ================= */
var plotEls=[];
function buildFarm(){
  farmEl.innerHTML=''; plotEls=[];
  for(var i=0;i<12;i++){
    (function(idx){
      var p=document.createElement('div'); p.className='plot';
      p.innerHTML='<div class="soil"></div><div class="crop"></div><div class="timer" style="display:none"></div><div class="prog" style="width:0%"></div>';
      p.addEventListener('click', function(e){ onPlot(idx,e); });
      farmEl.appendChild(p); plotEls.push(p);
    })(i);
  }
  refreshPlots();
}
function plotProgress(p){ if(!p) return 0; return Math.min(1,(Date.now()-p.plantedAt)/(CROPS[p.crop].time*1000)); }
function refreshPlots(){
  var now=Date.now();
  for(var i=0;i<12;i++){
    var p=S.plots[i], el=plotEls[i];
    var cropEl=el.querySelector('.crop'), timerEl=el.querySelector('.timer'), progEl=el.querySelector('.prog');
    el.classList.remove('ready');
    if(!p){ cropEl.innerHTML=''; timerEl.style.display='none'; progEl.style.width='0%'; continue; }
    var c=CROPS[p.crop], pr=Math.min(1,(now-p.plantedAt)/(c.time*1000));
    cropEl.innerHTML=svgCrop(p.crop, pr>=1?2:(pr>=0.45?1:0));
    if(pr>=1){ el.classList.add('ready'); timerEl.style.display='block'; timerEl.textContent='جاهز للحصاد!'; progEl.style.width='100%'; }
    else { timerEl.style.display='block'; timerEl.textContent=fmtTime(c.time-(now-p.plantedAt)/1000); progEl.style.width=(pr*100)+'%'; }
  }
}
/* ================= Decorations ================= */
function decorate(){
  var f=document.getElementById('field');
  var flowers=[[6,120,'#ff6b81'],[30,200,'#f9ca24'],[70,140,'#ff9ff3'],[88,220,'#ff6b81'],[16,300,'#f9ca24']];
  flowers.forEach(function(pos){
    var d=document.createElement('svg'); d.className='flower';
    d.style.left=pos[0]+'%'; d.style.top=pos[1]+'px';
    var col=pos[2];
    d.setAttribute('viewBox','0 0 26 34');
    d.innerHTML='<path d="M13 16 L13 32" stroke="#3d8b37" stroke-width="2.4"/>'+
      [0,60,120,180,240,300].map(function(a){var r=a*Math.PI/180;return '<circle cx="'+(13+7*Math.cos(r))+'" cy="'+(9+7*Math.sin(r))+'" r="4.4" fill="'+col+'"/>';}).join('')+
      '<circle cx="13" cy="9" r="3.6" fill="#f5c542"/>';
    f.appendChild(d);
  });
  var b1=document.createElement('div'); b1.className='bfly'; b1.style.left='20%'; b1.style.top='120px';
  b1.innerHTML='<div class="wing l"></div><div class="wing r"></div>';
  var b2=document.createElement('div'); b2.className='bfly'; b2.style.left='68%'; b2.style.top='190px'; b2.style.animationDelay='-3.5s';
  b2.innerHTML='<div class="wing l" style="background:#f9ca24"></div><div class="wing r" style="background:#f0932b;animation-delay:.05s"></div>';
  f.appendChild(b1); f.appendChild(b2);
  var gpos=[[12,90],[45,250],[78,110],[90,300],[4,230]];
  gpos.forEach(function(pos){
    var g=document.createElement('svg'); g.className='grass'; g.style.left=pos[0]+'%'; g.style.top=pos[1]+'px';
    g.setAttribute('viewBox','0 0 20 16');
    g.innerHTML='<path d="M4 16 Q5 6 3 2 M10 16 Q10 4 12 1 M16 16 Q15 8 18 4" stroke="#4a9e1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    f.appendChild(g);
  });
}
/* ================= Actions ================= */
var selPlot=-1;
function openSheet(idx){
  selPlot=idx; seedlist.innerHTML='';
  ORDER.forEach(function(key){
    var c=CROPS[key], locked=S.level<c.unlock, afford=S.coins>=c.cost;
    var d=document.createElement('div'); d.className='seed'+(locked?' locked':'');
    d.innerHTML='<div class="sic">'+svgCrop(key,2)+'</div>'+
      '<div class="sinfo"><div class="sname">'+c.name+'</div>'+
      '<div class="smeta">النمو: '+fmtTime(c.time)+' &nbsp;•&nbsp; البيع: '+c.sell+' &nbsp;•&nbsp; +'+c.xp+' خبرة</div>'+
      (locked?'<div class="locktag">🔒 يفتح في المستوى '+c.unlock+'</div>':'')+'</div>'+
      '<div class="scost"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#b8860b" stroke-width="2"/></svg>'+c.cost+'</div>';
    if(!locked&&afford) d.addEventListener('click',function(){ plant(key); });
    else if(!locked&&!afford) d.addEventListener('click',function(){ sndError(); toast('عملاتك لا تكفي! احصد محاصيلك أولاً'); });
    seedlist.appendChild(d);
  });
  sheet.classList.add('open');
}
document.getElementById('sheetClose').addEventListener('click',function(){ sndClick(); sheet.classList.remove('open'); });
function plant(key){
  if(selPlot<0) return;
  var c=CROPS[key];
  if(S.level<c.unlock||S.coins<c.cost) return;
  S.coins-=c.cost;
  S.plots[selPlot]={crop:key, plantedAt:Date.now()};
  sheet.classList.remove('open');
  sndPlant(); save(); updateHUD(); refreshPlots();
  toast('🌱 زرعت '+c.name+' بنجاح');
}
function pt(e){ return {x:e.changedTouches?e.changedTouches[0].clientX:(e.clientX||innerWidth/2), y:e.changedTouches?e.changedTouches[0].clientY:(e.clientY||innerHeight/2)}; }
function onPlot(idx,e){
  var p=S.plots[idx];
  if(!p){ sndClick(); openSheet(idx); return; }
  var pr=plotProgress(p), c=CROPS[p.crop], pos=pt(e);
  if(pr>=1){
    S.plots[idx]=null; S.coins+=c.sell;
    sndHarvest();
    burst(pos.x,pos.y,['#f5c542','#8ee63a','#fff']);
    flyTxt(pos.x,pos.y,'+'+c.sell+' 🪙');
    addXP(c.xp);
    save(); updateHUD(); refreshPlots();
  } else {
    sndClick();
    toast(c.name+' ينضج بعد '+fmtTime(c.time*(1-pr)));
  }
}
function addXP(n){
  S.xp+=n;
  var need=xpNeed();
  if(S.xp>=need){
    S.xp-=need; S.level++; S.coins+=60;
    save(); updateHUD(); sndLevel(); confetti();
    var msg='وصلت للمستوى '+S.level+'! 🎉<br>+60 عملة هدية';
    var un=ORDER.filter(function(k){return CROPS[k].unlock===S.level;});
    if(un.length) msg+='<br>🔓 محصول جديد: '+un.map(function(k){return CROPS[k].name;}).join('، ');
    document.getElementById('lvltext').innerHTML=msg;
    document.getElementById('lvlmodal').classList.add('open');
  }
}
document.getElementById('lvlok').addEventListener('click',function(){ sndClick(); document.getElementById('lvlmodal').classList.remove('open'); });
/* sound toggle */
function drawSnd(){ sndbtn.innerHTML=muted?SND_OFF:SND_ON; }
sndbtn.addEventListener('click',function(){
  muted=!muted;
  try{localStorage.setItem('myfarm_mute',muted?'1':'0');}catch(e){}
  drawSnd(); if(!muted) sndClick();
  toast(muted?'🔇 الصوت متوقف':'🔊 الصوت يعمل');
});
/* ================= Init ================= */
var had=load();
buildFarm(); decorate(); updateHUD(); drawSnd();
setInterval(refreshPlots,1000);
/* crops finished while away */
(function(){
  var ready=0;
  S.plots.forEach(function(p){ if(p&&plotProgress(p)>=1) ready++; });
  if(had&&ready>0) setTimeout(function(){ toast('🌾 '+ready+' محصول نضج أثناء غيابك!',true); },1200);
})();
document.getElementById('startbtn').addEventListener('click',function(){
  sndClick();
  document.getElementById('splash').classList.add('hide');
  if(!had){
    setTimeout(function(){ toast('👆 اضغط على أي قطعة أرض فارغة لزراعتها',true); },600);
    setTimeout(function(){ toast('🌾 المحصول الجاهز يلمع — اضغط عليه للحصاد',true); },4200);
  }
});
</script>
