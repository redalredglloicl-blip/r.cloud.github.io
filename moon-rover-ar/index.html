<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>سباق الضراط</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1a6fa8}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
#game{height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
.pill{background:rgba(0,0,0,.45);color:#fff;border-radius:18px;padding:6px 14px;font-weight:800;font-size:15px}
#hearts{font-size:16px;letter-spacing:2px}
#gaswrap{position:absolute;top:64px;right:12px;width:26px;height:150px;background:rgba(0,0,0,.4);border-radius:14px;border:2px solid rgba(255,255,255,.5);z-index:5;overflow:hidden;pointer-events:none}
#gasfill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#a4e34a,#5aa32a);transition:height .15s}
#gaslabel{position:absolute;top:220px;right:0;width:50px;text-align:center;color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;z-index:5;pointer-events:none}
#toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;text-align:center;white-space:nowrap}
#toast.show{opacity:1}
#splash,#over{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(20,80,130,.92),rgba(10,50,90,.95));padding:28px;text-align:center;transition:opacity .4s}
#splash.hide,#over.hide{opacity:0;pointer-events:none}
#splash h1{font-size:42px;color:#a4e34a;text-shadow:0 3px 0 #2a5a10,0 6px 14px rgba(0,0,0,.4)}
#splash p,#over p{color:#fff;font-size:15px;line-height:2;text-shadow:0 1px 4px #000}
.bigbtn{background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:24px;padding:16px 70px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2a5a10,0 8px 16px rgba(0,0,0,.3)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a5a10}
#over h2{font-size:36px;color:#ffd94d;text-shadow:0 3px 0 #7a5a10}
#best{color:#a4e34a;font-weight:800}
.vtag{position:absolute;bottom:12px;left:14px;color:#fff;font-size:12px;font-weight:700;opacity:.7;z-index:6}
#fartbtns{position:absolute;bottom:0;left:0;right:0;height:26%;display:flex;z-index:4}
.fz{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;color:rgba(255,255,255,.55);font-size:15px;font-weight:800}
.fz small{display:block;font-size:11px;opacity:.8}
#sndbtn{position:absolute;bottom:14px;right:14px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;z-index:21;cursor:pointer}
#sndbtn svg{width:22px;height:22px}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill" id="score">0 م</div>
    <div class="pill" id="hearts">❤❤❤</div>
  </div>
  <div id="gaswrap"><div id="gasfill" style="height:100%"></div></div>
  <div id="gaslabel">غاز</div>
  <div id="fartbtns">
    <div class="fz" id="zl">اضغط<br><small>ضرطة يسار ← تطير يمين</small></div>
    <div class="fz" id="zr">اضغط<br><small>ضرطة يمين ← تطير يسار</small></div>
  </div>
  <div id="toast"></div>
  <div id="sndbtn"></div>
  <div id="splash">
    <div style="font-size:70px">💨</div>
    <h1>سباق الضراط</h1>
    <p>طوفك يمشي بقوة الضراط فقط!<br>اضغط يمين ويسار لتوجيه الطوف<br>اجمع الفاصوليا لتعبئة الغاز<br>احذر الصخور والدوامات!</p>
    <button class="bigbtn" id="startb">انطلق 💨</button>
  </div>
  <div id="over" class="hide">
    <h2>انفجر الطوف!</h2>
    <p>قطعت <b id="finald">0</b> متر<br>أحسن مسافة: <b id="best">0</b> متر</p>
    <button class="bigbtn" id="againb">مرة ثانية 💨</button>
  </div>
  <div class="vtag">v1.0</div>
</div>
<script>
'use strict';
/* ================= Setup ================= */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
/* ================= Audio: synth farts ================= */
var AC=null,muted=false;
try{muted=localStorage.getItem('fart_mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a,dur){var b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}return b;}
function fart(big){
 if(muted)return;var a=ac();if(!a)return;
 try{
  var dur=big?0.7:0.38,t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a,dur);
  var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  f.frequency.setValueAtTime(big?500:700,t);f.frequency.exponentialRampToValueAtTime(90,t+dur);
  var g=a.createGain();g.gain.setValueAtTime(0.0001,t);
  var lfo=a.createOscillator();lfo.type='square';lfo.frequency.setValueAtTime(big?22:30,t);lfo.frequency.exponentialRampToValueAtTime(9,t+dur);
  var lg=a.createGain();lg.gain.value=0.5;lfo.connect(lg);lg.connect(g.gain);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);lfo.start(t);src.stop(t+dur+0.05);lfo.stop(t+dur+0.05);
 }catch(e){}
}
function blip(fr,dur,type,vol){if(muted)return;var a=ac();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;g.gain.setValueAtTime(vol||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}catch(e){}}
function sndPick(){blip(660,.1,'sine');setTimeout(function(){blip(880,.12,'sine');},70);}
function sndHit(){blip(140,.25,'sawtooth',.2);}
function sndOver(){var n=[400,320,240,160];for(var i=0;i<n.length;i++)(function(f,i){setTimeout(function(){blip(f,.25,'triangle',.18);},i*160);})(n[i],i);}
function sndClick(){blip(500,.06,'square',.06);}
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff"/><path d="M16 9 Q19 12 16 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff" opacity=".5"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= State ================= */
var state='splash';
var px=0,py=0,pvx=0,tilt=0,inv=0;
var gas=100,hearts=3,dist=0,speed=0,elapsed=0;
var obstacles=[],pickups=[],parts=[],clouds=[];
var best=0;try{best=parseInt(localStorage.getItem('fart_best')||'0');}catch(e){}
var shake=0,fartAnim=0;
var keys={l:false,r:false};
function reset(){
 px=W/2;py=H*0.68;pvx=0;tilt=0;inv=0;gas=100;hearts=3;dist=0;speed=220;elapsed=0;
 obstacles=[];pickups=[];parts=[];shake=0;
 for(var i=0;i<5;i++)clouds.push({x:Math.random()*W,y:Math.random()*H*0.4,s:0.5+Math.random()});
 updateHearts();
}
/* ================= Input ================= */
function bindZone(el,side){
 var on=function(e){e.preventDefault();keys[side]=true;ac();};
 var off=function(e){e.preventDefault();keys[side]=false;};
 el.addEventListener('touchstart',on,{passive:false});
 el.addEventListener('touchend',off,{passive:false});
 el.addEventListener('touchcancel',off,{passive:false});
 el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
}
bindZone(document.getElementById('zl'),'l');
bindZone(document.getElementById('zr'),'r');
/* ================= Entities ================= */
function spawnObstacle(){
 var r=Math.random();
 var x=40+Math.random()*(W-80);
 if(r<0.62)obstacles.push({t:'rock',x:x,y:-50,rad:26+Math.random()*20});
 else obstacles.push({t:'pool',x:x,y:-60,rad:44+Math.random()*14,ph:Math.random()*6});
}
function spawnPickup(){
 var x=40+Math.random()*(W-80);
 pickups.push({t:Math.random()<0.75?'bean':'chili',x:x,y:-40,ph:Math.random()*6});
}
function puff(x,y,big){
 var n=big?10:5;
 for(var i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*20,y:y,r:6+Math.random()*(big?14:9),vx:(Math.random()-0.5)*60,vy:-40-Math.random()*50,life:1,dec:1.4+Math.random()});
}
function splashP(x,y){
 for(var i=0;i<12;i++){var a=Math.random()*Math.PI*2;parts.push({x:x,y:y,r:3+Math.random()*4,vx:Math.cos(a)*140,vy:Math.sin(a)*140-40,life:1,dec:2.2,water:true});}
}
/* ================= Update ================= */
var lastT=0,spawnT=0,pickT=0;
function update(dt){
 elapsed+=dt;
 speed=220+Math.min(320,elapsed*4);
 dist+=speed*dt/50;
 /* farting */
 var farting=false;
 if(keys.l&&gas>0){pvx+=900*dt;gas-=26*dt;farting='l';}
 if(keys.r&&gas>0){pvx-=900*dt;gas-=26*dt;farting='r';}
 if(farting){fartAnim+=dt*10;if(Math.random()<dt*9){fart(false);puff(px+(farting==='l'?-34:34),py+6,false);}}
 else fartAnim=0;
 gas=Math.max(0,gas);
 pvx*=Math.pow(0.12,dt);pvx=Math.max(-420,Math.min(420,pvx));
 px+=pvx*dt;tilt+=((pvx/420)*0.35-tilt)*Math.min(1,dt*8);
 if(px<36){px=36;pvx=Math.abs(pvx)*0.4;}
 if(px>W-36){px=W-36;pvx=-Math.abs(pvx)*0.4;}
 if(inv>0)inv-=dt;
 /* spawns */
 spawnT-=dt;if(spawnT<=0){spawnObstacle();spawnT=Math.max(0.35,1.1-elapsed*0.008);}
 pickT-=dt;if(pickT<=0){spawnPickup();pickT=2.2+Math.random()*2;}
 /* obstacles */
 for(var i=obstacles.length-1;i>=0;i--){
  var o=obstacles[i];o.y+=speed*dt;o.ph+=dt*3;
  if(o.t==='pool'){var dx=px-o.x,dy=py-o.y,d=Math.sqrt(dx*dx+dy*dy);if(d<o.rad+70&&d>4){pvx+=dx/d*-140*dt*(1-d/(o.rad+70));}}
  if(o.y>H+80){obstacles.splice(i,1);continue;}
  if(inv<=0){
   var ox=o.x-px,oy=o.y-py,rr=o.rad*0.75;
   if(ox*ox+oy*oy<rr*rr){
    hearts--;inv=1.4;shake=0.5;sndHit();splashP(px,py);
    fart(true);puff(px,py,true);
    updateHearts();
    if(hearts<=0){gameOver();return;}
    else toast('اوتش!');
   }
  }
 }
 /* pickups */
 for(var j=pickups.length-1;j>=0;j--){
  var q=pickups[j];q.y+=speed*dt;q.ph+=dt*4;
  if(q.y>H+40){pickups.splice(j,1);continue;}
  var qx=q.x-px,qy=q.y-py;
  if(qx*qx+qy*qy<42*42){
   if(q.t==='bean'){gas=Math.min(100,gas+32);toast('+ غاز');}
   else{gas=Math.min(100,gas+15);speed+=120;toast('فلفل حار! سرعة!');setTimeout(function(){},1);}
   sndPick();puff(q.x,q.y,false);
   pickups.splice(j,1);
  }
 }
 /* parts */
 for(var k=parts.length-1;k>=0;k--){var p=parts[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=30*dt;p.life-=p.dec*dt;if(p.life<=0)parts.splice(k,1);}
 /* clouds */
 for(var c=0;c<clouds.length;c++){var cl=clouds[c];cl.x+=12*dt;if(cl.x>W+80)cl.x=-80;}
 if(shake>0)shake-=dt;
 document.getElementById('score').textContent=Math.floor(dist)+' م';
 document.getElementById('gasfill').style.height=gas+'%';
}
/* ================= Draw ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-0.5)*shake*22,(Math.random()-0.5)*shake*22);
 /* river */
 var g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#2a8fc4');g.addColorStop(1,'#166a9c');
 ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
 /* banks */
 ctx.fillStyle='#5da24a';ctx.fillRect(-20,-20,34,H+40);ctx.fillRect(W-14,-20,34,H+40);
 ctx.fillStyle='#4a8a3c';
 for(var b=0;b<H;b+=46){ctx.fillRect(-20,b+((elapsed*60)%46),34,20);ctx.fillRect(W-14,b+((elapsed*60)%46),34,20);}
 /* waves */
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;
 var off=(elapsed*speed)%70;
 for(var wv=-70;wv<H+70;wv+=70){
  ctx.beginPath();
  for(var x=30;x<W-30;x+=24)ctx.lineTo(x,wv+((x*0.05+elapsed*2)%1)*8);
  ctx.stroke();
 }
 /* clouds */
 ctx.fillStyle='rgba(255,255,255,.85)';
 clouds.forEach(function(c){ctx.beginPath();ctx.ellipse(c.x,c.y,44*c.s,16*c.s,0,0,7);ctx.ellipse(c.x+30*c.s,c.y+4,30*c.s,12*c.s,0,0,7);ctx.fill();});
 /* pickups */
 pickups.forEach(function(q){
  var bob=Math.sin(q.ph)*5;
  ctx.save();ctx.translate(q.x,q.y+bob);
  if(q.t==='bean'){
   ctx.fillStyle='#8a5a2a';rr(-11,-15,22,30,11);ctx.fill();
   ctx.fillStyle='#a06a3c';rr(-7,-11,14,22,7);ctx.fill();
  }else{
   ctx.fillStyle='#d43a2a';
   ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(14,-4,4,14);ctx.quadraticCurveTo(0,18,-4,14);ctx.quadraticCurveTo(-14,-4,0,-16);ctx.fill();
   ctx.fillStyle='#3d8b37';ctx.fillRect(-2,-20,4,7);
  }
  ctx.restore();
 });
 /* obstacles */
 obstacles.forEach(function(o){
  if(o.t==='rock'){
   ctx.fillStyle='#6b6b7a';
   ctx.beginPath();ctx.arc(o.x,o.y,o.rad,0,7);ctx.fill();
   ctx.fillStyle='#8a8a9a';
   ctx.beginPath();ctx.arc(o.x-o.rad*0.25,o.y-o.rad*0.3,o.rad*0.55,0,7);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.35)';
   ctx.beginPath();ctx.arc(o.x-o.rad*0.3,o.y-o.rad*0.35,o.rad*0.2,0,7);ctx.fill();
  }else{
   for(var i=3;i>0;i--){
    ctx.strokeStyle='rgba(10,40,70,'+(0.25+i*0.2)+')';ctx.lineWidth=7;
    ctx.beginPath();ctx.arc(o.x,o.y,o.rad*(i/3)+Math.sin(o.ph+i)*6,o.ph,o.ph+4.6);ctx.stroke();
   }
  }
 });
 /* gas particles (behind player) */
 parts.forEach(function(p){
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.water?'#bfe6ff':'#7ec850';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+1,0,7);ctx.fill();
 });
 ctx.globalAlpha=1;
 /* raft + player */
 ctx.save();ctx.translate(px,py);ctx.rotate(tilt);
 if(inv>0&&Math.floor(elapsed*10)%2===0)ctx.globalAlpha=0.45;
 /* raft */
 ctx.fillStyle='#8a5a2a';rr(-46,-16,92,44,10);ctx.fill();
 ctx.strokeStyle='#5a3a1a';ctx.lineWidth=3;
 for(var l=-30;l<=30;l+=20){ctx.beginPath();ctx.moveTo(l,-16);ctx.lineTo(l,28);ctx.stroke();}
 ctx.strokeStyle='#3a2410';ctx.lineWidth=5;rr(-46,-16,92,44,10);ctx.stroke();
 /* character */
 var squash=fartAnim>0?1+Math.sin(fartAnim)*0.06:1;
 ctx.fillStyle='#ffd9b3';
 ctx.beginPath();ctx.ellipse(0,-34,24,22*squash,0,0,7);ctx.fill();
 /* eyes */
 ctx.fillStyle='#222';
 var look=pvx/420*5;
 ctx.beginPath();ctx.arc(-8+look,-38,3.4,0,7);ctx.arc(8+look,-38,3.4,0,7);ctx.fill();
 /* mouth: O when farting */
 ctx.fillStyle='#7a2a1a';
 if(fartAnim>0){ctx.beginPath();ctx.ellipse(look,-24,5,7,0,0,7);ctx.fill();}
 else{ctx.lineWidth=3;ctx.strokeStyle='#7a2a1a';ctx.beginPath();ctx.arc(look,-28,8,0.3,Math.PI-0.3);ctx.stroke();}
 /* cheeks puff when farting */
 if(fartAnim>0){ctx.fillStyle='rgba(255,120,120,.5)';ctx.beginPath();ctx.arc(-16,-28,6,0,7);ctx.arc(16,-28,6,0,7);ctx.fill();}
 /* arms */
 ctx.strokeStyle='#ffd9b3';ctx.lineWidth=9;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-20,-24);ctx.lineTo(-34,-8);ctx.stroke();
 ctx.beginPath();ctx.moveTo(20,-24);ctx.lineTo(34,-8);ctx.stroke();
 ctx.restore();
 /* fart flames handled by particles */
 /* vignette when low gas */
 if(gas<25){ctx.fillStyle='rgba(200,30,30,'+(0.12+0.08*Math.sin(elapsed*6))+')';ctx.fillRect(0,0,W,H);}
 ctx.restore();
}
/* ================= Flow ================= */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1200);}
function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts));}
function gameOver(){
 state='over';sndOver();
 var d=Math.floor(dist);
 if(d>best){best=d;try{localStorage.setItem('fart_best',String(best));}catch(e){}}
 document.getElementById('finald').textContent=d;
 document.getElementById('best').textContent=best;
 setTimeout(function(){document.getElementById('over').classList.remove('hide');},600);
}
function loop(t){
 requestAnimationFrame(loop);
 if(!lastT)lastT=t;
 var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
 if(state==='play'){update(dt);}
 draw();
}
document.getElementById('startb').addEventListener('click',function(){
 sndClick();ac();
 document.getElementById('splash').classList.add('hide');
 document.getElementById('over').classList.add('hide');
 reset();state='play';
 toast('اضغط يمين ويسار!');
});
document.getElementById('againb').addEventListener('click',function(){
 sndClick();
 document.getElementById('over').classList.add('hide');
 reset();state='play';
});
function drawSnd(){document.getElementById('sndbtn').innerHTML=muted?SND_OFF:SND_ON;}
document.getElementById('sndbtn').addEventListener('click',function(e){
 e.stopPropagation();muted=!muted;
 try{localStorage.setItem('fart_mute',muted?'1':'0');}catch(e2){}
 drawSnd();if(!muted)sndClick();
});
/* ================= Init ================= */
resize();drawSnd();reset();state='splash';
requestAnimationFrame(loop);
setTimeout(resize,300);
</script>
</body>
</html>
