<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>مزرعتي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#7ec8f7 0%,#aee3ff 45%,#cdeffd 100%);color:#333;touch-action:manipulation}
#game{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
/* Header */
#hdr{background:linear-gradient(180deg,#fffdf5,#fff7e0);border-bottom:3px solid #d9b84a;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#hdr .coinbox{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #e8c547;border-radius:20px;padding:5px 12px;font-weight:800;font-size:17px;color:#8a6d1a}
#hdr .lvlbox{flex:1}
#hdr .lvlrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#6b5320}
#xpbar{height:10px;background:#e8dcc0;border-radius:6px;margin-top:4px;overflow:hidden}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#7ed321,#4a9e1f);border-radius:6px;transition:width .4s}
#ver{font-size:11px;color:#999;font-weight:700}
/* Farm */
#sky{position:relative;flex:1;overflow:hidden;background:linear-gradient(180deg,#8fd0f8 0%,#bfe6ff 55%,#dff5e1 100%)}
.cloud{position:absolute;background:#fff;border-radius:30px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:120%;top:-60%;left:15%}
.cloud::after{width:40%;height:80%;top:-40%;right:15%}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(560px)}}
#sun{position:absolute;top:18px;left:24px;width:64px;height:64px;background:radial-gradient(circle,#fff7ae 30%,#ffe14d 60%,rgba(255,225,77,0) 72%);border-radius:50%;animation:sunpulse 4s ease-in-out infinite}
@keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#farm{position:absolute;bottom:0;left:0;right:0;padding:14px 14px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plot{aspect-ratio:1/1;background:linear-gradient(180deg,#8a5a33,#6e4525);border-radius:16px;border:3px solid #5a3a1e;position:relative;overflow:hidden;cursor:pointer;box-shadow:inset 0 3px 6px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2);transition:transform .12s}
.plot:active{transform:scale(.95)}
.plot .soil{position:absolute;inset:6px;background:repeating-linear-gradient(0deg,transparent,transparent 8px,rgba(0,0,0,.12) 8px,rgba(0,0,0,.12) 10px),#7a4e2b;border-radius:10px}
.plot .crop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.plot .crop svg{width:72%;height:72%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.plot.ready{animation:readybounce 1s ease-in-out infinite;border-color:#ffd94d;box-shadow:inset 0 3px 6px rgba(0,0,0,.3),0 0 14px rgba(255,217,77,.8)}
@keyframes readybounce{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.plot .timer{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.35);padding:2px 0}
.plot .prog{position:absolute;bottom:0;left:0;height:5px;background:#7ed321;transition:width 1s linear}
/* Bottom sheet */
#sheet{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fffdf5;border-radius:22px 22px 0 0;padding:18px 16px 30px;z-index:50;transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,.24,1);box-shadow:0 -4px 24px rgba(0,0,0,.25);max-height:70dvh;overflow-y:auto}
#sheet.open{transform:translateY(0)}
#sheet h3{text-align:center;margin-bottom:4px;color:#5a3a1e;font-size:18px}
#sheet .sub{text-align:center;color:#999;font-size:12px;margin-bottom:14px}
.seed{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e8dcc0;border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.seed:active{transform:scale(.98)}
.seed.locked{opacity:.45}
.seed .sic{width:52px;height:52px;flex-shrink:0;background:#f4ecd8;border-radius:12px;display:flex;align-items:center;justify-content:center}
.seed .sic svg{width:40px;height:40px}
.seed .sinfo{flex:1}
.seed .sname{font-weight:800;font-size:16px;color:#4a3319}
.seed .smeta{font-size:12px;color:#8a7a5a;margin-top:2px}
.seed .scost{display:flex;align-items:center;gap:4px;font-weight:800;color:#8a6d1a;font-size:15px}
.seed .locktag{font-size:12px;color:#c0392b;font-weight:700}
#sheetClose{display:block;margin:6px auto 0;background:#e8dcc0;border:none;border-radius:12px;padding:10px 40px;font-size:15px;font-weight:700;color:#5a3a1e;cursor:pointer}
/* Toast */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(40,30,15,.92);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:100;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Coin fly */
.flycoin{position:fixed;z-index:90;pointer-events:none;font-weight:800;color:#b8860b;font-size:18px;animation:flyup 1s ease-out forwards}
@keyframes flyup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
/* Level up modal */
#lvlmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:center;justify-content:center}
#lvlmodal.open{display:flex}
#lvlmodal .card{background:linear-gradient(180deg,#fffdf5,#ffefc4);border-radius:24px;padding:32px 28px;text-align:center;max-width:320px;animation:pop .4s cubic-bezier(.30,1.4,.36,1);border:3px solid #e8c547}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#lvlmodal h2{color:#8a6d1a;font-size:26px;margin-bottom:8px}
#lvlmodal p{color:#6b5320;margin-bottom:16px;line-height:1.7}
#lvlmodal button{background:linear-gradient(180deg,#7ed321,#4a9e1f);color:#fff;border:none;border-radius:14px;padding:12px 44px;font-size:17px;font-weight:800;cursor:pointer}
/* Splash */
#splash{position:fixed;inset:0;background:linear-gradient(180deg,#5da9e9 0%,#aee3ff 50%,#8fd694 100%);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{font-size:44px;color:#fff;text-shadow:0 3px 0 #3d8b37,0 6px 12px rgba(0,0,0,.3)}
#splash p{color:#fff;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#splash button{background:#fff;color:#3d8b37;border:none;border-radius:20px;padding:14px 60px;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#splash button:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="game">
  <div id="hdr">
    <div class="coinbox"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#b8860b" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#8a6d1a">¢</text></svg><span id="coins">100</span></div>
    <div class="lvlbox">
      <div class="lvlrow"><span>مستوى <span id="level">1</span></span><span id="xptext" style="color:#999">0/50</span></div>
      <div id="xpbar"><div id="xpfill"></div></div>
    </div>
    <span id="ver">v1.0</span>
  </div>
  <div id="sky">
    <div id="sun"></div>
    <div class="cloud" style="top:30px;width:90px;height:28px;animation-duration:38s"></div>
    <div class="cloud" style="top:90px;width:70px;height:22px;animation-duration:52s;animation-delay:-18s"></div>
    <div class="cloud" style="top:150px;width:110px;height:32px;animation-duration:65s;animation-delay:-40s"></div>
    <div id="farm"></div>
  </div>
</div>

<div id="sheet">
  <h3>اختر البذور</h3>
  <div class="sub">اضغط على المحصول لزراعته</div>
  <div id="seedlist"></div>
  <button id="sheetClose">إغلاق</button>
</div>

<div id="toast"></div>

<div id="lvlmodal">
  <div class="card">
    <h2>🎉 مستوى جديد!</h2>
    <p id="lvltext">وصلت للمستوى 2<br>+50 عملة هدية</p>
    <button id="lvlok">رائع!</button>
  </div>
</div>

<div id="splash">
  <h1>🌾 مزرعتي</h1>
  <p>ازرع، احصد، وطوّر مزرعتك!</p>
  <button id="startbtn">ابدأ اللعب</button>
</div>

<script>
'use strict';
// ===== Data =====
var CROPS = {
  wheat:  {name:'قمح', time:30,  cost:10, sell:25, xp:5,  unlock:1},
  corn:   {name:'ذرة', time:60,  cost:20, sell:50, xp:10, unlock:1},
  carrot: {name:'جزر', time:120, cost:35, sell:90, xp:18, unlock:2}
};
var ORDER = ['wheat','corn','carrot'];
// ===== SVG crops (3 stages each) =====
function svgCrop(crop, stage){
  var s = '';
  if(stage===0){ // sprout
    s = '<path d="M20 34 Q20 22 12 16 M20 34 Q20 22 28 16" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="15" rx="5" ry="3" fill="#5cb85c" transform="rotate(-30 12 15)"/><ellipse cx="28" cy="15" rx="5" ry="3" fill="#5cb85c" transform="rotate(30 28 15)"/>';
  } else if(stage===1){ // growing
    if(crop==='carrot'){
      s = '<path d="M20 36 L20 16 M20 24 L13 14 M20 24 L27 14 M20 30 L15 22 M20 30 L25 22" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/>';
    } else {
      s = '<path d="M20 38 L20 10" stroke="#4a9e1f" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="13" cy="24" rx="6" ry="3.5" fill="#5cb85c" transform="rotate(-25 13 24)"/><ellipse cx="27" cy="18" rx="6" ry="3.5" fill="#5cb85c" transform="rotate(25 27 18)"/><ellipse cx="14" cy="32" rx="5" ry="3" fill="#6cc06c" transform="rotate(-20 14 32)"/>';
    }
  } else { // ready
    if(crop==='wheat'){
      s = '<path d="M20 38 L20 8" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>'+
          [8,14,20,26].map(function(y){return '<ellipse cx="14" cy="'+y+'" rx="5" ry="2.6" fill="#e8c547" transform="rotate(-35 14 '+y+')"/><ellipse cx="26" cy="'+y+'" rx="5" ry="2.6" fill="#e8c547" transform="rotate(35 26 '+y+')"/>';}).join('')+
          '<ellipse cx="20" cy="6" rx="4" ry="5" fill="#f5d76e"/>';
    } else if(crop==='corn'){
      s = '<path d="M20 38 L20 10" stroke="#4a9e1f" stroke-width="4" stroke-linecap="round"/><ellipse cx="20" cy="22" rx="7" ry="11" fill="#f7b32b" stroke="#d6941a" stroke-width="1.5"/><path d="M20 12 L20 33" stroke="#d6941a" stroke-width="1.5" stroke-dasharray="3 2"/><ellipse cx="12" cy="30" rx="5" ry="3" fill="#5cb85c" transform="rotate(-25 12 30)"/><ellipse cx="28" cy="30" rx="5" ry="3" fill="#5cb85c" transform="rotate(25 28 30)"/>';
    } else {
      s = '<path d="M20 36 L20 16 M20 24 L13 14 M20 24 L27 14" stroke="#3d8b37" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M14 30 L26 30 L20 40 Z" fill="#ef6c33" stroke="#c8551f" stroke-width="1.5"/>';
    }
  }
  return '<svg viewBox="0 0 40 44">'+s+'</svg>';
}
// ===== State =====
var S = {coins:100, xp:0, level:1, plots:[]};
for(var i=0;i<12;i++) S.plots.push(null);
function xpNeed(){ return S.level*50; }
function save(){ try{localStorage.setItem('myfarm_v1', JSON.stringify(S));}catch(e){} }
function load(){
  try{
    var d = JSON.parse(localStorage.getItem('myfarm_v1'));
    if(d && typeof d.coins==='number'){ S.coins=d.coins; S.xp=d.xp||0; S.level=d.level||1; if(Array.isArray(d.plots)&&d.plots.length===12) S.plots=d.plots; }
  }catch(e){}
}
// ===== UI =====
var farmEl = document.getElementById('farm');
var coinsEl = document.getElementById('coins');
var levelEl = document.getElementById('level');
var xpfill = document.getElementById('xpfill');
var xptext = document.getElementById('xptext');
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec>=60) return Math.floor(sec/60)+'د '+(sec%60)+'ث';
  return sec+'ث';
}
function updateHUD(){
  coinsEl.textContent = S.coins;
  levelEl.textContent = S.level;
  var need = xpNeed();
  xpfill.style.width = Math.min(100, S.xp/need*100)+'%';
  xptext.textContent = S.xp+'/'+need;
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){t.classList.remove('show');}, 1800);
}
function flyCoin(x, y, txt){
  var d = document.createElement('div');
  d.className='flycoin'; d.textContent=txt;
  d.style.left=(x-20)+'px'; d.style.top=(y-10)+'px';
  document.body.appendChild(d);
  setTimeout(function(){d.remove();},1000);
}
// ===== Farm render =====
var plotEls = [];
function buildFarm(){
  farmEl.innerHTML='';
  plotEls=[];
  for(var i=0;i<12;i++){
    (function(idx){
      var p = document.createElement('div');
      p.className='plot';
      p.innerHTML='<div class="soil"></div><div class="crop"></div><div class="timer" style="display:none"></div><div class="prog" style="width:0%"></div>';
      p.addEventListener('click', function(e){ onPlot(idx, e); });
      farmEl.appendChild(p);
      plotEls.push(p);
    })(i);
  }
  refreshPlots();
}
function plotProgress(p){
  if(!p) return 0;
  var c = CROPS[p.crop];
  return Math.min(1, (Date.now()-p.plantedAt)/(c.time*1000));
}
function refreshPlots(){
  var now = Date.now();
  for(var i=0;i<12;i++){
    (function(idx){
      var p = S.plots[idx], el = plotEls[idx];
      var cropEl = el.querySelector('.crop'), timerEl = el.querySelector('.timer'), progEl = el.querySelector('.prog');
      el.classList.remove('ready');
      if(!p){ cropEl.innerHTML=''; timerEl.style.display='none'; progEl.style.width='0%'; return; }
      var c = CROPS[p.crop];
      var pr = Math.min(1, (now-p.plantedAt)/(c.time*1000));
      var stage = pr>=1?2:(pr>=0.5?1:0);
      cropEl.innerHTML = svgCrop(p.crop, stage);
      if(pr>=1){
        el.classList.add('ready');
        timerEl.style.display='block'; timerEl.textContent='جاهز!';
        progEl.style.width='100%';
      } else {
        timerEl.style.display='block';
        timerEl.textContent = fmtTime(c.time - (now-p.plantedAt)/1000);
        progEl.style.width = (pr*100)+'%';
      }
    })(i);
  }
}
// ===== Actions =====
var sheet = document.getElementById('sheet');
var seedlist = document.getElementById('seedlist');
var selPlot = -1;
function openSheet(idx){
  selPlot = idx;
  seedlist.innerHTML='';
  ORDER.forEach(function(key){
    var c = CROPS[key];
    var locked = S.level < c.unlock;
    var afford = S.coins >= c.cost;
    var d = document.createElement('div');
    d.className = 'seed'+(locked?' locked':'');
    d.innerHTML = '<div class="sic">'+svgCrop(key,2)+'</div>'+
      '<div class="sinfo"><div class="sname">'+c.name+'</div>'+
      '<div class="smeta">'+fmtTime(c.time)+' • بيع '+c.sell+' • +'+c.xp+' خبرة</div>'+
      (locked?'<div class="locktag">يفتح بالمستوى '+c.unlock+'</div>':'')+'</div>'+
      '<div class="scost"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#b8860b" stroke-width="2"/></svg>'+c.cost+'</div>';
    if(!locked && afford){
      d.addEventListener('click', function(){ plant(key); });
    } else if(!locked && !afford){
      d.addEventListener('click', function(){ toast('عملات غير كافية!'); });
    }
    seedlist.appendChild(d);
  });
  sheet.classList.add('open');
}
document.getElementById('sheetClose').addEventListener('click', function(){ sheet.classList.remove('open'); });
function plant(key){
  if(selPlot<0) return;
  var c = CROPS[key];
  if(S.level < c.unlock || S.coins < c.cost) return;
  S.coins -= c.cost;
  S.plots[selPlot] = {crop:key, plantedAt:Date.now()};
  sheet.classList.remove('open');
  save(); updateHUD(); refreshPlots();
  toast('زرعت '+c.name+' 🌱');
}
function onPlot(idx, e){
  var p = S.plots[idx];
  if(!p){ openSheet(idx); return; }
  var pr = plotProgress(p);
  if(pr>=1){
    // harvest
    var c = CROPS[p.crop];
    S.plots[idx]=null;
    S.coins += c.sell;
    addXP(c.xp);
    save(); updateHUD(); refreshPlots();
    var x = e.changedTouches? e.changedTouches[0].clientX : (e.clientX||innerWidth/2);
    var y = e.changedTouches? e.changedTouches[0].clientY : (e.clientY||innerHeight/2);
    flyCoin(x, y, '+'+c.sell);
  } else {
    toast('ينضج بعد '+fmtTime(c.time*(1-pr)));
  }
}
function addXP(n){
  S.xp += n;
  var need = xpNeed();
  if(S.xp >= need){
    S.xp -= need; S.level++;
    S.coins += 50;
    save(); updateHUD();
    document.getElementById('lvltext').innerHTML = 'وصلت للمستوى '+S.level+'<br>+50 عملة هدية 🎁';
    document.getElementById('lvlmodal').classList.add('open');
  }
}
document.getElementById('lvlok').addEventListener('click', function(){
  document.getElementById('lvlmodal').classList.remove('open');
});
// ===== Init =====
load();
buildFarm();
updateHUD();
setInterval(refreshPlots, 1000);
document.getElementById('startbtn').addEventListener('click', function(){
  document.getElementById('splash').classList.add('hide');
});
</script>
</body>
</html>
