<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fart Together 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0e4a7a}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
#game{height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:#0e4a7a}
/* ---------- 3D scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;
 background:linear-gradient(180deg,#2f8fd0 0%,#7ec8ee 30%,#cdeefb 38%,#9ed4e8 42%,#1a7ab5 60%,#0f5a8a 100%);
 perspective:600px;perspective-origin:50% 38%;}
#world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
.seg{position:absolute;left:50%;top:50%;width:1360px;height:560px;margin:-280px 0 0 -680px;transform-origin:50% 50%;
 background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 8px,transparent 8px 26px),
  linear-gradient(90deg,#2a5a10 0%,#2a5a10 6%,#69b32a 6%,#69b32a 11%,#8ede3a 11%,#8ede3a 13%,rgba(255,255,255,.9) 13%,rgba(255,255,255,.9) 15%,#2aa5dc 15%,#2aa5dc 85%,rgba(255,255,255,.9) 85%,rgba(255,255,255,.9) 87%,#8ede3a 87%,#8ede3a 89%,#69b32a 89%,#69b32a 94%,#2a5a10 94%,#2a5a10 100%);
 background-size:100% 90px,100% 100%;
 animation:waves 1.1s linear infinite;will-change:background-position;}
.seg.boost{background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 8px,transparent 8px 26px),
  linear-gradient(90deg,#2a5a10 0%,#2a5a10 6%,#69b32a 6%,#69b32a 11%,#8ede3a 11%,#8ede3a 13%,rgba(255,255,255,.9) 13%,rgba(255,255,255,.9) 15%,#8e44ad 15%,#8e44ad 85%,rgba(255,255,255,.9) 85%,rgba(255,255,255,.9) 87%,#8ede3a 87%,#8ede3a 89%,#69b32a 89%,#69b32a 94%,#2a5a10 94%,#2a5a10 100%);
 background-size:100% 90px,100% 100%;}
@keyframes waves{to{background-position:0 90px,0 0;}}
.obj{position:absolute;left:50%;top:50%;will-change:transform;}
.obj svg{display:block;width:100%;height:100%;overflow:visible;}
#raft{position:absolute;left:50%;top:50%;width:340px;height:210px;margin:-105px 0 0 -170px;will-change:transform;}
#raftInner{width:100%;height:100%;will-change:transform;}
#raftInner svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 10px 12px rgba(0,30,60,.3));}
.spin{animation:spinY 2.2s linear infinite;}
@keyframes spinY{to{transform:rotateY(360deg);}}
/* ---------- UI ---------- */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;z-index:5;pointer-events:none}
#hudrow{display:flex;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:6px 13px;font-weight:800;font-size:14px}
#progbar{height:8px;background:rgba(0,0,0,.4);border-radius:6px;margin-top:8px;overflow:hidden}
#progfill{height:100%;width:0%;background:linear-gradient(90deg,#7ed321,#a4e34a);transition:width .3s}
#gasbar{height:10px;background:rgba(0,0,0,.45);border-radius:8px;margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#gasfill{height:100%;width:100%;background:linear-gradient(90deg,#a4e34a,#5aa32a);transition:width .15s}
#joy{position:absolute;bottom:26px;left:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#fartbtn{position:absolute;bottom:30px;right:24px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4f07a,#5aa32a 70%);border:4px solid #fff;z-index:10;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#fartbtn:active{transform:scale(.92)}
#fartbtn.cd{filter:grayscale(.7);opacity:.6}
#toast{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(15,70,115,.82),rgba(8,40,75,.9));padding:28px;text-align:center;transition:opacity .4s}
.screen.hide{opacity:0;pointer-events:none}
.screen h1{font-size:36px;color:#a4e34a;text-shadow:0 3px 0 #2a5a10,0 6px 14px rgba(0,0,0,.4)}
.screen h2{font-size:32px;color:#ffd94d;text-shadow:0 3px 0 #7a5a10}
.screen p{color:#fff;font-size:15px;line-height:2.1;text-shadow:0 1px 4px #000}
.bigbtn{background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:24px;padding:16px 64px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2a5a10}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a5a10}
.vtag{position:absolute;bottom:8px;left:12px;color:#fff;font-size:11px;font-weight:700;opacity:.65;z-index:6}
#sndbtn{position:absolute;top:70px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;z-index:21}
#sndbtn svg{width:20px;height:20px}
.puff{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a4e34a,#5aa32a);pointer-events:none;z-index:4;}
</style>
</head>
<body>
<div id="game">
  <div id="scene"><div id="world"></div></div>
  <div id="hud">
    <div id="hudrow">
      <div class="pill" id="beans">🫘 0</div>
      <div class="pill" id="time">0:00</div>
      <div class="pill" id="hearts">❤❤❤</div>
    </div>
    <div id="progbar"><div id="progfill"></div></div>
    <div id="gasbar"><div id="gasfill"></div></div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fartbtn">💨</div>
  <div id="toast"></div>
  <div id="sndbtn"></div>
  <div class="screen" id="splash">
    <div style="font-size:64px">🐸💨🦛</div>
    <h1>Fart Together 3D</h1>
    <p>🕹️ الجويستك: وجّه الطوف بالقناة<br>💨 زر الضرطة: دفعة صاروخية!<br>اجمع الفاصوليا واعبر نقاط التفتيش<br>انتبه للصخور — اوصل للنهاية!</p>
    <button class="bigbtn" id="startb">انطلق</button>
  </div>
  <div class="screen hide" id="endsc">
    <h2 id="endtitle">وصلت!</h2>
    <p id="endtext"></p>
    <button class="bigbtn" id="againb">العب مرة ثانية</button>
  </div>
  <div class="vtag">v3.0 3D</div>
</div>
<script>
'use strict';
/* ================= Setup ================= */
var U=40,PERSP=600;
var sceneEl=document.getElementById('scene'),world=document.getElementById('world'),gameEl=document.getElementById('game');
var W=0,H=0;
function resize(){W=gameEl.clientWidth;H=gameEl.clientHeight;sceneEl.style.perspective='600px';}
addEventListener('resize',resize);
/* ================= Audio ================= */
var AC=null,muted=false;
try{muted=localStorage.getItem('ft3d_mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a,dur){var b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}return b;}
function fart(big){
 if(muted)return;var a=ac();if(!a)return;
 try{
  var dur=big?0.7:0.42,t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a,dur);
  var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  f.frequency.setValueAtTime(big?520:720,t);f.frequency.exponentialRampToValueAtTime(85,t+dur);
  var g=a.createGain();
  var lfo=a.createOscillator();lfo.type='square';lfo.frequency.setValueAtTime(big?20:30,t);lfo.frequency.exponentialRampToValueAtTime(9,t+dur);
  var lg=a.createGain();lg.gain.value=0.55;lfo.connect(lg);lg.connect(g.gain);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);lfo.start(t);src.stop(t+dur+0.05);lfo.stop(t+dur+0.05);
 }catch(e){}
}
function blip(fr,dur,type,vol,delay){if(muted)return;var a=ac();if(!a)return;try{var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);}catch(e){}}
function sndPick(){blip(660,.09,'sine');blip(920,.1,'sine',.14,.07);}
function sndHit(){blip(130,.28,'sawtooth',.22);}
function sndGate(){blip(784,.12,'triangle');blip(1046,.16,'triangle',.14,.1);}
function sndWin(){var n=[523,659,784,1046,1318];for(var i=0;i<n.length;i++)blip(n[i],.22,'triangle',.16,i*.13);}
function sndClick(){blip(500,.06,'square',.06);}
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff"/><path d="M16 9 Q19 12 16 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff" opacity=".5"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= SVG art ================= */
var SVG_RAFT='<svg viewBox="0 0 340 210">'
+'<ellipse cx="170" cy="14" rx="80" ry="9" fill="rgba(255,255,255,.4)"/>'
+'<ellipse cx="170" cy="34" rx="100" ry="11" fill="rgba(255,255,255,.28)"/>'
+'<ellipse cx="170" cy="56" rx="120" ry="13" fill="rgba(255,255,255,.18)"/>'
+'<ellipse cx="170" cy="188" rx="135" ry="13" fill="rgba(0,40,70,.25)"/>'
+'<ellipse cx="170" cy="125" rx="145" ry="60" fill="#f2e3c2"/>'
+'<ellipse cx="170" cy="125" rx="145" ry="60" fill="none" stroke="#d9c39a" stroke-width="6"/>'
+'<path d="M40,146 A145,60 0 0,0 300,146" fill="none" stroke="rgba(160,120,70,.35)" stroke-width="14"/>'
+'<path d="M46,104 A145,60 0 0,1 294,104" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="8"/>'
+'<ellipse cx="170" cy="125" rx="92" ry="38" fill="#a06a35"/>'
+'<g stroke="#7a4e22" stroke-width="2"><line x1="82" y1="112" x2="258" y2="112"/><line x1="80" y1="125" x2="260" y2="125"/><line x1="82" y1="138" x2="258" y2="138"/></g>'
+'<ellipse cx="32" cy="125" rx="14" ry="10" fill="#d33"/><ellipse cx="308" cy="125" rx="14" ry="10" fill="#d33"/>'
+'<ellipse cx="170" cy="70" rx="14" ry="10" fill="#d33"/><ellipse cx="170" cy="180" rx="14" ry="10" fill="#d33"/>'
+'<g transform="translate(118,108)">'
+'<ellipse cx="-16" cy="28" rx="11" ry="14" fill="#4caf50"/><ellipse cx="16" cy="28" rx="11" ry="14" fill="#4caf50"/>'
+'<ellipse cx="0" cy="0" rx="26" ry="30" fill="#66bb6a"/><ellipse cx="0" cy="10" rx="15" ry="17" fill="#a5d6a7"/>'
+'<ellipse cx="-26" cy="2" rx="7" ry="12" fill="#66bb6a" transform="rotate(-18 -26 2)"/><ellipse cx="26" cy="2" rx="7" ry="12" fill="#66bb6a" transform="rotate(18 26 2)"/>'
+'<circle cx="-11" cy="-32" r="12" fill="#66bb6a"/><circle cx="11" cy="-32" r="12" fill="#66bb6a"/>'
+'<circle cx="-11" cy="-32" r="7.5" fill="#fff"/><circle cx="11" cy="-32" r="7.5" fill="#fff"/>'
+'<circle cx="-11" cy="-32" r="3.5" fill="#1a1a1a"/><circle cx="11" cy="-32" r="3.5" fill="#1a1a1a"/>'
+'<path d="M-14,-8 Q0,4 14,-8" stroke="#2e7d32" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
+'<circle cx="-20" cy="-8" r="4.5" fill="#ff9e9e" opacity=".55"/><circle cx="20" cy="-8" r="4.5" fill="#ff9e9e" opacity=".55"/>'
+'</g>'
+'<g transform="translate(218,102)">'
+'<ellipse cx="-19" cy="32" rx="12" ry="15" fill="#5c9ded"/><ellipse cx="19" cy="32" rx="12" ry="15" fill="#5c9ded"/>'
+'<ellipse cx="0" cy="0" rx="30" ry="34" fill="#7ab5f5"/>'
+'<circle cx="-20" cy="-30" r="8" fill="#7ab5f5"/><circle cx="20" cy="-30" r="8" fill="#7ab5f5"/>'
+'<circle cx="-20" cy="-30" r="4" fill="#5c9ded"/><circle cx="20" cy="-30" r="4" fill="#5c9ded"/>'
+'<ellipse cx="0" cy="-8" rx="19" ry="13" fill="#a8ccf7"/>'
+'<circle cx="-7" cy="-8" r="2.8" fill="#3a6db5"/><circle cx="7" cy="-8" r="2.8" fill="#3a6db5"/>'
+'<circle cx="-14" cy="-24" r="7" fill="#fff"/><circle cx="14" cy="-24" r="7" fill="#fff"/>'
+'<circle cx="-14" cy="-24" r="3.2" fill="#1a1a1a"/><circle cx="14" cy="-24" r="3.2" fill="#1a1a1a"/>'
+'<ellipse cx="-30" cy="4" rx="7" ry="13" fill="#7ab5f5" transform="rotate(-15 -30 4)"/><ellipse cx="30" cy="4" rx="7" ry="13" fill="#7ab5f5" transform="rotate(15 30 4)"/>'
+'</g></svg>';
var SVG_ROCK='<svg viewBox="0 0 130 110">'
+'<ellipse cx="65" cy="96" rx="55" ry="10" fill="rgba(255,255,255,.5)"/>'
+'<path d="M15,95 Q10,55 35,35 Q55,15 85,25 Q115,35 118,70 Q120,95 95,98 Z" fill="#6b6b78"/>'
+'<path d="M35,35 Q55,15 85,25 Q95,30 100,45 Q70,40 50,55 Q35,65 35,35" fill="#85858f"/>'
+'<ellipse cx="55" cy="45" rx="14" ry="10" fill="rgba(255,255,255,.3)" transform="rotate(-20 55 45)"/></svg>';
var SVG_BEAN='<svg viewBox="0 0 70 90">'
+'<rect x="18" y="18" width="34" height="54" rx="14" fill="#2e7d32"/>'
+'<rect x="24" y="30" width="22" height="20" rx="8" fill="#66bb6a"/>'
+'<rect x="15" y="12" width="40" height="10" rx="5" fill="#1b5e20"/>'
+'<text x="35" y="64" text-anchor="middle" font-size="24" font-weight="bold" fill="#d7ffd7">ف</text></svg>';
function svgCheck(){var s='<svg viewBox="0 0 760 320">'
+'<rect x="30" y="40" width="26" height="280" rx="10" fill="#c9a86a"/>'
+'<rect x="704" y="40" width="26" height="280" rx="10" fill="#c9a86a"/>'
+'<rect x="30" y="40" width="700" height="72" fill="#f5c542"/>'
+'<rect x="30" y="40" width="700" height="72" fill="none" stroke="#a8842f" stroke-width="4"/>';
 for(var i=0;i<14;i++)s+='<rect x="'+(30+i*50)+'" y="88" width="50" height="24" fill="'+(i%2?'#111':'#fff')+'"/>';
 s+='<text x="380" y="80" text-anchor="middle" font-size="40" font-weight="bold" fill="#5a3a10">CHECK POINT</text></svg>';
 return s;}
var SVG_SPIRE='<svg viewBox="0 0 220 320">'
+'<path d="M20,320 L100,40 L140,120 L180,200 L200,320 Z" fill="#c96a5a"/>'
+'<path d="M100,40 L140,120 L180,200 L200,320 L140,320 Z" fill="#a85446"/>'
+'<path d="M20,320 L100,40 L112,110 L62,210 Z" fill="#e08a76" opacity=".55"/></svg>';
/* ================= State ================= */
var FINISH=1400,state='splash';
var px=0,pdist=0,speed=0;
var gas=100,hearts=3,elapsed=0,started=false,nbeans=0;
var fartCD=0,inv=0,shake=0,squash=0,tiltV=0;
var rocks=[],beans=[],checks=[],boosts=[],spires=[];
var best=1e9;try{var _b=parseFloat(localStorage.getItem('ft_best'));if(_b>0)best=_b;}catch(e){}
function fmtT(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function chanX(z){return 16*Math.sin(z*0.008)+8*Math.sin(z*0.023);}
var camX=0;
/* ================= World build ================= */
var SEG_N=24,SEG_L=14,segBase=-15;
var segs=[];
function mkDiv(cls,html){var d=document.createElement('div');d.className=cls;if(html)d.innerHTML=html;world.appendChild(d);return d;}
function buildWorld(){
 var i;
 for(i=0;i<SEG_N;i++){var s=mkDiv('seg');segs.push(s);}
 for(i=0;i<26;i++){
  var side=i%2?1:-1;
  var sp=mkDiv('obj',SVG_SPIRE);
  var z=40+i*58,wx=side*(26+Math.random()*20);
  sp.style.width='220px';sp.style.height='320px';
  sp.style.marginLeft='-110px';sp.style.marginTop='-320px';
  sp.style.transform='translate3d('+(wx*U)+'px,0px,'+(-z*U)+'px)';
  spires.push(sp);
 }
}
function segBoost(z0,z1){for(var i=0;i<boosts.length;i++){var b=boosts[i];if(z0<b.z1&&z1>b.z0)return true;}return false;}
function layoutSegs(){
 for(var i=0;i<SEG_N;i++){
  var zNear=-(segBase+i*SEG_L),zc=zNear-SEG_L/2;
  var s=segs[i];
  s.style.transform='translate3d('+(chanX(zc)*U)+'px,0px,'+(zc*U)+'px) rotateX(90deg)';
  var isB=segBoost(zNear-SEG_L,zNear);
  if(isB)s.classList.add('boost');else s.classList.remove('boost');
 }
}
function placeObj(d,w,h,wx,wy,wz){
 d.style.width=w+'px';d.style.height=h+'px';
 d.style.marginLeft=(-w/2)+'px';d.style.marginTop=(-h)+'px';
 d.style.transform='translate3d('+(wx*U)+'px,'+(-wy*U)+'px,'+(wz*U)+'px)';
 d._tmp=true;
}
function buildCourse(){
 rocks=[];beans=[];checks=[];boosts=[];
 var z,i;
 for(z=80;z<FINISH-60;z+=55){
  rocks.push({x:(Math.random()-0.5)*16,z:z,r:1.8+Math.random()*1.2,el:null});
  if(Math.random()<0.75)beans.push({x:(Math.random()-0.5)*18,z:z+26,ph:Math.random()*6,el:null});
  if(Math.random()<0.35)boosts.push({z0:z+40,z1:z+64});
 }
 for(z=350;z<FINISH;z+=350)checks.push({z:z,done:false,el:null});
 /* create obstacle divs */
 rocks.forEach(function(r){
  var d=mkDiv('obj',SVG_ROCK);
  placeObj(d,130,110,chanX(r.z)+r.x,0,-r.z);
  r.el=d;
 });
 beans.forEach(function(b){
  var d=mkDiv('obj','<div class="spin" style="width:100%;height:100%">'+SVG_BEAN+'</div>');
  placeObj(d,70,90,chanX(b.z)+b.x,1.1,-b.z);
  b.el=d;
 });
 checks.forEach(function(c){
  var d=mkDiv('obj',svgCheck());
  placeObj(d,760,320,chanX(c.z),0,-c.z);
  c.el=d;
 });
 var f=mkDiv('obj',svgCheck().replace(/CHECK POINT/g,'FINISH'));
 placeObj(f,760,320,chanX(FINISH),0,-FINISH);
 layoutSegs();
}
var raftEl,raftInner;
function buildRaft(){
 raftEl=mkDiv('','');raftEl.id='raft';
 raftInner=document.createElement('div');raftInner.id='raftInner';
 raftInner.innerHTML=SVG_RAFT;raftEl.appendChild(raftInner);
}
function clearObjs(){
 var c=world.children;
 for(var i=c.length-1;i>=0;i--){if(c[i]._tmp)world.removeChild(c[i]);}
}
function reset(){
 px=0;pdist=0;speed=0;gas=100;hearts=3;elapsed=0;started=false;nbeans=0;
 fartCD=0;inv=0;shake=0;squash=0;tiltV=0;camX=chanX(0);segBase=-15;
 clearObjs();buildCourse();updateHearts();updateBeans();
}
/* ================= Input ================= */
var joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
var joy={id:null,dx:0,dy:0},JR=44;
function joyPos(t){
 var r=joyEl.getBoundingClientRect();
 var dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 var d=Math.sqrt(dx*dx+dy*dy);
 if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
 joy.dx=dx/JR;joy.dy=dy/JR;
 knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
joyEl.addEventListener('touchstart',function(e){e.preventDefault();ac();var t=e.changedTouches[0];joy.id=t.identifier;joyPos(t);},{passive:false});
joyEl.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joy.id)joyPos(t);}},{passive:false});
function joyEnd(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===joy.id){joy.id=null;joy.dx=0;joy.dy=0;knob.style.transform='translate(0,0)';}}
joyEl.addEventListener('touchend',joyEnd);joyEl.addEventListener('touchcancel',joyEnd);
/* puffs */
var puffs=[];
function spawnPuffs(){
 var rx=W/2+((chanX(pdist)+px)-camX)*U*0.8,ry=H*0.78;
 for(var i=0;i<10;i++){
  var d=document.createElement('div');d.className='puff';
  var r=8+Math.random()*10;
  d.style.width=d.style.height=r+'px';
  d._p={x:rx+(Math.random()-0.5)*60,y:ry-40,vx:(Math.random()-0.5)*60,vy:-60-Math.random()*60,life:1,r:r};
  gameEl.appendChild(d);puffs.push(d);
 }
}
var fartBtn=document.getElementById('fartbtn');
fartBtn.addEventListener('touchstart',function(e){e.preventDefault();doFart();},{passive:false});
fartBtn.addEventListener('mousedown',function(e){e.preventDefault();doFart();});
function doFart(){
 if(state!=='play'||!started||fartCD>0||gas<12)return;
 ac();fartCD=0.55;gas-=14;speed=Math.min(30,speed+11);fart(true);squash=0.4;shake=Math.max(shake,0.25);
 spawnPuffs();
 fartBtn.classList.add('cd');setTimeout(function(){fartBtn.classList.remove('cd');},550);
}
/* ================= Logic ================= */
function updateHUD(){
 document.getElementById('time').textContent=fmtT(elapsed);
 document.getElementById('gasfill').style.width=gas+'%';
 document.getElementById('progfill').style.width=Math.min(100,pdist/FINISH*100)+'%';
}
function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts));}
function updateBeans(){document.getElementById('beans').textContent='🫘 '+nbeans;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1300);}
function endGame(win){
 state='over';
 document.getElementById('endtitle').textContent=win?'وصلت للنهاية!':'تكسر الطوف!';
 if(win){
  sndWin();var nb=false;
  if(elapsed<best){best=elapsed;nb=true;try{localStorage.setItem('ft_best',String(best));}catch(e){}}
  document.getElementById('endtext').innerHTML='زمنك: <b>'+fmtT(elapsed)+'</b><br>🫘 '+nbeans+'<br>'+(nb?'رقم قياسي جديد!':'أحسن زمن: '+fmtT(best));
 }else{
  sndHit();
  document.getElementById('endtext').innerHTML='قطعت '+Math.floor(pdist)+' متر<br>حاول مرة ثانية!';
 }
 setTimeout(function(){document.getElementById('endsc').classList.remove('hide');},700);
}
function inBoost(z){for(var i=0;i<boosts.length;i++)if(z>boosts[i].z0&&z<boosts[i].z1)return true;return false;}
function update(dt){
 elapsed+=dt;
 if(started){
  px+=joy.dx*15*dt;
  var rowing=Math.max(0,-joy.dy)*4;
  var target=4+rowing;
  if(inBoost(pdist))target=15;
  speed+=(target-speed)*Math.min(1,dt*1.2);
  pdist+=speed*dt;
  if(px>10.5){px=10.5;speed*=0.96;shake=Math.max(shake,0.12);}
  if(px<-10.5){px=-10.5;speed*=0.96;shake=Math.max(shake,0.12);}
  gas=Math.min(100,gas+5*dt);
  if(fartCD>0)fartCD-=dt;
  if(inv>0)inv-=dt;
  tiltV+=((joy.dx*0.28)-tiltV)*Math.min(1,dt*6);
  if(inv<=0)for(var i=0;i<rocks.length;i++){var r=rocks[i];
   var dx=px-r.x,dz=pdist-r.z;
   if(dx*dx+dz*dz<9){
    hearts--;inv=1.5;shake=0.6;sndHit();fart(true);speed*=0.4;updateHearts();toast('اوتش!');
    if(hearts<=0){endGame(false);return;}
    break;
   }}
  for(var m=beans.length-1;m>=0;m--){var b=beans[m];
   var bx=px-b.x,bz=pdist-b.z;
   if(bx*bx+bz*bz<7){gas=Math.min(100,gas+22);nbeans++;sndPick();updateBeans();
    if(b.el){world.removeChild(b.el);}beans.splice(m,1);}}
  for(var ci=0;ci<checks.length;ci++){var cp=checks[ci];
   if(!cp.done&&pdist>=cp.z){cp.done=true;gas=100;sndGate();toast('CHECK POINT!');}}
  if(pdist>=FINISH){endGame(true);return;}
  camX+=((chanX(pdist)+px*0.5)-camX)*Math.min(1,dt*3);
  /* recycle segments */
  var nb=Math.floor((pdist-15)/SEG_L)*SEG_L;
  if(nb!==segBase){segBase=nb;layoutSegs();}
  /* cull far objects */
  var k;
  for(k=0;k<rocks.length;k++){var rk=rocks[k];var dz=rk.z-pdist;rk.el.style.display=(dz<-15||dz>320)?'none':'';}
  for(k=0;k<beans.length;k++){var bn=beans[k];var dz2=bn.z-pdist;bn.el.style.display=(dz2<-15||dz2>320)?'none':'';}
  for(k=0;k<checks.length;k++){var ch=checks[k];var dz3=ch.z-pdist;ch.el.style.display=(dz3<-15||dz3>340)?'none':'';}
 }
 for(var p=puffs.length-1;p>=0;p--){var pt=puffs[p],u=pt._p;
  u.x+=u.vx*dt;u.y+=u.vy*dt;u.vy-=40*dt;u.life-=1.6*dt;
  if(u.life<=0){gameEl.removeChild(pt);puffs.splice(p,1);continue;}
  pt.style.transform='translate('+u.x+'px,'+u.y+'px)';
  pt.style.opacity=Math.max(0,u.life);
 }
 if(squash>0)squash-=dt*2;
 if(shake>0)shake-=dt;
 /* 3D transforms */
 var shx=shake>0?(Math.random()-0.5)*shake*30:0,shy=shake>0?(Math.random()-0.5)*shake*30:0;
 world.style.transform='translate3d('+(-camX*U+shx)+'px,'+(H*0.5+shy)+'px,'+((pdist*U)-150)+'px)';
 var rx=(chanX(pdist)+px);
 raftEl.style.transform='translate3d('+(rx*U)+'px,0px,'+(-pdist*U)+'px)';
 var bob=Math.sin(elapsed*2.2)*6;
 var sq=squash>0?squash:0;
 raftInner.style.transform='rotate('+(tiltV+(shake>0?(Math.random()-0.5)*0.1:0))+'rad) translateY('+bob+'px) scale('+(1+sq*0.25)+','+(1-sq*0.22)+')';
 raftEl.style.opacity=(inv>0&&Math.floor(elapsed*10)%2===0)?0.45:1;
 updateHUD();
}
/* ================= Loop ================= */
var lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!lastT)lastT=t;
 var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
 if(state==='play')update(dt);
 else if(state==='splash'){elapsed+=dt;
  world.style.transform='translate3d('+(-camX*U)+'px,'+(H*0.5)+'px,'+((pdist*U)-150)+'px)';
  raftEl.style.transform='translate3d('+((chanX(0))*U)+'px,0px,0px)';
  raftInner.style.transform='translateY('+(Math.sin(elapsed*2.2)*6)+'px) rotate('+(Math.sin(elapsed*0.9)*0.05)+'rad)';
 }
}
/* ================= UI ================= */
function drawSnd(){document.getElementById('sndbtn').innerHTML=muted?SND_OFF:SND_ON;}
document.getElementById('sndbtn').addEventListener('click',function(e){
 e.stopPropagation();muted=!muted;
 try{localStorage.setItem('ft3d_mute',muted?'1':'0');}catch(e2){}
 drawSnd();if(!muted)sndClick();
});
document.getElementById('startb').addEventListener('click',function(){
 sndClick();ac();
 document.getElementById('splash').classList.add('hide');
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
 toast('ادفع بالضرطة!');
});
document.getElementById('againb').addEventListener('click',function(){
 sndClick();
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
});
/* ================= Init ================= */
resize();drawSnd();buildWorld();buildRaft();reset();state='splash';
requestAnimationFrame(loop);
setTimeout(resize,300);
</script>
</body>
</html>
