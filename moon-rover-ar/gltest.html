<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>فحص 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#111;padding:24px}
#r{max-width:420px;width:100%;border-radius:20px;padding:36px 24px;text-align:center;color:#fff;font-size:22px;font-weight:800;line-height:2;background:#555}
#r small{font-size:13px;font-weight:400;opacity:.85;word-break:break-all}
</style>
</head>
<body>
<div id="r">جاري فحص الـ3D...<br><small>لحظة وحدة</small></div>
<canvas id="c" width="64" height="64" style="position:absolute;opacity:0;pointer-events:none"></canvas>
<script>
(function(){
 var r=document.getElementById('r');
 function ok(msg,info){r.style.background='#2a7a2a';r.innerHTML='✅ '+msg+(info?'<br><small>'+info+'</small>':'');}
 function no(msg,info){r.style.background='#a32a2a';r.innerHTML='❌ '+msg+(info?'<br><small>'+info+'</small>':'');}
 try{
  var c=document.getElementById('c');
  var gl=c.getContext('webgl',{antialias:true})||c.getContext('experimental-webgl');
  if(!gl){no('تلفونك حاجب الـ3D','WebGL غير متوفر — غالباً وضع الإغلاق مفعّل');return;}
  var dbg=gl.getExtension('WEBGL_debug_renderer_info');
  var renderer='';
  try{renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}catch(e){renderer='غير معروف';}
  /* draw a real triangle to prove rendering works */
  var vs=gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}');
  gl.compileShader(vs);
  var fs=gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs,'precision mediump float;void main(){gl_FragColor=vec4(0.2,0.8,0.3,1.0);}');
  gl.compileShader(fs);
  var pr=gl.createProgram();
  gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);gl.useProgram(pr);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0.7,-0.7,-0.7,0.7,-0.7]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.clearColor(0.1,0.1,0.3,1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES,0,3);
  var px=new Uint8Array(4);
  gl.readPixels(32,40,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  if(px[1]>150){ok('تلفونك يدعم الـ3D!','المسرّع: '+renderer);}
  else{no('الـ3D لا يرسم','السياق موجود لكن الرسم فشل');}
 }catch(e){no('خطأ بالفحص',String(e.message||e));}
})();
</script>
</body>
</html>
