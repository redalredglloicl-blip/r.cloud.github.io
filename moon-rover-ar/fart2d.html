<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Fart Together</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0e4a7a}
body{font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
#game{height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;z-index:5;pointer-events:none}
#hudrow{display:flex;gap:8px;align-items:center}
.pill{background:rgba(0,0,0,.5);color:#fff;border-radius:16px;padding:6px 13px;font-weight:800;font-size:14px}
#gasbar{height:12px;background:rgba(0,0,0,.45);border-radius:8px;margin-top:8px;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
#gasfill{height:100%;width:100%;background:linear-gradient(90deg,#a4e34a,#5aa32a);transition:width .15s}
#joy{position:absolute;bottom:26px;left:22px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);z-index:10}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#fartbtn{position:absolute;bottom:30px;right:24px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4f07a,#5aa32a 70%);border:4px solid #fff;z-index:10;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 6px 16px rgba(0,0,0,.4);color:#fff}
#fartbtn:active{transform:scale(.92)}
#fartbtn.cd{filter:grayscale(.7);opacity:.6}
#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(15,70,115,.93),rgba(8,40,75,.96));padding:28px;text-align:center;transition:opacity .4s}
.screen.hide{opacity:0;pointer-events:none}
.screen h1{font-size:38px;color:#a4e34a;text-shadow:0 3px 0 #2a5a10,0 6px 14px rgba(0,0,0,.4)}
.screen h2{font-size:32px;color:#ffd94d;text-shadow:0 3px 0 #7a5a10}
.screen p{color:#fff;font-size:15px;line-height:2.1;text-shadow:0 1px 4px #000}
.bigbtn{background:linear-gradient(180deg,#a4e34a,#5aa32a);color:#fff;border:none;border-radius:24px;padding:16px 64px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #2a5a10}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2a5a10}
.vtag{position:absolute;bottom:8px;left:12px;color:#fff;font-size:11px;font-weight:700;opacity:.65;z-index:6}
#sndbtn{position:absolute;top:64px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;z-index:21}
#sndbtn svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="hudrow">
      <div class="pill" id="dist">1400 م</div>
      <div class="pill" id="time">0:00</div>
      <div class="pill" id="hearts">❤❤❤</div>
    </div>
    <div id="gasbar"><div id="gasfill"></div></div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="fartbtn">💨</div>
  <div id="toast"></div>
  <div id="sndbtn"></div>
  <div class="screen" id="splash">
    <div style="font-size:64px">💨🛶</div>
    <h1>Fart Together 3D</h1>
    <p>🕹️ الجويستك: وجّه الطوف<br>💨 زر الضرطة: دفعة صاروخية!<br>اجمع الفاصوليا للغاز واعبر البوابات<br>احذر الصخور والدوامات — اوصل لخط النهاية!</p>
    <button class="bigbtn" id="startb">انطلق</button>
  </div>
  <div class="screen hide" id="endsc">
    <h2 id="endtitle">وصلت!</h2>
    <p id="endtext"></p>
    <button class="bigbtn" id="againb">العب مرة ثانية</button>
  </div>
  <div class="vtag">v1.4</div>
</div>
<script>
'use strict';
/* ================= Setup ================= */
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,HOR=0,FOCAL=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);HOR=H*0.40;FOCAL=H*1.15;}
addEventListener('resize',resize);
/* ================= Audio ================= */
var AC=null,muted=false;
try{muted=localStorage.getItem('ft3d_mute')==='1';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function noiseBuf(a,dur){var b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2;}return b;}
function fart(big){
 if(muted)return;var a=ac();if(!a)return;
 try{
  var dur=big?0.7:0.42,t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a,dur);
  var f=a.createBiquadFilter();f.type='lowpass';f.Q.value=6;
  f.frequency.setValueAtTime(big?520:720,t);f.frequency.exponentialRampToValueAtTime(85,t+dur);
  var g=a.createGain();
  var lfo=a.createOscillator();lfo.type='square';lfo.frequency.setValueAtTime(big?20:30,t);lfo.frequency.exponentialRampToValueAtTime(9,t+dur);
  var lg=a.createGain();lg.gain.value=0.55;lfo.connect(lg);lg.connect(g.gain);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);
  src.start(t);lfo.start(t);src.stop(t+dur+0.05);lfo.stop(t+dur+0.05);
 }catch(e){}
}
function blip(fr,dur,type,vol,delay){if(muted)return;var a=ac();if(!a)return;try{var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=fr;g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);}catch(e){}}
function sndPick(){blip(660,.09,'sine');blip(920,.1,'sine',.14,.07);}
function sndHit(){blip(130,.28,'sawtooth',.22);}
function sndGate(){blip(784,.12,'triangle');blip(1046,.16,'triangle',.14,.1);}
function sndWin(){var n=[523,659,784,1046,1318];for(var i=0;i<n.length;i++)blip(n[i],.22,'triangle',.16,i*.13);}
function sndClick(){blip(500,.06,'square',.06);}
var SND_ON='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff"/><path d="M16 9 Q19 12 16 15" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
var SND_OFF='<svg viewBox="0 0 24 24"><path d="M4 9 v6 h4 l5 4 V5 L8 9 Z" fill="#fff" opacity=".5"/><path d="M16 9 L22 15 M22 9 L16 15" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* ================= State ================= */
var FINISH=1400;
var state='splash';
var px=0,pdist=0,heading=0,speed=0;
var gas=100,hearts=3,elapsed=0,started=false;
var fartCD=0,inv=0,shake=0,squash=0,tiltV=0;
var obstacles=[],pickups=[],parts=[];
var best=1e9;try{var _b=parseFloat(localStorage.getItem('ft3d_best'));if(_b>0)best=_b;}catch(e){}
function fmtT(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function reset(){
 px=0;pdist=0;heading=0;speed=0;gas=100;hearts=3;elapsed=0;started=false;
 fartCD=0;inv=0;shake=0;squash=0;tiltV=0;
 obstacles=[];pickups=[];parts=[];
 buildCourse();updateHearts();
}
/* ================= Course (world coords: x lateral, z forward distance) ================= */
function buildCourse(){
 /* z = distance ahead */
 for(var z=70;z<FINISH-40;z+=55){
  var lane=(Math.random()-0.5)*40;
  var r=Math.random();
  if(r<0.55)obstacles.push({t:'rock',x:lane,z:z,rad:2.2+Math.random()*1.6});
  else obstacles.push({t:'pool',x:lane,z:z,rad:3.6,ph:Math.random()*6});
  if(Math.random()<0.7)pickups.push({t:'bean',x:(Math.random()-0.5)*44,z:z+24,ph:Math.random()*6});
  if(Math.abs(z%260)<30)obstacles.push({t:'gate',x:(Math.random()-0.5)*30,z:z,passed:false});
 }
 for(var b=40;b<FINISH;b+=80){obstacles.push({t:'buoy',x:-30,z:b,ph:Math.random()*6});obstacles.push({t:'buoy',x:30,z:b,ph:Math.random()*6});}
}
/* ================= Projection: pseudo-3D ================= */
var camX=0;
function proj(x,y,z){
 var depth=z-pdist;
 if(depth<2)return null;
 var s=FOCAL/depth;
 return {x:W/2+(x-camX)*s, y:HOR+(7-y)*s, s:s, d:depth};
}
/* ================= Input ================= */
var joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
var joy={id:null,dx:0,dy:0},JR=44;
function joyPos(t){
 var r=joyEl.getBoundingClientRect();
 var dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 var d=Math.sqrt(dx*dx+dy*dy);
 if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
 joy.dx=dx/JR;joy.dy=dy/JR;
 knob.style.transform='translate('+dx+'px,'+dy+'px)';
}
joyEl.addEventListener('touchstart',function(e){e.preventDefault();ac();var t=e.changedTouches[0];joy.id=t.identifier;joyPos(t);},{passive:false});
joyEl.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===joy.id)joyPos(t);}},{passive:false});
function joyEnd(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===joy.id){joy.id=null;joy.dx=0;joy.dy=0;knob.style.transform='translate(0,0)';}}
joyEl.addEventListener('touchend',joyEnd);joyEl.addEventListener('touchcancel',joyEnd);
var fartBtn=document.getElementById('fartbtn');
fartBtn.addEventListener('touchstart',function(e){e.preventDefault();doFart();},{passive:false});
fartBtn.addEventListener('mousedown',function(e){e.preventDefault();doFart();});
function doFart(){
 if(state!=='play'||!started)return;
 if(fartCD>0||gas<12)return;
 ac();fartCD=0.55;gas-=14;
 speed=Math.min(30,speed+12);
 fart(true);
 for(var i=0;i<9;i++)parts.push({x:px+(Math.random()-0.5)*2,y:0.6,z:pdist+3+Math.random()*2,vx:(Math.random()-0.5)*2,vy:2+Math.random()*2,vz:4+Math.random()*3,life:1,dec:1.3,r:0.5+Math.random()*0.5,c:'#7ec850'});
 squash=0.4;shake=Math.max(shake,0.25);
 fartBtn.classList.add('cd');setTimeout(function(){fartBtn.classList.remove('cd');},550);
}
/* ================= Logic ================= */
function updateHUD(){
 document.getElementById('dist').textContent=Math.max(0,Math.ceil(FINISH-pdist))+' م';
 document.getElementById('time').textContent=fmtT(elapsed);
 document.getElementById('gasfill').style.width=gas+'%';
}
function updateHearts(){document.getElementById('hearts').textContent='❤'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts));}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1300);}
function endGame(win){
 state='over';
 var sc=document.getElementById('endsc');
 document.getElementById('endtitle').textContent=win?'وصلت لخط النهاية!':'تكسر الطوف!';
 if(win){
  sndWin();var nb=false;
  if(elapsed<best){best=elapsed;nb=true;try{localStorage.setItem('ft3d_best',String(best));}catch(e){}}
  document.getElementById('endtext').innerHTML='زمنك: <b>'+fmtT(elapsed)+'</b><br>'+(nb?'رقم قياسي جديد!':'أحسن زمن: '+fmtT(best));
 }else{
  sndHit();
  document.getElementById('endtext').innerHTML='قطعت '+Math.floor(pdist)+' متر<br>حاول مرة ثانية!';
 }
 setTimeout(function(){sc.classList.remove('hide');},700);
}
function update(dt){
 elapsed+=dt;
 if(started){
  heading+=joy.dx*2.0*dt;
  var rowing=Math.max(0,-joy.dy)*5;
  var target=3.4+rowing;
  speed+=(target-speed)*Math.min(1,dt*1.1);
  px+=Math.sin(heading)*speed*dt;
  pdist+=Math.cos(heading)*speed*dt;
  if(px>26){px=26;heading*=0.3;}
  if(px<-26){px=-26;heading*=0.3;}
  gas=Math.min(100,gas+5*dt);
  if(fartCD>0)fartCD-=dt;
  if(inv>0)inv-=dt;
  tiltV+=((joy.dx*0.3)-tiltV)*Math.min(1,dt*6);
  /* whirlpools pull */
  for(var i=0;i<obstacles.length;i++){
   var o=obstacles[i];
   if(o.t==='pool'){
    var dx=px-o.x,dz=pdist-o.z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<10&&d>0.5){px+=dx/d*-20*dt*(1-d/10);heading+=dt*1.2;}
   }
  }
  /* rock collisions */
  if(inv<=0){
   for(var j=0;j<obstacles.length;j++){
    var r2=obstacles[j];
    if(r2.t!=='rock')continue;
    var rx=px-r2.x,rz=pdist-r2.z;
    if(rx*rx+rz*rz<3.2*3.2){
     hearts--;inv=1.5;shake=0.6;sndHit();fart(true);
     speed*=0.35;updateHearts();toast('اوتش!');
     for(var k=0;k<8;k++)parts.push({x:px,y:1,z:pdist,vx:(Math.random()-0.5)*8,vy:3+Math.random()*3,vz:(Math.random()-0.5)*8,life:1,dec:1.8,r:0.5,c:'#bfe6ff'});
     if(hearts<=0){endGame(false);return;}
     break;
    }
   }
  }
  /* pickups */
  for(var m=pickups.length-1;m>=0;m--){
   var q=pickups[m];
   var qx=px-q.x,qz=pdist-q.z;
   if(qx*qx+qz*qz<2.8*2.8){
    gas=Math.min(100,gas+26);sndPick();toast('+ غاز');
    pickups.splice(m,1);
   }
  }
  /* gates */
  for(var n=0;n<obstacles.length;n++){
   var g=obstacles[n];
   if(g.t==='gate'&&!g.passed&&pdist>g.z){
    if(Math.abs(px-g.x)<3.4){g.passed=true;gas=100;sndGate();toast('بوابة! غاز ممتلئ');}
   }
  }
  if(pdist>=FINISH){endGame(true);return;}
 }
 /* camera follows with lag */
 camX+=(px*0.55-camX)*Math.min(1,dt*3);
 /* particles (world) */
 for(var p=parts.length-1;p>=0;p--){
  var pt=parts[p];
  pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.z+=pt.vz*dt;pt.vy-=3*dt;pt.life-=pt.dec*dt;
  if(pt.life<=0)parts.splice(p,1);
 }
 if(squash>0)squash-=dt*2;
 if(shake>0)shake-=dt;
 updateHUD();
}
/* ================= Draw ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-0.5)*shake*26,(Math.random()-0.5)*shake*26);
 /* sky */
 var sky=ctx.createLinearGradient(0,0,0,HOR);
 sky.addColorStop(0,'#3a9ad4');sky.addColorStop(1,'#aee3f5');
 ctx.fillStyle=sky;ctx.fillRect(-30,-30,W+60,HOR+30);
 /* sun */
 ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(W*0.8,HOR*0.35,26,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,243,176,.35)';ctx.beginPath();ctx.arc(W*0.8,HOR*0.35,44,0,7);ctx.fill();
 /* distant clouds */
 ctx.fillStyle='rgba(255,255,255,.9)';
 for(var ci=0;ci<4;ci++){
  var ccx=((ci*173+elapsed*8)%(W+160))-80;
  ctx.beginPath();ctx.ellipse(ccx,HOR*(0.25+ci*0.16),46,14,0,0,7);ctx.fill();
 }
 /* water */
 var wg=ctx.createLinearGradient(0,HOR,0,H);
 wg.addColorStop(0,'#2a8fc4');wg.addColorStop(1,'#0f4d80');
 ctx.fillStyle=wg;ctx.fillRect(-30,HOR-2,W+60,H-HOR+32);
 /* moving wave lines (depth illusion) */
 ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
 var zoff=pdist%14;
 for(var wz=8;wz<220;wz+=14){
  var zz=wz-zoff;if(zz<3)continue;
  var pr=proj(0,0,pdist+zz);if(!pr)continue;
  var ww=pr.s*30;
  ctx.beginPath();
  for(var wx=-ww;wx<=ww;wx+=Math.max(18,pr.s*2)){
   var wy=pr.y+Math.sin(wx*0.05+elapsed*2+zz)*pr.s*0.35;
   if(wx===-ww)ctx.moveTo(W/2+wx,wy);else ctx.lineTo(W/2+wx,wy);
  }
  ctx.stroke();
 }
 /* world objects, far to near */
 var draws=[];
 function addDraw(z,fn){if(z-pdist>2)draws.push({d:z-pdist,fn:fn});}
 obstacles.forEach(function(o){
  if(o.z<pdist+2||o.z>pdist+230)return;
  addDraw(o.z,function(){
   var p=proj(o.x,o.t==='rock'?1.2:0.4,o.z);if(!p)return;
   var s=p.s;
   if(o.t==='rock'){
    ctx.fillStyle='#5d5d6e';
    ctx.beginPath();ctx.arc(p.x,p.y,o.rad*s*0.62,0,7);ctx.fill();
    ctx.fillStyle='#7d7d90';
    ctx.beginPath();ctx.arc(p.x-o.rad*s*0.2,p.y-o.rad*s*0.25,o.rad*s*0.38,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath();ctx.arc(p.x-o.rad*s*0.22,p.y-o.rad*s*0.3,o.rad*s*0.14,0,7);ctx.fill();
    /* water foam */
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=Math.max(1,s*0.12);
    ctx.beginPath();ctx.ellipse(p.x,p.y+o.rad*s*0.5,o.rad*s*0.8,o.rad*s*0.25,0,0,7);ctx.stroke();
   }else if(o.t==='pool'){
    o.ph+=0.05;
    for(var i=3;i>0;i--){
     ctx.strokeStyle='rgba(8,40,70,'+(0.35+i*0.2)+')';ctx.lineWidth=Math.max(2,s*0.28);
     ctx.beginPath();ctx.ellipse(p.x,p.y,o.rad*s*0.62*(i/3),o.rad*s*0.28*(i/3),0,o.ph,o.ph+4.4);ctx.stroke();
    }
   }else if(o.t==='buoy'){
    var bob=Math.sin(elapsed*2+o.ph)*s*0.15;
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();ctx.arc(p.x,p.y+bob,s*0.9,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillRect(p.x-s*0.9,p.y+bob-s*0.28,s*1.8,s*0.56);
    ctx.fillStyle='rgba(0,0,0,.15)';
    ctx.beginPath();ctx.arc(p.x,p.y+bob,s*0.9,0,7);ctx.fill();
   }else if(o.t==='gate'){
    var gh=s*3.6;
    ctx.fillStyle='#8a5a2a';
    ctx.fillRect(p.x-3.4*s-s*0.18,p.y-gh,s*0.36,gh);
    ctx.fillRect(p.x+3.4*s-s*0.18,p.y-gh,s*0.36,gh);
    ctx.fillStyle=o.passed?'#5aa32a':'#a4e34a';
    ctx.fillRect(p.x-3.4*s,p.y-gh,s*6.8,s*0.9);
    ctx.fillStyle='rgba(255,255,255,.7)';
    ctx.font='bold '+(s*0.7)+'px Arial';ctx.textAlign='center';
    if(s>6)ctx.fillText('بوابة',p.x,p.y-gh+s*0.68);
   }
  });
 });
 pickups.forEach(function(o){
  if(o.z<pdist+2||o.z>pdist+230)return;
  addDraw(o.z,function(){
   var p=proj(o.x,0.8,o.z);if(!p)return;
   var s=p.s,bob=Math.sin(elapsed*3+o.ph)*s*0.2;
   ctx.fillStyle='#2e7d32';rr(p.x-s*0.55,p.y-s*0.9+bob,s*1.1,s*1.5,s*0.4);ctx.fill();
   ctx.fillStyle='#66bb6a';rr(p.x-s*0.35,p.y-s*0.7+bob,s*0.7,s*0.5,s*0.2);ctx.fill();
   ctx.fillStyle='#1b5e20';ctx.font='bold '+(s*0.8)+'px Arial';ctx.textAlign='center';
   if(s>7)ctx.fillText('ف',p.x,p.y-s*0.25+bob);
  });
 });
 /* finish arch */
 (function(){
  var fz=FINISH;if(fz<pdist+2||fz>pdist+260)return;
  addDraw(fz,function(){
   var p=proj(0,2,fz);if(!p)return;var s=p.s;
   ctx.fillStyle='#fff';
   ctx.fillRect(p.x-5*s-s*0.3,p.y-5*s,s*0.6,5*s);
   ctx.fillRect(p.x+5*s-s*0.3,p.y-5*s,s*0.6,5*s);
   for(var i=0;i<10;i++){ctx.fillStyle=i%2?'#111':'#fff';ctx.fillRect(p.x-5*s+i*(10*s/10),p.y-5*s,10*s/10,s*1.1);}
  });
 })();
 draws.sort(function(a,b){return b.d-a.d;});
 draws.forEach(function(d){d.fn();});
 /* fart particles (world→screen) */
 parts.forEach(function(pt){
  var p=proj(pt.x,pt.y,pt.z);if(!p)return;
  ctx.globalAlpha=Math.max(0,Math.min(1,pt.life));
  ctx.fillStyle=pt.c;
  ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,pt.r*p.s*pt.life),0,7);ctx.fill();
 });
 ctx.globalAlpha=1;
 /* ===== raft (screen space, always near) ===== */
 var rx=W/2+(px-camX)*FOCAL/14*0.4;
 var ry=H*0.80+Math.sin(elapsed*2.2)*6;
 var R=Math.min(W,H)/3.4;
 ctx.save();ctx.translate(rx,ry);ctx.rotate(tiltV+(shake>0?(Math.random()-0.5)*0.1:0));
 if(inv>0&&Math.floor(elapsed*10)%2===0)ctx.globalAlpha=0.45;
 /* shadow on water */
 ctx.globalAlpha*=1;ctx.fillStyle='rgba(0,40,70,.3)';
 ctx.beginPath();ctx.ellipse(0,R*0.42,R*0.85,R*0.22,0,0,7);ctx.fill();
 /* logs */
 ctx.fillStyle='#5f3c1c';
 rr(-R*0.95,R*0.05,R*1.9,R*0.22,R*0.11);ctx.fill();
 /* planks */
 ctx.fillStyle='#8a5a2a';
 for(var pi=0;pi<5;pi++){var pxx=-R*0.8+pi*(R*1.6/4);rr(pxx-R*0.14,-R*0.42,R*0.28,R*0.62,R*0.1);ctx.fill();}
 ctx.strokeStyle='#3a2410';ctx.lineWidth=3;
 for(var pj=0;pj<5;pj++){var qx=-R*0.8+pj*(R*1.6/4);ctx.strokeRect(qx-R*0.14,-R*0.42,R*0.28,R*0.62);}
 /* character: goofy hippo */
 var sq2=squash>0?1+squash*0.5:1;
 ctx.fillStyle='#9fd8a8';
 ctx.beginPath();ctx.ellipse(0,-R*0.62,R*0.42,R*0.38/sq2,0,0,7);ctx.fill();
 /* head */
 ctx.beginPath();ctx.arc(0,-R*1.02,R*0.30,0,7);ctx.fill();
 /* ears */
 ctx.beginPath();ctx.arc(-R*0.2,-R*1.26,R*0.1,0,7);ctx.arc(R*0.2,-R*1.26,R*0.1,0,7);ctx.fill();
 /* snout */
 ctx.fillStyle='#8bc898';
 ctx.beginPath();ctx.ellipse(0,-R*0.94,R*0.2,R*0.14,0,0,7);ctx.fill();
 ctx.fillStyle='#5a7a5e';
 ctx.beginPath();ctx.arc(-R*0.07,-R*0.94,R*0.035,0,7);ctx.arc(R*0.07,-R*0.94,R*0.035,0,7);ctx.fill();
 /* eyes */
 ctx.fillStyle='#1a1a1a';
 var lk=tiltV*40;
 ctx.beginPath();ctx.arc(-R*0.12+lk,-R*1.06,R*0.045,0,7);ctx.arc(R*0.12+lk,-R*1.06,R*0.045,0,7);ctx.fill();
 /* mouth: O when farting */
 if(squash>0){ctx.fillStyle='#5a2a1a';ctx.beginPath();ctx.ellipse(0,-R*0.82,R*0.07,R*0.1,0,0,7);ctx.fill();}
 /* arms */
 ctx.strokeStyle='#9fd8a8';ctx.lineWidth=R*0.11;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-R*0.36,-R*0.6);ctx.lineTo(-R*0.52,-R*0.3);ctx.stroke();
 ctx.beginPath();ctx.moveTo(R*0.36,-R*0.6);ctx.lineTo(R*0.52,-R*0.3);ctx.stroke();
 ctx.restore();
 /* low gas vignette */
 if(gas<25&&state==='play'){ctx.fillStyle='rgba(200,30,30,'+(0.10+0.07*Math.sin(elapsed*6))+')';ctx.fillRect(0,0,W,H);}
 ctx.restore();
}
/* ================= Loop ================= */
var lastT=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!lastT)lastT=t;
 var dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
 if(state==='play')update(dt);
 else if(state==='splash'){pdist+=dt*2;}
 draw();
}
/* ================= UI ================= */
function drawSnd(){document.getElementById('sndbtn').innerHTML=muted?SND_OFF:SND_ON;}
document.getElementById('sndbtn').addEventListener('click',function(e){
 e.stopPropagation();muted=!muted;
 try{localStorage.setItem('ft3d_mute',muted?'1':'0');}catch(e2){}
 drawSnd();if(!muted)sndClick();
});
document.getElementById('startb').addEventListener('click',function(){
 sndClick();ac();
 document.getElementById('splash').classList.add('hide');
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
 toast('ادفع بالضرطة!');
});
document.getElementById('againb').addEventListener('click',function(){
 sndClick();
 document.getElementById('endsc').classList.add('hide');
 reset();state='play';started=true;
});
/* ================= Init ================= */
resize();drawSnd();reset();state='splash';
requestAnimationFrame(loop);
setTimeout(resize,300);
</script>
