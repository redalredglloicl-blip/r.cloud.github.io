<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>OVERWATCH — Tactical Shooter (mobile trial)</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #8af; background: #000; font-size: 18px; z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="loading">OVERWATCH MOBILE TRIAL v3.1 — جاري التحميل… <span id="pct">0%</span></div>
    <script type="module">
      // Trial loader: reassembles the game bundle from chunks (GitHub API arg limits)
      const CHUNKS = 17;
      const parts = [];
      const pct = document.getElementById('pct');
      for (let i = 0; i < CHUNKS; i++) {
        const name = 'assets/c' + String(i).padStart(2, '0') + '.bin';
        const r = await fetch(name);
        if (!r.ok) throw new Error('missing chunk ' + name);
        parts.push(await r.text());
        pct.textContent = Math.round(((i + 1) / CHUNKS) * 100) + '%';
      }
      const url = URL.createObjectURL(new Blob(parts, { type: 'text/javascript' }));
      document.getElementById('loading').remove();
      await import(url);
    </script>
  </body>
</html>
