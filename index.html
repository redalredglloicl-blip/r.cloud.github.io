<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>عالم ريو 🌍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a;font-family:'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0}
/* ===== شاشة التحميل الاحترافية ===== */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,#1a2b4d 0%,#0b0f1a 65%);color:#fff;padding:24px;text-align:center}
#load .logo{font-size:64px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#load h1{font-size:32px;margin-bottom:4px;background:linear-gradient(90deg,#4fc3f7,#a5ff8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#dlTitle{font-size:16px;color:#cfe3ff;margin:14px 0 6px;font-weight:bold}
#pct{font-size:52px;font-weight:800;color:#fff;margin-bottom:10px;text-shadow:0 0 24px rgba(79,195,247,.5)}
#barWrap{width:min(400px,86vw);height:14px;background:#1a2540;border:1px solid #2a3a55;border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
#bar{height:100%;width:0%;border-radius:10px;background:linear-gradient(90deg,#2e9bd6,#4fc3f7,#a5ff8a);background-size:200% 100%;animation:shimmer 1.6s linear infinite;transition:width .25s}
@keyframes shimmer{to{background-position:-200% 0}}
#dlInfo{font-size:13px;color:#8fa8c8;margin-bottom:6px;direction:ltr}
#dlInfo b{color:#4fc3f7}
#loadMsg{font-size:13px;color:#9fd8ff;line-height:1.8;max-width:430px;min-height:24px}
#loadCtl{margin-top:16px;font-size:12px;color:#5a6f8f;line-height:2}
/* ===== HUD ===== */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#title{position:absolute;top:10px;right:50%;transform:translateX(50%);background:rgba(0,0,0,.5);color:#fff;border-radius:20px;padding:7px 20px;font-size:14px;font-weight:bold}
#credit{position:absolute;bottom:12px;left:10px;color:#ffffff88;font-size:10px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:10px}
#mmap{position:absolute;top:10px;left:10px;width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(5,10,20,.72);box-shadow:0 4px 16px rgba(0,0,0,.4)}
/* ===== الجويستك الجديد ===== */
#touch{position:fixed;inset:0;z-index:25;pointer-events:none;display:none}
#joy{position:absolute;bottom:64px;left:24px;width:128px;height:128px;border-radius:50%;pointer-events:auto;
  background:radial-gradient(circle,rgba(79,195,247,.10) 0%,rgba(79,195,247,.03) 70%);
  border:2px solid rgba(79,195,247,.45);
  box-shadow:0 0 22px rgba(79,195,247,.22),inset 0 0 28px rgba(79,195,247,.10)}
#joy::before{content:'';position:absolute;inset:26px;border-radius:50%;border:1px dashed rgba(79,195,247,.25)}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d6f1ff,#4fc3f7 65%,#2e9bd6);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 6px 18px rgba(79,195,247,.55)}
#jumpBtn{position:absolute;bottom:74px;right:28px;width:76px;height:76px;border-radius:50%;color:#fff;font-size:15px;font-weight:bold;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(165,255,138,.85),rgba(102,187,106,.85));
  border:2px solid rgba(255,255,255,.5);box-shadow:0 6px 18px rgba(102,187,106,.4)}
#jumpBtn:active{transform:scale(.93)}
#msg{position:fixed;top:60px;right:50%;transform:translateX(50%);z-index:30;background:rgba(0,0,0,.75);color:#ffe082;border-radius:12px;padding:10px 20px;font-size:14px;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="game"></div>
<div id="load">
  <div class="logo">🌍</div>
  <h1>عالم ريو</h1>
  <div id="dlTitle">جاري تنزيل الموارد...</div>
  <div id="pct">0%</div>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="dlInfo"><b id="dlDone">0.0</b> / <span id="dlTotal">15.2</span> MB &nbsp;•&nbsp; المتبقي <b id="dlLeft">15.2</b> MB</div>
  <div id="loadMsg"></div>
  <button id="retryBtn" style="display:none;margin-top:14px;padding:12px 30px;border-radius:12px;border:none;background:linear-gradient(135deg,#4fc3f7,#2e9bd6);color:#fff;font-size:15px;font-weight:bold;cursor:pointer">🔄 إعادة المحاولة</button>
  <div id="loadCtl">🕹️ WASD / الأسهم للمشي &nbsp;•&nbsp; Shift للركض &nbsp;•&nbsp; مسافة للقفز &nbsp;•&nbsp; اسحب لتدوير الكاميرا</div>
</div>
<div id="hud">
  <div id="title">🌍 عالم ريو</div>
  <canvas id="mmap" width="132" height="132"></canvas>
  <div id="credit"></div>
</div>
<div id="msg"></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="jumpBtn">قفز</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="game.js"></script>
</body>
</html>
