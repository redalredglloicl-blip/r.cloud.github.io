<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>عالم ريو 🌍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a;font-family:'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0}
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#16213e 0%,#0b0f1a 70%);color:#fff;padding:24px;text-align:center}
#load h1{font-size:30px;margin-bottom:14px}
#barWrap{width:min(380px,84vw);height:10px;background:#1c2946;border-radius:6px;overflow:hidden;margin-bottom:12px}
#bar{height:100%;width:0%;background:linear-gradient(90deg,#4fc3f7,#a5ff8a);border-radius:6px;transition:width .3s}
#loadMsg{font-size:14px;color:#9fd8ff;line-height:1.8;max-width:420px}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#hint{position:absolute;bottom:12px;right:50%;transform:translateX(50%);background:rgba(0,0,0,.5);color:#cfe3ff;border-radius:20px;padding:7px 18px;font-size:12px;white-space:nowrap}
#title{position:absolute;top:10px;right:50%;transform:translateX(50%);background:rgba(0,0,0,.5);color:#fff;border-radius:20px;padding:7px 20px;font-size:14px;font-weight:bold}
#credit{position:absolute;bottom:12px;left:10px;color:#ffffff88;font-size:10px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:10px}
#touch{position:fixed;inset:0;z-index:25;pointer-events:none;display:none}
#joy{position:absolute;bottom:70px;left:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(79,195,247,.5);border:2px solid rgba(255,255,255,.4)}
#jumpBtn{position:absolute;bottom:80px;right:30px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:14px;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#msg{position:fixed;top:60px;right:50%;transform:translateX(50%);z-index:30;background:rgba(0,0,0,.75);color:#ffe082;border-radius:12px;padding:10px 20px;font-size:14px;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="game"></div>
<div id="load">
  <h1>🌍 عالم ريو</h1>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="loadMsg">جاري التحميل...</div>
</div>
<div id="hud">
  <div id="title">🌍 عالم ريو</div>
  <div id="hint">WASD / الأسهم للمشي • Shift للركض • مسافة للقفز • اسحب لتدوير الكاميرا</div>
  <div id="credit"></div>
</div>
<div id="msg"></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div id="jumpBtn">قفز</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="game.js"></script>
</body>
</html>
