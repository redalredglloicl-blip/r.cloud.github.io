<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rio Drive — قد على خرائط حقيقية 🌍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a;font-family:'Segoe UI',Tahoma,Arial,sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0}
/* شاشة البداية */
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#16213e 0%,#0b0f1a 70%);color:#fff;padding:20px;text-align:center}
#start h1{font-size:34px;margin-bottom:6px;background:linear-gradient(90deg,#4fc3f7,#a5ff8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#start p{color:#9fb3c8;font-size:14px;margin-bottom:18px;max-width:420px;line-height:1.8}
#searchRow{display:flex;gap:8px;width:min(420px,92vw);margin-bottom:12px}
#search{flex:1;padding:12px 14px;border-radius:12px;border:1px solid #2a3a55;background:#141d33;color:#fff;font-size:15px;outline:none}
#search:focus{border-color:#4fc3f7}
#goBtn{padding:12px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,#4fc3f7,#2e9bd6);color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
#quickBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.qbtn{padding:8px 14px;border-radius:20px;border:1px solid #2a3a55;background:#141d33;color:#9fd8ff;font-size:13px;cursor:pointer}
.qbtn:active{background:#1d2a45}
#ver{position:absolute;bottom:10px;color:#3a4a63;font-size:11px}
/* شاشة التحميل */
#load{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,16,.92);color:#fff;text-align:center;padding:20px}
.spin{width:54px;height:54px;border:5px solid #22314f;border-top-color:#4fc3f7;border-radius:50%;animation:sp 0.8s linear infinite;margin-bottom:16px}
@keyframes sp{to{transform:rotate(360deg)}}
#loadMsg{font-size:15px;color:#9fd8ff;line-height:1.8}
/* HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#speed{position:absolute;bottom:86px;left:14px;background:rgba(0,0,0,.55);border:1px solid #ffffff22;border-radius:14px;padding:8px 16px;color:#fff;text-align:center}
#speed b{font-size:30px;display:block}#speed span{font-size:11px;color:#9fb3c8}
#loc{position:absolute;top:10px;right:50%;transform:translateX(50%);background:rgba(0,0,0,.55);border:1px solid #ffffff22;color:#fff;border-radius:20px;padding:7px 18px;font-size:13px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#back{position:absolute;top:10px;left:10px;pointer-events:auto;background:rgba(0,0,0,.55);border:1px solid #ffffff22;color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
#newLoc{position:absolute;top:54px;left:10px;pointer-events:auto;background:rgba(79,195,247,.25);border:1px solid #4fc3f755;color:#cfeeff;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
/* أزرار الجوال */
#touch{position:fixed;inset:0;z-index:25;pointer-events:none;display:none}
.tbtn{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.tbtn.on{background:rgba(79,195,247,.45)}
#tUp{bottom:24px;left:24px}#tDown{bottom:24px;left:104px}
#tLeft{bottom:24px;right:104px}#tRight{bottom:24px;right:24px}
#msg{position:fixed;top:64px;right:50%;transform:translateX(50%);z-index:30;background:rgba(0,0,0,.75);color:#ffe082;border-radius:12px;padding:10px 20px;font-size:14px;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="game"></div>

<div id="start">
  <h1>🌍 Rio Drive</h1>
  <p>نسخة تجريبية — سُق سيارتك على <b style="color:#fff">شوارع حقيقية</b> من خرائط OpenStreetMap!<br>اكتب اسم أي مدينة أو منطقة بالعالم وانطلق 🚗💨</p>
  <div id="searchRow">
    <input id="search" placeholder="مثال: بغداد، الكرادة..." value="">
    <button id="goBtn">انطلق 🚀</button>
  </div>
  <div id="quickBtns">
    <button class="qbtn" data-q="بغداد، العراق">🇮🇶 بغداد</button>
    <button class="qbtn" data-q="الكاظمية، بغداد">الكاظمية</button>
    <button class="qbtn" data-q="دبي، الإمارات">دبي</button>
    <button class="qbtn" data-q="القاهرة، مصر">القاهرة</button>
    <button class="qbtn" data-q="إسطنبول، تركيا">إسطنبول</button>
  </div>
  <div id="ver">تجريبي v0.1 — البيانات من OpenStreetMap</div>
</div>

<div id="load"><div class="spin"></div><div id="loadMsg">جاري تحميل الخريطة...</div></div>
<div id="msg"></div>

<div id="hud">
  <div id="loc">📍</div>
  <button id="back">🏠 القائمة</button>
  <button id="newLoc">🗺️ مدينة جديدة</button>
  <div id="speed"><b>0</b><span>كم/س</span></div>
</div>

<div id="touch">
  <div class="tbtn" id="tUp">▲</div><div class="tbtn" id="tDown">▼</div>
  <div class="tbtn" id="tLeft">◀</div><div class="tbtn" id="tRight">▶</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="drive.js"></script>
</body>
</html>
