<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rio iOS — محاكاة آيفون</title>
<meta name="description" content="محاكاة آيفون كاملة بنظام أبل الموحد: شاشة قفل ورئيسية ومركز تحكم وتطبيقات أبل وبطارية حقيقية تستنزف حسب الاستخدام">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:#05070c;font-family:-apple-system,"SF Pro Display","Segoe UI",Tahoma,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#screen{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#000;color:#fff}
@media (min-width:560px) and (min-height:800px){#screen{width:390px;height:844px;border-radius:52px;border:3px solid #2b2f38;box-shadow:0 40px 100px rgba(0,0,0,.85),inset 0 0 0 2px #000}}
.wallpaper{position:absolute;inset:0;background:linear-gradient(165deg,#1c2f6b 0%,#3b4fa0 30%,#7a4d9e 58%,#c65d7b 82%,#e8906f 100%);transition:filter .3s}
.wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(560px 300px at 85% 6%,rgba(255,255,255,.30),transparent 60%),radial-gradient(520px 420px at 6% 82%,rgba(255,190,120,.20),transparent 62%)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:52%;height:27px;background:#000;border-radius:0 0 19px 19px;z-index:85}
.notch::after{content:"";position:absolute;top:8px;left:50%;transform:translateX(28px);width:9px;height:9px;border-radius:50%;background:#16222e;box-shadow:inset 0 0 2px 1px #2a3f55}
.statusbar{position:absolute;top:0;inset-inline:0;height:40px;z-index:80;display:flex;align-items:center;padding:6px 26px 0;font-size:14.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.statusbar .sb-r{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.sbbatt{display:flex;align-items:center;gap:4px}
.sbbatt .shell{width:26px;height:13px;border:1.4px solid rgba(255,255,255,.55);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center}
.sbbatt .fillb{position:absolute;inset:1.6px auto 1.6px 1.6px;background:#fff;border-radius:2px}
.sbbatt .pct{position:relative;font-size:9.5px;font-weight:700;color:#000;mix-blend-mode:screen}
.sbbatt .cap{width:2px;height:5px;background:rgba(255,255,255,.55);border-radius:0 2px 2px 0}
.sbbatt.low .fillb{background:#ff453a}.sbbatt.charge .fillb{background:#30d158}.sbbatt.lpm .fillb{background:#ffd60a}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:rgba(255,255,255,.92);z-index:96;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
/* قفل */
#lock{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(10,10,20,.30);backdrop-filter:blur(18px) brightness(.9);-webkit-backdrop-filter:blur(18px) brightness(.9);transition:transform .6s cubic-bezier(.32,.72,.24,1),opacity .4s}
#lock.unlocked{transform:translateY(-104%);opacity:.3;pointer-events:none}
.lock-faceid{margin:64px auto 0;width:30px;height:30px;opacity:.95}
.lock-date{text-align:center;font-size:16.5px;margin-top:14px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.lock-clock{text-align:center;font-size:86px;font-weight:700;letter-spacing:-1px;line-height:1.02;text-shadow:0 2px 22px rgba(0,0,0,.3)}
.lock-batt{text-align:center;font-size:12.5px;opacity:.9;margin-top:5px}
.lock-notifs{padding:22px 12px 0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}
.lock-notifs::-webkit-scrollbar{display:none}
.lnotif{display:flex;gap:10px;background:rgba(38,38,44,.55);backdrop-filter:blur(16px);border-radius:24px;padding:11px 13px;align-items:flex-start}
.lnotif .nic{width:36px;height:36px;border-radius:9px;flex:none;overflow:hidden}
.lnotif .nic .ric{width:100%;height:100%;display:block}
.lnotif .nt{flex:1;min-width:0}.lnotif .na{font-size:11.5px;opacity:.75;display:flex;justify-content:space-between;text-transform:none}
.lnotif .nb{font-size:14.5px;font-weight:600;margin:0 0 1px}.lnotif .nm{font-size:13.5px;opacity:.92;line-height:1.35}
.lock-bottom{margin-top:auto;padding:0 44px 34px;display:flex;justify-content:space-between;align-items:flex-end}
.lsc{width:48px;height:48px;border-radius:50%;background:rgba(30,30,36,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer}
.lock-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:13.5px;opacity:.95;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.4)}
/* رئيسية */
#home{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;padding:52px 16px 0}
.widgets{display:flex;gap:12px;margin-bottom:16px}
.widget{flex:1;border-radius:22px;padding:13px 15px;background:rgba(28,32,48,.55);backdrop-filter:blur(14px);min-height:86px}
.widget .wv1{font-size:13px;opacity:.85}.widget .wv2{font-size:31px;font-weight:300;margin-top:1px}.widget .wv3{font-size:12px;opacity:.8}
.widget.cal{background:rgba(255,255,255,.92);color:#1c1c1e}
.widget.cal .wv1{color:#ff3b30;font-weight:700;opacity:1}.widget.cal .wv2{font-weight:600}
.home-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:19px 8px;padding:2px 2px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none;font-family:inherit}
.app:active .aic{transform:scale(.86)}
.aic{width:60px;height:60px;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .13s;flex:none}
.aic .ric{width:100%;height:100%;display:block}
.app .an{font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);font-weight:500}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;background:#ff3b30;color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2}
.dock{margin-top:auto;margin-bottom:30px;background:rgba(255,255,255,.22);backdrop-filter:blur(18px);border-radius:26px;padding:10px 12px;display:flex;justify-content:space-around}
.dock .an{display:none}
/* مركز التحكم */
#cc{position:absolute;inset:0;z-index:72;background:rgba(16,18,26,.45);backdrop-filter:blur(28px) brightness(.85);-webkit-backdrop-filter:blur(28px) brightness(.85);transform:translateY(-103%);transition:transform .5s cubic-bezier(.32,.72,.24,1);padding:58px 20px 26px;overflow-y:auto;scrollbar-width:none}
#cc::-webkit-scrollbar{display:none}
#cc.on{transform:translateY(0)}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc-conn{background:rgba(255,255,255,.13);border-radius:26px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-round{width:52px;height:52px;border-radius:50%;border:none;margin:0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
.cc-round.on-blue{background:#0a84ff}.cc-round.on-green{background:#30d158}.cc-round.on-orange{background:#ff9f0a}
.cc-round small{position:absolute}
.cc-music{background:rgba(255,255,255,.13);border-radius:26px;padding:15px;display:flex;flex-direction:column;gap:8px}
.cc-music .mt{display:flex;gap:11px;align-items:center}
.cc-music .alb{width:44px;height:44px;border-radius:9px;background:linear-gradient(140deg,#fc5c7d,#6a82fb);display:flex;align-items:center;justify-content:center;flex:none}
.cc-music b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-music small{font-size:12px;opacity:.65}
.cc-music .mprog{height:4px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.cc-music .mprog i{display:block;height:100%;background:#fff;width:0%}
.cc-music .mctrl{display:flex;justify-content:space-around;align-items:center}
.cc-music .mctrl button{background:none;border:none;color:#fff;cursor:pointer;font-size:17px}
.cc-music .mctrl .play{width:42px;height:42px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:16px}
.cc-sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cc-slider{background:rgba(255,255,255,.13);border-radius:26px;height:150px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.cc-slider .fillv{position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.92)}
.cc-slider span{position:relative;z-index:2;color:#8e8e93}
.cc-slider input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;writing-mode:vertical-lr;direction:rtl}
.cc-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.cc-tile{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#fff;background:none;border:none;font-family:inherit;cursor:pointer}
.cc-tile .tb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.cc-tile.on .tb{background:#0a84ff}
.cc-tile.on-yellow .tb{background:#ffd60a;color:#111}
.cc-batt{margin-top:14px;background:rgba(255,255,255,.13);border-radius:22px;padding:13px 16px;display:flex;align-items:center;gap:11px;font-size:13.5px}
.cc-batt b{font-size:19px;font-weight:600}
/* نوافذ */
.win{position:absolute;inset:0;z-index:55;background:#f2f2f7;color:#1c1c1e;display:none;flex-direction:column;animation:winIn .32s cubic-bezier(.3,.8,.3,1)}
.win.on{display:flex}
.win.dark-app{background:#000;color:#f2f2f7}
@keyframes winIn{from{transform:scale(.93) translateY(28px);opacity:0}to{transform:none;opacity:1}}
.win-head{padding:52px 20px 6px;display:flex;align-items:flex-end;gap:8px;flex:none}
.win-head .bk{color:#0a84ff;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:2px;background:none;border:none;font-family:inherit;padding-bottom:4px}
.win-head .wt{font-size:29px;font-weight:700;flex:1}
.win-body{flex:1;overflow-y:auto;padding:8px 18px 40px;scrollbar-width:none}
.win-body::-webkit-scrollbar{display:none}
.ioslist{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:16px}
.win.dark-app .ioslist{background:#1c1c1e}
.irow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.6px solid rgba(120,120,128,.18);cursor:pointer;min-height:46px}
.irow:last-child{border-bottom:none}
.irow .iic{width:31px;height:31px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.irow .it{flex:1;font-size:15.5px;min-width:0}
.irow .it small{display:block;font-size:12.5px;color:#8e8e93}
.irow .iv{color:#8e8e93;font-size:14.5px}
.irow .chev{color:#c7c7cc;font-size:17px}
.switch{width:51px;height:31px;border-radius:99px;background:#e9e9ea;position:relative;flex:none;transition:.2s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(-20px)}
[dir="ltr"] .switch.on::after{transform:translateX(20px)}
.secttl{font-size:12.5px;color:#6d6d72;margin:14px 18px 6px;text-transform:none}
.homebar-inv{filter:invert(1)}
/* مكونات */
.battbig{text-align:center;padding:8px 0 2px}
.battbig .bp{font-size:54px;font-weight:300;direction:ltr}
.battbig .bs{font-size:13px;color:#8e8e93}
.ubar{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13px}
.ubar .un{width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar .ut{flex:1;height:8px;background:rgba(120,120,128,.2);border-radius:99px;overflow:hidden}
.ubar .ut i{display:block;height:100%;background:#0a84ff;border-radius:99px}
.ubar .uv{width:74px;flex:none;text-align:end;color:#8e8e93;font-size:12px}
.mrow{display:flex;margin:2.5px 0}
.mb{max-width:74%;padding:8px 13px;border-radius:19px;font-size:15px;line-height:1.35}
.mb.them{background:#e9e9eb;color:#000;border-start-start-radius:4px}
.win.dark-app .mb.them{background:#262628;color:#fff}
.mb.me{background:#0a84ff;color:#fff;border-start-end-radius:4px}
[dir="rtl"] .mb.me{margin-inline-end:auto}[dir="rtl"] .mb.them{margin-inline-start:auto}
.msginput{display:flex;gap:9px;padding:10px 2px 2px;align-items:center}
.msginput input{flex:1;border:1.4px solid rgba(120,120,128,.4);border-radius:99px;padding:10px 15px;font-family:inherit;font-size:15px;background:transparent;color:inherit;outline:none}
.msginput button{border:none;background:#0a84ff;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;flex:none;font-size:16px}
.dial-display{direction:ltr;text-align:center;font-size:35px;font-weight:300;padding:16px 0 2px;min-height:58px}
.dial-pad{display:grid;grid-template-columns:repeat(3,78px);gap:9px 14px;justify-content:center;direction:ltr}
.dkey{border:none;background:rgba(120,120,128,.12);font-family:inherit;cursor:pointer;width:78px;height:78px;border-radius:50%;color:inherit}
.dkey b{font-size:27px;font-weight:400;display:block}.dkey small{font-size:9.5px;color:#8e8e93;letter-spacing:2px}
.dkey:active{background:rgba(120,120,128,.3)}
.callbtn{width:64px;height:64px;border-radius:50%;border:none;background:#34c759;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:16px auto 0}
.contact{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:.6px solid rgba(120,120,128,.16);cursor:pointer}
.contact .cv{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;background:linear-gradient(160deg,#a7a7ad,#7d7d83)}
.callscreen{position:absolute;inset:0;background:linear-gradient(170deg,#2c2c34,#101014);color:#fff;z-index:58;display:none;flex-direction:column;align-items:center;padding:120px 30px 70px}
.callscreen.on{display:flex}
.callscreen .cav{width:100px;height:100px;border-radius:50%;background:linear-gradient(160deg,#8e8e96,#5c5c62);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:600;margin-bottom:14px}
.callscreen .cn{font-size:27px;font-weight:500}.callscreen .cs{font-size:14.5px;opacity:.75;margin-top:4px}
.endcall{margin-top:auto;width:64px;height:64px;border-radius:50%;border:none;background:#ff3b30;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transform:rotate(135deg)}
.calc-wrap{padding-top:26px}
.calc-disp{text-align:left;direction:ltr;font-size:58px;font-weight:300;padding:16px 8px;min-height:84px;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;direction:ltr}
.ckey{border:none;font-family:inherit;font-size:19px;height:62px;border-radius:50%;cursor:pointer;background:#333;color:#fff}
.ckey.fn{background:#a5a5a5;color:#000}.ckey.op{background:#ff9f0a;color:#fff;font-size:23px}
.ckey:active{filter:brightness(1.35)}
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5px}
.photos-grid .ph{aspect-ratio:1;border-radius:3px;width:100%}
.phview{position:absolute;inset:0;z-index:57;background:#000;display:none;align-items:center;justify-content:center}
.phview.on{display:flex}.phview img{max-width:100%;max-height:100%}
.phview .phc{position:absolute;top:50px;inset-inline-start:16px;background:rgba(40,40,44,.7);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2}
.camview{flex:1;background:#000;position:relative;overflow:hidden}
.camview video{width:100%;height:100%;object-fit:cover}
.cam-fallback{position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;color:#8e8e93;font-size:14px;padding:26px;text-align:center}
.cam-ui{position:absolute;bottom:0;inset-inline:0;padding:16px 22px 52px;display:flex;align-items:center;justify-content:space-between}
.shutter{width:68px;height:68px;border-radius:50%;border:4.5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
.thumb{width:42px;height:42px;border-radius:9px;border:2px solid #fff;overflow:hidden;background:#333}
.thumb img{width:100%;height:100%;object-fit:cover}
.flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.sw-time{text-align:center;font-size:46px;font-weight:300;padding:14px 0 4px;direction:ltr;font-variant-numeric:tabular-nums}
.sw-btns{display:flex;gap:12px;justify-content:center;padding:8px 0}
.sw-btns button{border:none;font-family:inherit;padding:11px 30px;border-radius:99px;font-size:15px;cursor:pointer;background:rgba(120,120,128,.15);color:inherit}
.sw-btns button.main{background:#34c759;color:#fff}
.banner{position:absolute;top:12px;inset-inline:10px;z-index:90;background:rgba(36,36,42,.82);backdrop-filter:blur(18px);border-radius:26px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 34px rgba(0,0,0,.4);transform:translateY(-150%);opacity:0;transition:.45s cubic-bezier(.3,.9,.3,1);cursor:pointer}
.banner.on{transform:none;opacity:1}
.banner .bt{flex:1;min-width:0}.banner .ba{font-size:11.5px;opacity:.7;display:flex;justify-content:space-between}
.banner .bb{font-size:14.5px;font-weight:600}.banner .bm{font-size:13.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recents{position:absolute;inset:0;z-index:66;background:rgba(10,10,16,.5);backdrop-filter:blur(20px);display:none;flex-direction:column;padding:64px 18px 30px}
.recents.on{display:flex}
.rcard{background:rgba(255,255,255,.14);border-radius:22px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#fff}
.rcard .ric2{width:42px;height:42px;border-radius:11px;overflow:hidden;flex:none}
.rcard span{flex:1;font-size:15px}
.rcard button{background:rgba(255,255,255,.16);border:none;color:#fff;width:31px;height:31px;border-radius:50%;cursor:pointer}
.poweroff{position:absolute;inset:0;background:#000;z-index:200;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#8e8e93;font-size:14.5px;text-align:center;padding:30px}
.poweroff.on{display:flex}
.poweroff button{background:#0a84ff;color:#fff;border:none;padding:13px 28px;border-radius:99px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
#toast{position:absolute;bottom:88px;inset-inline:0;z-index:95;display:flex;justify-content:center;pointer-events:none}
#toast span{background:rgba(30,30,34,.94);color:#f2f2f7;font-size:13.5px;padding:10px 20px;border-radius:99px;opacity:0;transform:translateY(8px);transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.on span{opacity:1;transform:none}
.store-item{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:.6px solid rgba(120,120,128,.16)}
.store-item .si{width:52px;height:52px;border-radius:13px;flex:none;overflow:hidden}
.store-item .sb{flex:1;min-width:0}.store-item .sb b{font-size:15px;display:block;font-weight:600}
.store-item .sb small{font-size:12.5px;color:#8e8e93}
.getbtn{border:none;background:rgba(120,120,128,.16);color:#0a84ff;font-family:inherit;font-weight:700;font-size:13px;padding:7px 20px;border-radius:99px;cursor:pointer;min-width:74px}
.getbtn.done{background:transparent;color:#8e8e93}
.prog{height:4px;background:rgba(120,120,128,.25);border-radius:99px;margin-top:6px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:#0a84ff;border-radius:99px;transition:width .25s}
.wxbig{text-align:center;padding:16px 0 4px}
.wxbig .wt1{font-size:29px;font-weight:600}.wxbig .wt2{font-size:76px;font-weight:200;line-height:1}
.wxhours{display:flex;gap:8px;overflow-x:auto;padding:14px 2px;scrollbar-width:none}
.wxhours::-webkit-scrollbar{display:none}
.wxh{flex:none;text-align:center;background:rgba(255,255,255,.35);border-radius:14px;padding:9px 11px;font-size:12.5px}
textarea.notein{width:100%;min-height:120px;border:none;background:transparent;color:inherit;font-family:inherit;font-size:15.5px;outline:none;resize:vertical}
.safari-start{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:14px 2px}

function drawHomeDock() {
  $('#home-apps').innerHTML = HOME_APPS.map(id => appBtn(APPS.find(a => a.id === id))).join('');
  $('#dock').innerHTML = DOCK.map(id => appBtn(APPS.find(a => a.id === id))).join('');

/* الحاسبة */
let calc={cur:'0',prev:null,op:null,fresh:true};
function calcShow(){ $('#calc-main').textContent=calc.cur; }
function calcCompute(){ const a=parseFloat(calc.prev),b=parseFloat(calc.cur); if(isNaN(a)||isNaN(b)) return calc.cur; let r;
  switch(calc.op){case '+':r=a+b;break;case '−':r=a-b;break;case '×':r=a*b;break;case '÷':r=b===0?NaN:a/b;break;default:return calc.cur;}
  return isNaN(r)?'خطأ':String(Math.round(r*1e10)/1e10); }
$('#win-calc').addEventListener('click',(e)=>{ const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
  if(/[0-9]/.test(k)){ calc.cur=calc.fresh||calc.cur==='0'?k:calc.cur+k; calc.fresh=false; }
  else if(k==='.'){ if(!calc.cur.includes('.')) calc.cur+='.'; calc.fresh=false; }
  else if(k==='AC'){ calc={cur:'0',prev:null,op:null,fresh:true}; }
  else if(k==='⌫'){ calc.cur=calc.cur.length>1?calc.cur.slice(0,-1):'0'; }
  else if(k==='+/-'){ calc.cur=calc.cur.startsWith('-')?calc.cur.slice(1):'-'+calc.cur; }
  else if(k==='%'){ calc.cur=String(parseFloat(calc.cur)/100); }
  else if(k==='='){ if(calc.op){ calc.cur=calcCompute(); calc.prev=null; calc.op=null; calc.fresh=true; } }
  else { if(calc.op&&calc.prev!==null&&!calc.fresh) calc.cur=calcCompute(); calc.prev=calc.cur; calc.op=k; calc.fresh=true; }
  calcShow(); });
calcShow();

let camStream=null, photos=[];
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } const v=$('#camvideo'); if(v) v.style.display='none'; const f=$('#cam-fallback'); if(f) f.style.display='flex'; }
function flashFX(){ const f=$('#flashfx'); if(!f) return; f.style.transition='none'; f.style.opacity=.9; requestAnimationFrame(()=>{ f.style.transition='opacity .45s'; f.style.opacity=0; }); }
function drawPhotos(){ const g=$('#photos-grid'); if(!g) return;
  g.innerHTML=photos.map(p=>p.startsWith('data:')?`<img class="ph" src="${p}" style="object-fit:cover">`:`<div class="ph" style="background:${p}"></div>`).join('')+
   Array.from({length:Math.max(0,9-photos.length)},(_,i)=>`<div class="ph" style="background:linear-gradient(${130+i*37}deg,hsl(${i*41},62%,${40+i*4}%),hsl(${i*41+70},68%,52%))"></div>`).join('');
  const t=$('#cam-thumb'); if(t&&photos.length&&photos[0].startsWith('data:')) t.innerHTML=`<img src="${photos[0]}">`; }
async function snap(){ const video=$('#camvideo'), fb=$('#cam-fallback');
  if(!camStream){ try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); video.srcObject=camStream; video.style.display='block'; fb.style.display='none'; toast('الكاميرا تعمل — اضغط مرة ثانية للتصوير'); return; }
    catch{ const hue=Math.floor(Math.random()*360); photos.unshift(`linear-gradient(150deg,hsl(${hue},62%,42%),hsl(${hue+70},68%,52%))`); drawPhotos(); flashFX(); toast('تم حفظ لقطة تجريبية في الصور'); return; } }
  const c=document.createElement('canvas'); c.width=video.videoWidth||640; c.height=video.videoHeight||480; c.getContext('2d').drawImage(video,0,0);
  photos.unshift(c.toDataURL('image/jpeg',.85)); drawPhotos(); flashFX(); toast('تم الحفظ في الصور'); }

const BATT=(()=>{ let d={level:82,charging:false,lpm:false,usage:{},screen:0,low20:false,low10:false};
  try{ const j=JSON.parse(localStorage.getItem('rioios-batt')||'null'); if(j&&typeof j.level==='number') d=Object.assign(d,j); }catch{} return d; })();
function battSave(){ try{ localStorage.setItem('rioios-batt',JSON.stringify(BATT)); }catch{} }
function battRate(){ let r;
  if(!$('#lock').classList.contains('unlocked')) r=0.003;
  else if(currentWin==='camera') r=0.055;
  else if($('#callscreen').classList.contains('on')) r=0.035;
  else if(currentWin) r=0.017; else r=0.011;
  r*=0.55+(state.brightness/100)*0.9;
  if(state.flash) r+=0.05; if(MEDIA.playing) r+=0.008; if(BATT.lpm) r*=0.45;
  return r; }
const fmtDur=(sec)=>{ const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60); return h>0?`${h} س ${m} د`:`${m} د`; };
function updateBattUI(){ const lv=Math.max(0,Math.min(100,BATT.level));
  const fill=$('#sb-fill'), pct=$('#sb-pct'), shell=$('#sb-batt');
  if(fill){ fill.style.width=`calc(${(lv/100*100).toFixed(0)}% - 3px)`; }
  if(pct) pct.textContent=Math.round(lv);
  if(shell){ shell.classList.toggle('low',lv<=20&&!BATT.charging&&!BATT.lpm); shell.classList.toggle('charge',BATT.charging); shell.classList.toggle('lpm',BATT.lpm&&!BATT.charging); }
  const lb=$('#lock-batt'); if(lb) lb.textContent=BATT.charging?`جارٍ الشحن · ${Math.round(lv)}%`:`الشحن ${Math.round(lv)}%`;
  const bp=$('#set-batt-pct'); if(bp) bp.textContent=Math.round(lv)+'%';
  const bs=$('#set-batt-sub'); if(bs){ bs.textContent=BATT.charging?`جارٍ الشحن — يمتلئ خلال ${fmtDur(Math.max(60,(100-lv)/0.15))} تقريباً`:`متبقّي تقريباً ${fmtDur(lv/battRate())} من الاستخدام الحالي · الشاشة تعمل منذ ${fmtDur(BATT.screen)}`; }
  const cp=$('#cc-batt-pct'); if(cp) cp.textContent=Math.round(lv)+'%';
  battSave(); }
function drawBattUsage(){ const el=$('#batt-usage'); if(!el) return;
  const names={home:'الشاشة الرئيسية',lock:'شاشة القفل'}; APPS.forEach(a=>names[a.id]=a.name);
  const rows=Object.entries(BATT.usage).filter(([,v])=>v>4).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const tot=rows.reduce((t,[,v])=>t+v,0)||1;
  el.innerHTML=rows.map(([id,sec])=>`<div class="ubar"><span class="un">${names[id]||id}</span><span class="ut"><i style="width:${Math.max(4,sec/tot*100)}%"></i></span><span class="uv">${fmtDur(sec)}</span></div>`).join('')
    ||'<p style="font-size:12.5px;color:#8e8e93;padding:6px 2px">استخدم التطبيقات وستظهر هنا إحصائية الاستهلاك الحقيقية</p>'; }
/* بانر إشعار */
let bannerTimer;
function showBanner(n){ const b=$('#banner');
  b.innerHTML=`<div class="nic" style="width:36px;height:36px;border-radius:9px;overflow:hidden;flex:none">${RIC[n.key]||''}</div><div class="bt"><div class="ba"><span>${n.app}</span><span>الآن</span></div><div class="bb">${n.title}</div><div class="bm">${n.msg}</div></div>`;
  b.classList.add('on'); b.onclick=()=>{ b.classList.remove('on'); openApp('msgs'); };
  clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>b.classList.remove('on'),4200); }
function pushNotif(n){ notifs.unshift(n); drawLockNotifs(); if($('#lock').classList.contains('unlocked')) showBanner(n); }
$('#po-charge').addEventListener('click',()=>{ BATT.charging=true; BATT.level=6; BATT.low20=BATT.low10=false; $('#poweroff').classList.remove('on'); unlock(); updateBattUI(); drawCC(); toast('الشاحن موصول — الآيفون يعمل'); });
setInterval(()=>{ if($('#poweroff').classList.contains('on')) return;
  if(BATT.charging){ BATT.level=Math.min(100,BATT.level+0.15);
    if(BATT.level>=100){ BATT.charging=false; const sw=document.querySelector('[data-set="charge"]'); if(sw) sw.classList.remove('on'); pushNotif({app:'النظام',key:'settings',title:'البطارية ممتلئة',msg:'اكتمل الشحن 100% — افصل الشاحن',time:'الآن'}); } }
  else { BATT.level-=battRate();
    const ctx=!$('#lock').classList.contains('unlocked')?'lock':(currentWin||'home');
    BATT.usage[ctx]=(BATT.usage[ctx]||0)+1;
    if($('#lock').classList.contains('unlocked')) BATT.screen++;
    if(BATT.level<=20&&!BATT.low20){ BATT.low20=true; toast('البطارية ٢٠٪ — فعّل نمط الطاقة المنخفضة'); }
    if(BATT.level<=10&&!BATT.low10){ BATT.low10=true; toast('البطارية ١٠٪ — وصّل الشاحن'); }
    if(BATT.level<=0){ BATT.level=0; $('#poweroff').classList.add('on'); stopCam(); } }
  updateBattUI();
  if(MEDIA.playing){ MEDIA.sec++; if(MEDIA.sec>=MEDIA.len){ MEDIA.sec=0; MEDIA.idx=(MEDIA.idx+1)%MEDIA.songs.length; } drawMedia(); }
},1000);
drawSB(); drawCC(); drawBattUsage(); updateBattUI();
setInterval(drawBattUsage,5000);
setTimeout(()=>pushNotif({app:'الرسائل',key:'msgs',title:'أحمد',msg:'وصلت للبيت؟ رد عليّ',time:'الآن'}),45000);
</script>
